    state_class: O(batch)
    bounded_state_dims: {batch: 1}
    transient_factor: 1.0
    state_type: windowed
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'streaming conv/quantize + dedup (P4c).'
      predict: 'per-batch sequence-to-grammar score.'
    primitive_reuse: [strided_view, reduce]
  metrics:
  # v0.9.67: vus_pr primary; auprc demoted (point-level AUPRC inflates
  # shape-anomaly scores; range-awareness of VUS-PR is the fix).
  - name: vus_pr
    combination: anchor
    direction: higher
    responsibility: Volume Under the Surface (window-level PR); primary
      TSAD metric for range-aware shape anomalies (TSB-AD, TAB).
    special: Range-aware; robust to point-level AUPRC inflation on shape
      anomalies. Not numerically comparable to point-wise auprc.
    not_implemented_in_cadw: true
  - name: auprc
    combination: diagnostic
    direction: higher
    responsibility: Point-wise area under PR curve at window resolution.
    special: Point-level AUPRC inflates scores on shape anomalies; use
      for cross-paper UCR comparison only, not as primary.
    not_implemented_in_cadw: true
  - name: best_5_ranking
    combination: diagnostic
    direction: lower
    responsibility: Rank of top-5 detections in ground truth (UCR-style).
    special: Authoritative for UCR paper comparisons; not continuous.
    not_implemented_in_cadw: true
  - name: vus_roc
    combination: diagnostic
    direction: higher
    responsibility: Range-aware ROC-AUC; TSB-AD secondary metric.
    special: Not numerically comparable to point-wise AUC-ROC.
    not_implemented_in_cadw: true
  - name: range_f1
    combination: diagnostic
    direction: higher
    responsibility: Range-aware F1 with tolerance windows (TSB-AD).
    special: Combines precision and recall over anomaly ranges.
    not_implemented_in_cadw: true
  - name: affiliation_f1
    combination: diagnostic
    direction: higher
    responsibility: Affiliation-F1 (TAB/UCR primary for UCR evaluation).
    special: Partial credit for near-miss detections; not comparable to
      range_f1.
    not_implemented_in_cadw: true
  - name: auc_roc
    combination: diagnostic
    direction: higher
    responsibility: Point-wise ROC-AUC (universal baseline).
    special: Overly optimistic under heavy imbalance; prefer vus_roc.
  - name: point_f1
    combination: diagnostic
    direction: higher
    responsibility: Point-wise F1 without tolerance (TSB-AD baseline).
    special: Strict; no credit for near-miss detections.
    not_implemented_in_cadw: true
  ensemble_recommendation:
  - roles:
    - local_structure
    - representation
    - nonlinear_interactions
    models:
    - S2G
    - Sub-PCA
    - EIF
    max_per_role: 1
    note: '3 families: S2G (graph subsequence, uni-only, paper-faithful), Sub-PCA (windowed PCA reconstruction, both uni+multi; multi recall 0.944), EIF (random hyperplane trees, both uni+multi; multi recall 0.864). avg anomaly scores. v0.9.73: Sub-PCA replaced MiniRocket_embedding (uni-only) as multi-capable representation; S2G kept for motif/subsequence on uni, Sub-PCA is the multi-shape workhorse, EIF adds nonlinear_interactions. MiniRocket_embedding, MatrixProfile_discord, zscore, KMeansAD, Autoencoder available as supplementary detectors outside the ensemble.'
