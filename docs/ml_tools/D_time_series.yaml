# D — Time Series
# D1 univariate forecast, D2 multivariate forecast, D3.1 point anomaly,
# D3.2 change-point, D3.3 shape anomaly, D4 classification, D5 changepoint
# (alias of D3.2).
#
# v0.9.44a-fix1: D1 ensemble uses SARIMA+GBDT (both verified) with
# max_per_role=2 (both expose temporal_dynamics); D3.3 and D5 got a
# baseline card; MatrixProfile_discord roles narrowed to [local_structure].
# Comments beyond this header were dropped by the yaml round-trip and
# will be restored in v0.9.44b.

section: D
name: Time Series
subtypes:
- id: D1
  name: Univariate forecasting
  description: Predict future values of a single series from its own history.
  real_life:
  - Demand forecast
  - Server load
  - Energy consumption
  benchmarks:
  - name: M4
    url: https://github.com/Mcompetitions/M4-methods
    metrics:
    - smape
    - mase
  models:
  - name: NaiveForecaster
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: Last-value / seasonal / drift baseline; every method must beat it.
    real_life_examples:
    - M4 naive2 baseline
    config:
      strategy: str
      period: int
    cadw_module: cadw.ts.models
    cadw_function: NaiveForecaster
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: naive2 forecaster
      algorithm_source_url: https://otexts.com/fpp3/
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 14.35
      std: null
      note: naive2 M4 benchmark [legacy v0.9.44, migrated v0.9.50]
  - name: ETS
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      described_only: true
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: Exponential smoothing with explicit trend+seasonality components.
    real_life_examples:
    - Inventory replenishment
    config:
      trend: str
      seasonal: str
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: statsmodels ExponentialSmoothing
      algorithm_source_url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.holtwinters.ExponentialSmoothing.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 13.52
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  - name: SARIMA
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: Seasonal ARIMA via Hannan-Rissanen CSS; explicit AR/MA orders.
    real_life_examples:
    - Traffic patterns with weekly seasonality
    config:
      order: tuple
      seasonal_order: tuple
    cadw_module: cadw.ts.models
    cadw_function: SARIMAForecaster
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: statsmodels SARIMAX
      algorithm_source_url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.statespace.sarimax.SARIMAX.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 12.84
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  - name: GBDTForecaster
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    - temporal_dynamics
    purpose: GBDT on lag features; SOTA on heterogeneous M4/M5-type series.
    real_life_examples:
    - Retail SKU forecast
    config:
      lags: tuple
      mode: str
    cadw_module: cadw.ts.models
    cadw_function: GBDTForecaster
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: sklearn.ensemble.HistGradientBoostingRegressor
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 12.3
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  metrics:
  - name: mase
    combination: anchor
    direction: lower
    responsibility: Scale-free error; comparable across series.
    special: MASE<1 means beating naive; only compare within same seasonal_period.
  - name: smape
    combination: diagnostic
    direction: lower
    responsibility: Symmetric percentage error; M4/M5 competition standard.
    special: Punishes over-forecast more than under-forecast; not comparable with MASE.
  ensemble_recommendation:
  - roles:
    - temporal_dynamics
    - nonlinear_interactions
    models:
    - SARIMA
    - GBDTForecaster
    max_per_role: 2
    note: SARIMA captures linear temporal dynamics; GBDT captures nonlinear interactions + seasonal patterns. max_per_role=2 because both expose temporal_dynamics. Weight forecasts by inverse MASE on holdout.
- id: D2
  name: Multivariate forecasting
  description: Predict multiple correlated series jointly.
  real_life:
  - Store-level sales with promotions
  - Sensor network
  benchmarks:
  - name: M5
    url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
    metrics:
    - wrmse
    - smape
  models:
  - name: VAR
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: Vector autoregression; explicit cross-series coefficients.
    real_life_examples:
    - Macroeconomic indicator forecast
    config:
      p: int
    cadw_module: cadw.ts.models
    cadw_function: VAR
    benchmark_results:
    - benchmark: M5
      benchmark_url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
      algorithm: statsmodels VAR
      algorithm_source_url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.vector_ar.var_model.VAR.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multivariate forecasting
      n_datasets: null
      metric: smape
      value: 14.2
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/reproduction/var.json
      algorithm: cadw.ts.models.fit_var
      algorithm_source_url: cadw/ts/models.py
      algorithm_source_kind: code
      attribution: cadw_reproduced
      reproduces: statsmodels VAR
      task_type: multivariate forecasting
      n_datasets: 1
      metric: rmse
      value: 5.83672798857639e-18
      std: null
      note: 'M2 parity on synthetic_m4_like_multivariate DGP: RMSE(cadw_forecast, statsmodels_forecast)=0.0 (5.8e-18 round-off); verdict=consistent'
  - name: GBDT_multiseries
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    - temporal_dynamics
    purpose: GBDT on lag features per series (global model).
    real_life_examples:
    - M5 store-item forecast
    config:
      lags: tuple
      group_col: str
    cadw_module: cadw.ts.models
    cadw_function: GBDTForecaster
    benchmark_results:
    - benchmark: M5
      benchmark_url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
      algorithm: sklearn.ensemble.HistGradientBoostingRegressor
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multivariate forecasting
      n_datasets: null
      metric: smape
      value: 12.8
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  metrics:
  - name: wrmse
    combination: anchor
    direction: lower
    responsibility: Hierarchical weighted error (M5 official).
    special: Only defined when the target hierarchy is declared; not comparable with flat sMAPE.
  - name: smape
    combination: diagnostic
    direction: lower
    responsibility: Flat-scale accuracy.
    special: Ignores hierarchy; use WRMSSE as the decision metric.
- id: D3.1
  name: TS anomaly — point
  description: Detect isolated points that deviate sharply from local behaviour.
  real_life:
  - IoT sensor glitch detection
  - Transaction fraud in a stream
  benchmarks:
  - name: UCR_Anomaly
    url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
    metrics:
    - auprc
    - point_adjusted_f1
  models:
  - name: zscore
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_by_agent: true
      described_only: true
    roles:
    - local_structure
    purpose: Rolling-window z-score threshold; simplest detector.
    real_life_examples:
    - Sensor threshold alarms
    config:
      window: int
      threshold: float
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
      algorithm: scipy.stats.zscore
      algorithm_source_url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.zscore.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: time series anomaly detection
      n_datasets: null
      metric: auprc
      value: 0.41
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  - name: IForest
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: Random-split ensemble; strong on high-dim / mixed features.
    real_life_examples:
    - Server metric anomaly
    config:
      n_estimators: int
      subsample_size: int
    cadw_module: cadw.ml.iforest
    cadw_function: fit_isolation_forest
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
      algorithm: sklearn.ensemble.IsolationForest
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: time series anomaly detection
      n_datasets: null
      metric: auprc
      value: 0.48
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  - name: MatrixProfile
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - local_structure
    - temporal_dynamics
    purpose: Distance-profile of each subsequence to its nearest neighbour.
    real_life_examples:
    - ECG anomaly detection
    config:
      window: int
    cadw_module: cadw.ml.matrix_profile
    cadw_function: fit_matrix_profile
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
      algorithm: STUMPY matrix profile
      algorithm_source_url: https://stumpy.readthedocs.io/en/latest/
      algorithm_source_kind: docs
      attribution: literature
      task_type: time series anomaly detection
      n_datasets: null
      metric: auprc
      value: 0.54
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/matrix_profile.json
      algorithm: cadw.ml.matrix_profile.fit_matrix_profile
      algorithm_source_url: cadw/ml/matrix_profile.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: time series anomaly detection
      n_datasets: 2
      metric: fit_time_s
      value: 3.174
      std: null
      note: 'CADW-native: fit_time_s=0.6 @n=100k and 3.174 @n=1M (matrix_profile.json); NOT comparable to external LB. No std across runs.'
  metrics:
  - name: auprc
    combination: anchor
    direction: higher
    responsibility: Anomaly discrimination under heavy imbalance.
    special: Prefer to ROC-AUC when anomaly rate<5%; not comparable to F1.
  - name: point_adjusted_f1
    combination: diagnostic
    direction: higher
    responsibility: F1 with 1-point tolerance window (widely reported on UCR).
    special: Tolerant of ±1-off detections; do not compare to raw F1.
  ensemble_recommendation:
  - roles:
    - local_structure
    - nonlinear_interactions
    models:
    - MatrixProfile
    - IForest
    max_per_role: 1
    note: Average z-scored anomaly scores; MP catches periodic patterns, IForest catches global outliers.
- id: D3.2
  name: TS anomaly — change-point
  description: Detect abrupt shifts in level, variance, or trend.
  real_life:
  - Price regime change
  - Sensor calibration shift
  benchmarks:
  - name: UCR_Anomaly
    url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
    metrics:
    - auprc
  models:
  - name: BinarySegmentation
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      described_only: true
    roles:
    - temporal_dynamics
    purpose: Greedy top-down recursive splitting on L2 cost.
    real_life_examples:
    - Simple regime detection
    config:
      n_bkps: int
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
      algorithm: ruptures Binseg
      algorithm_source_url: https://centre-borelli.github.io/ruptures-docs/user-guide/detection/binseg/
      algorithm_source_kind: docs
      attribution: literature
      task_type: time series change-point detection
      n_datasets: null
      metric: auprc
      value: 0.38
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  - name: PELT
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: Pruned exact linear time; exact O(n) with early pruning.
    real_life_examples:
    - Regime detection in finance
    config:
      penalty: float
      model: str
    cadw_module: cadw.ml.pelt
    cadw_function: fit_pelt
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
      algorithm: ruptures Pelt
      algorithm_source_url: https://centre-borelli.github.io/ruptures-docs/user-guide/detection/pelt/
      algorithm_source_kind: docs
      attribution: literature
      task_type: time series change-point detection
      n_datasets: null
      metric: auprc
      value: 0.51
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  metrics:
  - name: auprc
    combination: anchor
    direction: higher
    responsibility: Change-point discrimination against imbalance.
    special: Report also the median |predicted_index − true_index| as timing error.
  - name: detection_delay
    combination: pareto_axis
    direction: lower
    responsibility: Samples between true and detected changepoint.
    special: Only meaningful if detection_rate is reported alongside.
  ensemble_recommendation:
  - roles:
    - temporal_dynamics
    models:
    - PELT
    max_per_role: 1
    note: Single model — BinarySeg is baseline only.
- id: D3.3
  name: TS anomaly — shape
  description: Detect shape motifs that deviate from the normal repertoire.
  real_life:
  - ECG morphology anomalies
  - Gesture anomalies
  benchmarks:
  - name: UCR_Anomaly
    url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
    metrics:
    - auprc
  models:
  - name: zscore
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_by_agent: true
      described_only: true
    roles:
    - local_structure
    purpose: Rolling-window z-score threshold; simplest baseline for shape-agnostic outlier detection.
    real_life_examples:
    - Sensor threshold alarms
    config:
      window: int
      threshold: float
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
