  metrics:
  # v0.9.67: vus_pr primary (TSB-AD + TAB recommended); auprc demoted
  # to diagnostic; point_adjusted_f1 explicitly legacy (gameable).
  - name: vus_pr
    combination: anchor
    direction: higher
    responsibility: Volume Under the Surface (range-aware PR); primary TSAD
      metric recommended by TSB-AD (NeurIPS 2024) and TAB (VLDB 2025).
    special: Range-aware; resistant to best-of-N seed shopping. Not
      comparable to point-wise auprc numerically; report which protocol.
  - name: auprc
    combination: diagnostic
    direction: higher
    responsibility: Point-wise area under PR curve.
    special: Point-wise; ignores anomaly range; prefer vus_pr for
      range-aware anomalies. Not comparable to vus_pr.
  - name: point_adjusted_f1
    combination: diagnostic
    direction: higher
    responsibility: LEGACY — F1 with 1-point tolerance (UCR protocol).
    special: LEGACY and gameable — random ranking hits near-perfect PA-F1
      on long series. Reported only for UCR paper comparison; NOT a
      reliable decision metric.
  - name: recall
    combination: diagnostic
    direction: higher
    responsibility: Fraction of true anomalies flagged; used by CADW
      cadw_measured synthetic-bench entries.
    special: Affected-ratio dependent (spike × window × 2 / n);
      recommended_contamination must exceed affected_ratio.
  - name: vus_roc
    combination: diagnostic
    direction: higher
    responsibility: Range-aware ROC-AUC; TSB-AD secondary metric.
    special: Less imbalance-sensitive than VUS-PR but less discriminative;
      not numerically comparable to point-wise AUC-ROC.
  - name: range_f1
    combination: diagnostic
    direction: higher
    responsibility: Range-aware F1 with tolerance windows (TSB-AD).
    special: Combines precision and recall over anomaly ranges; not
      comparable to point-wise F1.
  - name: affiliation_f1
    combination: diagnostic
    direction: higher
    responsibility: Affiliation-F1 (TAB/UCR primary for UCR evaluation).
    special: Partial credit for near-miss detections; not comparable to
      range_f1.
  - name: auc_roc
    combination: diagnostic
    direction: higher
    responsibility: Point-wise ROC-AUC (universal baseline).
    special: Overly optimistic under heavy imbalance (contamination<5%);
      prefer vus_roc or vus_pr.
  - name: point_f1
    combination: diagnostic
    direction: higher
    responsibility: Point-wise F1 without tolerance (TSB-AD baseline).
    special: Strict; no credit for near-miss detections.
  ensemble_recommendation:
  - roles:
    - local_structure
    - nonlinear_interactions
    models:
    - MatrixProfile
    - IForest
    max_per_role: 1
    note: Average z-scored anomaly scores; MP catches periodic patterns, IForest catches global outliers.
