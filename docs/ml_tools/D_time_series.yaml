    special: Range-aware; resistant to best-of-N seed shopping. Not comparable to point-wise auprc numerically; report which protocol.
    not_implemented_in_cadw: true
  - name: auprc
    combination: diagnostic
    depends_on: []
    direction: higher
    responsibility: Point-wise area under PR curve.
    special: Point-wise; ignores anomaly range; prefer vus_pr for range-aware anomalies. Not comparable to vus_pr.
    not_implemented_in_cadw: true
  - name: point_adjusted_f1
    combination: diagnostic
    depends_on: []
    direction: higher
    responsibility: LEGACY — F1 with 1-point tolerance (UCR protocol).
    special: LEGACY and gameable — random ranking hits near-perfect PA-F1 on long series. Reported only for UCR paper comparison; NOT a reliable decision metric.
    not_implemented_in_cadw: true
  - name: recall
    combination: diagnostic
    direction: higher
    responsibility: Fraction of true anomalies flagged; used by CADW cadw_measured synthetic-bench entries.
    special: Affected-ratio dependent (spike × window × 2 / n); recommended_contamination must exceed affected_ratio.
  - name: vus_roc
    combination: diagnostic
    depends_on: []
    direction: higher
    responsibility: Range-aware ROC-AUC; TSB-AD secondary metric.
    special: Less imbalance-sensitive than VUS-PR but less discriminative; not numerically comparable to point-wise AUC-ROC.
    not_implemented_in_cadw: true
  - name: range_f1
    combination: diagnostic
    depends_on: []
    direction: higher
    responsibility: Range-aware F1 with tolerance windows (TSB-AD).
    special: Combines precision and recall over anomaly ranges; not comparable to point-wise F1.
    not_implemented_in_cadw: true
  - name: affiliation_f1
    combination: diagnostic
    depends_on: []
    direction: higher
    responsibility: Affiliation-F1 (TAB/UCR primary for UCR evaluation).
    special: Partial credit for near-miss detections; not comparable to range_f1.
    not_implemented_in_cadw: true
  - name: auc_roc
    combination: diagnostic
    direction: higher
    responsibility: Point-wise ROC-AUC (universal baseline).
    special: Overly optimistic under heavy imbalance (contamination<5%); prefer vus_roc or vus_pr.
  - name: point_f1
    combination: diagnostic
    depends_on: []
    direction: higher
    responsibility: Point-wise F1 without tolerance (TSB-AD baseline).
    special: Strict; no credit for near-miss detections.
    not_implemented_in_cadw: true
  ensemble_recommendation:
  - roles:
    - temporal_dynamics
    - representation
    - local_structure
    models:
    - DWT-MLEAD
    - Sub-PCA
    - KShapeAD
    max_per_role: 1
    note: '3 complementary inductive biases: DWT-MLEAD (frequency decomposition), Sub-PCA (linear subspace reconstruction), KShapeAD (shape clustering). All verified_in_cadw with cadw_measured recall >= 0.4 on synthetic. avg z-scored anomaly scores. v0.9.72b: IForest and MatrixProfile moved to baseline (out of ensemble) after tier corrections.'
