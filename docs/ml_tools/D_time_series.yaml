    config:
      window: int
      top_k: int
    cadw_module: cadw.ml.matrix_profile
    cadw_function: fit_matrix_profile
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
      algorithm: STUMPY matrix profile
      algorithm_source_url: https://stumpy.readthedocs.io/en/latest/
      algorithm_source_kind: docs
      attribution: literature
      task_type: time series anomaly detection
      n_datasets: null
      metric: auprc
      value: 0.47
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  - name: MiniRocket_embedding
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - representation
    purpose: Random convolutional kernel projection; then outlier score in embedding space.
    real_life_examples:
    - ECG morphology (UCR)
    config:
      num_kernels: int
    cadw_module: cadw.ml.minirocket
    cadw_function: fit_minirocket
    benchmark_results:
    - benchmark: UCR_Anomaly
      benchmark_url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
      algorithm: MiniRocket
      algorithm_source_url: https://arxiv.org/abs/2103.01827
      algorithm_source_kind: paper
      attribution: literature
      task_type: time series anomaly detection
      n_datasets: null
      metric: auprc
      value: 0.5
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  metrics:
  - name: auprc
    combination: anchor
    direction: higher
    responsibility: Subsequence-level anomaly detection.
    special: Point-level AUPRC inflates scores on shape anomalies; report window-level.
  - name: best_5_ranking
    combination: diagnostic
    direction: lower
    responsibility: Rank of top-5 detections in ground truth (UCR-style).
    special: Authoritative for UCR paper comparisons; not continuous.
  ensemble_recommendation:
  - roles:
    - representation
    - local_structure
    models:
    - MiniRocket_embedding
    - MatrixProfile_discord
    max_per_role: 1
    note: Concatenate embeddings + MP distance into a 2D score.
