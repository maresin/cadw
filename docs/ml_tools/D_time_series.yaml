    cadw_function: fit_bocpd
    input_api: dual
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: 3 * n * f64 + posterior_keep * max_run * f64 + 256
    formula_evidence:
      decision_scores: 'bocpd.py -- BOCPDResult: decision_scores (n)*f64'
      labels: 'bocpd.py -- BOCPDResult: labels (n)*i64'
      argmax_run_length: 'bocpd.py -- BOCPDResult: argmax_run_length (n)*i64'
      run_length_posterior: 'bocpd.py -- BOCPDResult: run_length_posterior (_keep, max_run+1)*f64; default posterior_keep=64 -> ~103KB constant, NOT O(n)'
      header: 'bocpd.py -- BOCPDResult: scalars +256'
      not_included: bocpd.py -- changepoints (sparse np.flatnonzero(labels), subset of labels) + R/mu/beta working arrays (O(max_run) hyperparameter)
    min_ram_formula: 3 * n * f64 + posterior_keep * max_run * f64 + 256
