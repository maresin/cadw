      metric: recall
      value: 0.5833
      std: null
      note: 'CADW-native: recall=0.58, fit_time=4.81s, RSS=105MB on gen_ts_shape_anomaly (n=50000). VUS-PR 0.39 U (TSB-AD). Paper-faithful; segments recall 0.58, motifs 0.34 at n=50k.'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: shape
    data_modality: uni
    source_library: native
