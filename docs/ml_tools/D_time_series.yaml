    predict_batched: false
    depends_on: []
    ram_formula: n * f64 + 2 * seasonal_period * f64 + 3.5 * batch * row_size + 256
    formula_evidence:
      state: auto_ets.py:284 -- best_model_.state_nbytes() (delegated)
      header: auto_ets.py:284 -- delegated +256
      guard: auto_ets.fit -- extract_series guards per batch
    min_ram_formula: 3 * 2 * seasonal_period * f64 + 3.5 * row_size + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: bounded_by_domain (DEC-011)
      state_check: 'test_*_state_formula_exact: bit-exact vs state_nbytes()'
      state_ooc: 'test_state_nbytes_grows_linearly: 4x n -> ratio [3.0, 5.5]'
      guard_refuse: 'test_guard_refuses_at_domain_bound: n=500k + 2 MB -> MemoryLimitExceeded'
      cells_passed: 3/3
      runtime_sec: ~2
      fit_transient_note: 'params=''auto'' (default for AutoETS): AICc config enumeration needs full y (_extract_series + _recompute_in_sample), O(n) transient. params=''manual'': O(W_eff) via _collect_last_w.'
    bounded_state_dims:
      seasonal_period: 1
    state_class: O(model)
    state_type: aggregation
    bounded_state: true
    bounded_by_window:
      axis: n
      window_param: max_window
      auto_from_guard: true
      truncation_loss: best ETS candidate fitted on last W_eff (bit-identical n<=W_eff)
      applies_to: params=manual
    n_scalability: linear
    streaming_strategy:
      fit: batched extract_series (O(batch) streaming) + full-series fit. up to 9 sequential ETS fits.
      predict: closed-form extrapolation; O(1) RAM.
    primitive_reuse:
    - reduce
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'AutoETS: AICc-selected ETS. Evaluates up to 9 configurations (trend N/A/Ad x season N/A/M), skips invalid combos (n<2s for seasonal; y<=0 for multiplicative), picks minimum AICc = n*ln(SSE/n) + 2k + 2k(k+1)/(n-k-1) with k = sigma+alpha+[beta]+ [gamma]+[phi]. Falls back to NaiveForecaster(last) if no config fits. Wraps ETSForecaster; same prediction interval logic.'
    real_life_examples:
    - Automatic retail demand forecast (no manual model selection)
    - Batch forecasting where ETS configuration varies per series
    config:
      seasonal_period: int
      warn_slow_fit: bool
      slow_fit_threshold_s: float
    depends_on_status: implemented
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/auto_ets.json
      algorithm: cadw.ts.auto_ets.AutoETSForecaster
      algorithm_source_url: cadw/ts/auto_ets.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: univariate forecasting
      n_datasets: 1
      metric: mase
      value: 0.4998
      std: null
      note: 'CADW-native: MASE=0.4998 on synthetic_seasonal_linear (n=500, seasonal_period=12); 9 configs evaluated, selected ETS(A,A,N) (trend dominates seasonal in this DGP); fit_time 44.1s. WARNING: 44s fit time is slow for n=500 — grid search is O(9 configs * 600 evals * n) Python loop. Backlog item "AutoETS grid search optimization" tracks vectorization / coordinate-descent fix.'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: none
    data_modality: uni
    source_library: native
    evaluation_scope: synthetic
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes:
    - mase
    - fit_time_s
    - peak_rss_mb
    transient_factor: 1.0
    notes: DEPRECATED v0.9.190 - alias for ETSForecaster(params='auto'). Functionally equivalent (shim); ETS card is canonical. Removed in v1.0.0.
    ooc_status: achieved
    ooc_strategy: 'Pattern #2 window. W_eff=max_window from guard (axis=n); truncation loss: best ETS candidate fitted on last W_eff (bit-identical n<=W_eff).'
  - name: Theta
    cadw_module: cadw.ts.theta
    cadw_function: ThetaForecaster
    migration_target: v0.9.191
    input_api: df
    fit_batched: false
    predict_batched: false
    depends_on: []
    ram_formula: n * f64 + 4 * seasonal_period * f64 + 3.5 * batch * row_size + 256
    formula_evidence:
      state: theta.py:221-223 -- y_.nbytes + fitted_.nbytes + 256
      header: theta.py:223 -- +256
      guard: theta.fit -- extract_series + stl_decompose guard
    min_ram_formula: 4 * 2 * seasonal_period * f64 + 3.5 * row_size + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: bounded_by_domain (DEC-011)
      state_check: 'test_*_state_formula_exact: bit-exact vs state_nbytes()'
      state_ooc: 'test_state_nbytes_grows_linearly: 4x n -> ratio [3.0, 5.5]'
      guard_refuse: 'test_guard_refuses_at_domain_bound: n=500k + 2 MB -> MemoryLimitExceeded'
      cells_passed: 3/3
      runtime_sec: ~2
    bounded_state_dims:
      seasonal_period: 1
    state_class: O(model)
    state_type: aggregation
    bounded_state: true
    bounded_by_window:
      axis: n
      window_param: max_window
      auto_from_guard: true
      truncation_loss: STL + Theta fit on last W_eff (bit-identical n<=W_eff)
      applies_to: params=manual
    n_scalability: linear
    streaming_strategy:
      fit: batched extract_series (O(batch) streaming) + full-series fit. STL decompose + SES transient.
      predict: closed-form extrapolation; O(1) RAM.
    primitive_reuse:
    - reduce
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'Theta method (STM variant): STL decomposition -> OLS theta_0 (trend) + SES theta_2 (curvature) -> 0.5/0.5 combine -> reseasonalize. Capability flags: handles_trend=True, handles_seasonality=True. KNOWN LIMITATION: STM underperforms on trend-dominated series (MASE 1.4 vs AutoETS 0.5 on synthetic trend=0.3,season_amp=3) — SES on theta_2 lags behind trend by (1-alpha)/alpha*slope per step; STL fixes decomposition leak but not SES lag. This is the STM baseline; OTM variant (weight optimisation) in backlog. Use for M3-like series where seasonality dominates trend.'
    real_life_examples:
    - M3-competition-style seasonal demand
    - Fast baseline for univariate forecast
    config:
      seasonal_period: int
      n_iter: int
    depends_on_status: implemented
    benchmark_results:
