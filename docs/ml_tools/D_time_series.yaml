  metrics:
  # v0.9.67: auprc kept as anchor (PELT/BinarySeg literature uses it),
  # but NAB added as honest alternative — SKAB changepoint convention.
  - name: auprc
    combination: anchor
    direction: higher
    responsibility: Change-point discrimination against imbalance.
    special: WEAK anchor for changepoint — point-wise auprc ignores
      timing. Prefer NAB + detection_delay when both reported (SKAB).
    not_implemented_in_cadw: true
  - name: nab
    combination: diagnostic
    direction: higher
    responsibility: NAB score (standard Numenta metric); SKAB changepoint
      convention.
    special: Combines false-positive rate and detection delay at
      application profile; ground truth tolerance-window dependent.
    not_implemented_in_cadw: true
  - name: detection_delay
    combination: pareto_axis
    direction: lower
    responsibility: Samples between true and detected changepoint.
    special: Only meaningful if detection_rate is reported alongside.
    not_implemented_in_cadw: true
  - name: range_f1
    combination: diagnostic
    direction: higher
    responsibility: Range-aware F1 with tolerance windows.
    special: For changepoint, report detection_delay alongside; single
      ground-truth point makes range_f1 sensitive to tolerance choice.
    not_implemented_in_cadw: true
  - name: point_f1
    combination: diagnostic
    direction: higher
    responsibility: Point-wise F1 without tolerance.
    special: Strict for changepoint (single timestamp); use
      detection_delay as the timing-aware alternative.
    not_implemented_in_cadw: true
  - name: recall
    combination: diagnostic
    direction: higher
    responsibility: Fraction of true change-points detected within
      tolerance; used by CADW cadw_measured synthetic-bench entries.
    special: Tolerance-window dependent; report detection_delay
      alongside.
  ensemble_recommendation:
  - roles:
    - temporal_dynamics
    - representation
    - probabilistic
    models:
    - PELT
    - T-squared+Q
    - BOCPD
    max_per_role: 1
    note: '3 paradigms: PELT (exact batch pruning, O(n) with early pruning), T-squared+Q (PCA subspace SPC, batch), BOCPD-StudentT (Bayesian online run-length). avg change scores. v0.9.72b: 3-role ensemble after BOCPD implementation + T-squared+Q retier.'
