  metrics:
  - name: mase
    combination: anchor
    direction: lower
    responsibility: Scale-free error; comparable across series.
    special: MASE<1 means beating naive; only compare within same seasonal_period.
  - name: smape
    combination: diagnostic
    direction: lower
    responsibility: Symmetric percentage error; M4/M5 competition standard.
    special: Punishes over-forecast more than under-forecast; not comparable with MASE.
  - name: mape
    combination: diagnostic
    direction: lower
    responsibility: Mean absolute percentage error (%).
    special: NaN when any actual is zero; not comparable across scales.
  - name: rmse
    combination: diagnostic
    direction: lower
    responsibility: Root mean squared error in y units.
    special: Sensitive to outliers; prefer mase for cross-series comparison.
  - name: mae
    combination: diagnostic
    direction: lower
    responsibility: Mean absolute error in y units.
    special: Same units as target; not comparable across different series.
  - name: wape
    combination: diagnostic
    direction: lower
    responsibility: Weighted absolute percentage error (sum|y-f|/sum|y| * 100).
    special: Robust to zeros in actuals (unlike MAPE, which NaNs); NaN when
      sum|y|=0.
  - name: mqlike
    combination: diagnostic
    direction: lower
    responsibility: Mean QLIKE (variance-robust volatility loss).
    special: Requires y>0, f>0; NaN otherwise. Standard for volatility forecast.
  - name: msis
    combination: diagnostic
    direction: lower
    responsibility: Mean Scaled Interval Score (Gneiting & Raftery 2007) — width
      plus penalty for misses at level 1-misis_alpha.
    special: Requires forecaster.prediction_interval; skipped if unsupported.
      Not comparable to point metrics; measures calibration + width.
  - name: pinball
    combination: diagnostic
    direction: lower
    responsibility: Pinball loss at quantile q (a.k.a. quantile loss).
    special: Requires forecaster quantile support; report per-q (pinball_0.1,
      pinball_0.5, pinball_0.9 separately, not summed).
  - name: wql
    combination: diagnostic
    direction: lower
    responsibility: Weighted Quantile Loss (weighted mean pinball across
      quantile levels).
    special: Requires forecaster quantile support and `quantiles` parameter.
      Primary metric for probabilistic forecast in fev-bench (GIFT-Eval-style).
  - name: sql
    combination: diagnostic
    direction: lower
    responsibility: Scaled Quantile Loss (WQL / naive_MAE) — scale-free WQL
      for cross-series comparison.
    special: Requires forecaster quantile support; NaN when naive_MAE=0.
  - name: crps
    combination: diagnostic
    direction: lower
    responsibility: Continuous Ranked Probability Score (approximate from quantile losses; CRPS ~ 2 * mean pinball).
    special: Requires forecaster quantile support; approximate, not exact integral.
  ensemble_recommendation:
  - roles:
    - temporal_dynamics
    - probabilistic
    - nonlinear_interactions
    models:
    - SARIMA
    - AutoTheta
    - GBDTForecaster
    max_per_role: 2
    note: '3 complementary paradigms: SARIMA (temporal_dynamics,
      seasonal ARIMA via Hannan-Rissanen CSS), AutoTheta (probabilistic,
      CV-selected STM/OTM Theta on STL — SOTA-class classical),
      GBDTForecaster (nonlinear_interactions, tree-based on lag features).
      v0.9.78c: AutoTheta replaces AutoETS in the ensemble (both expose
      temporal_dynamics+probabilistic; AutoTheta has better fev MASE
      1.381 vs AutoETS 1.525 and is 5-30x faster). AutoETS remains as
      standalone card. max_per_role=2 because SARIMA and AutoTheta both
      expose temporal_dynamics. Average z-scored point forecasts weighted
      by inverse holdout MASE.'
- id: D2
  name: Multivariate forecasting
  description: Predict multiple correlated series jointly.
  real_life:
  - Store-level sales with promotions
  - Sensor network
  benchmarks:
  - name: M5
    url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
    metrics:
    - wrmse
    - smape
  models:
  - name: VAR
    tier: baseline
    tier_level: tier1_core
    evaluation_scope: both
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: Vector autoregression; explicit cross-series coefficients.
    real_life_examples:
    - Macroeconomic indicator forecast
    config:
      p: int
    cadw_module: cadw.ts.var
    cadw_function: VARModel
    benchmark_results:
    - benchmark: M5
      benchmark_url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
      algorithm: statsmodels VAR
      algorithm_source_url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.vector_ar.var_model.VAR.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multivariate forecasting
      n_datasets: null
      metric: smape
      value: 14.2
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/reproduction/var.json
      algorithm: cadw.ts.models.fit_var
      algorithm_source_url: cadw/ts/models.py
      algorithm_source_kind: code
      attribution: cadw_reproduced
      reproduces: statsmodels VAR
      task_type: multivariate forecasting
      n_datasets: 1
      metric: rmse
      value: 5.83672798857639e-18
      std: null
      note: 'M2 parity on synthetic_m4_like_multivariate DGP: RMSE(cadw_forecast, statsmodels_forecast)=0.0 (5.8e-18 round-off); verdict=consistent'
    state_class: O(N·d)
    bounded_state_dims: {N: 1, d: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    n_scalability: linear
    tier1_core_exception: 'Multivariate time series; VAR regresses N lag-stacked observations of dim d; params d^2*p. n<=1e6 typical.'
    streaming_strategy:
      fit: 'lag-stack full series to (N,p*d), OLS.'
      predict: 'recurrence on lag window.'
    primitive_reuse: [reduce]
  - name: GBDT_multiseries
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    - temporal_dynamics
    purpose: GBDT on lag features per series (global model).
    real_life_examples:
    - M5 store-item forecast
    config:
      lags: tuple
      group_col: str
    cadw_module: cadw.ts.models
    cadw_function: GBDTForecaster
    benchmark_results:
    - benchmark: M5
      benchmark_url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
      algorithm: sklearn.ensemble.HistGradientBoostingRegressor
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multivariate forecasting
      n_datasets: null
      metric: smape
      value: 12.8
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(batch)
    bounded_state_dims: {batch: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'per-series binning + codes ReduceOps via SpillDir.'
      predict: 'per-series tree recursion on batch.'
    primitive_reuse:
    - reduce
    - spill_dir
    - codes_bin
  - name: BVAR
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: draft
      # draft_reason: formula: matrix measurement requires evaluate_formula (v0.9.103)
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: 'Bayesian VAR with Minnesota (random-walk) prior; Normal-Inverted Wishart conjugate posterior. Shrinks coefficients toward random walk, stabilizes forecasts on short series and large panels (Litterman 1986; Banbura-Giannone-Reichlin 2010). Streaming via sufficient statistics XTX/XTY/YTY Reduce.'
    real_life_examples:
    - FRED-MD macroeconomic panel forecasting
    - Central bank short-horizon projections
    config:
      p: int
      lambda1: float
      lambda2: float
      mu: float
    cadw_module: cadw.ts.bvar
    cadw_function: BVARModel
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'per-batch lag-pair extraction + XTX/XTY/YTY Reduce; closed-form Normal-Inverted Wishart posterior (state O(k²·p²) independent of n).'
      predict: 'recursive forecast using posterior mean beta.'
    primitive_reuse:
    - reduce
  - name: VECM
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: draft
      # draft_reason: formula: matrix measurement requires evaluate_formula (v0.9.103)
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: 'Vector Error Correction Model via Johansen MLE; recovers cointegrating relations β and adjustment speeds α for series sharing a stochastic trend. Streaming cross-covariance accumulation + generalized eigenproblem on k×k matrices (Johansen 1988/1991).'
    real_life_examples:
    - Yield curve modeling (level/slope/curvature cointegrated)
    - Pairs trading / spread forecasting
    - Macro panel with cointegrated series
    config:
      k_ar_diff: int
      coint_rank: int
      det_order: int
    cadw_module: cadw.ts.vecm
    cadw_function: VECMModel
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'per-batch cross-cov accumulation (M00/M01/M02/M11/M12/M22) + concentration + generalized eigenproblem on k×k matrices (state O(k²·p²) independent of n).'
      predict: 'error-correction recursion α·βᵀ·Y_{t-1} + Γ·ΔY_lags.'
    primitive_reuse:
    - reduce

  metrics:
  - name: wrmse
    combination: anchor
    direction: lower
    responsibility: Hierarchical weighted error (M5 official).
    special: Only defined when the target hierarchy is declared; not comparable with flat sMAPE.
  - name: smape
    combination: diagnostic
    direction: lower
    responsibility: Flat-scale accuracy.
    special: Ignores hierarchy; use WRMSSE as the decision metric.
  ensemble_recommendation:
  - roles:
    - temporal_dynamics
    models:
    - VAR
    - BVAR
    - VECM
    - GBDT_multiseries
    max_per_role: 4
    note: 'Complementary inductive biases — linear (VAR) + Bayesian shrinkage (BVAR) + cointegration (VECM) + nonlinear lag (GBDT_multiseries). Use VAR/GBDT on stationary panels; BVAR on short samples / large d; VECM when series share a stochastic trend.'

- id: D3.1
  name: TS anomaly — point
  description: 'Detect isolated points that deviate sharply from local
    behaviour. STATIONARITY NOTE: most detectors (Sub-PCA, EIF, KMeansAD,
    Autoencoder, PatchMemoryAD, ZMS, STRAY, KShapeAD, DWT-MLEAD,
    MiniRocket) assume stationary baseline; on trended/seasonal series
    they produce false positives. Wrap in cadw.ml.anomaly_pipeline.
    AnomalyPipeline(detector_fn, mode="contextual", seasonal_period=s)
    to STL-decompose before detection (v0.9.84). Native changepoint
    detectors (PELT, BOCPD, BinSeg, CUSUM, T-squared+Q) handle trend as
    signal — use mode="structural" for them.'
