    evaluation_scope: synthetic
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes:
    - mase
    - fit_time_s
    - peak_rss_mb
    transient_factor: 1.0
    ooc_status: achieved
    ooc_strategy: 'Pattern #2 window. W_eff=max_window from guard (axis=n); truncation loss: STL + Theta fit on last W_eff (bit-identical n<=W_eff).'
  - name: AutoTheta
    cadw_module: cadw.ts.auto_theta
    cadw_function: AutoThetaForecaster
    input_api: df
    fit_batched: false
    predict_batched: false
    depends_on: []
    ram_formula: n * f64 + 4 * seasonal_period * f64 + 3.5 * batch * row_size + 256
    formula_evidence:
      state: auto_theta.py:284-286 -- best_model_.state_nbytes() (delegated)
      header: auto_theta.py:286 -- delegated +256
      guard: auto_theta.fit -- extract_series guards per batch
    min_ram_formula: 4 * 2 * seasonal_period * f64 + 3.5 * row_size + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: bounded_by_domain (DEC-011)
      state_check: 'test_*_state_formula_exact: bit-exact vs state_nbytes()'
      state_ooc: 'test_state_nbytes_grows_linearly: 4x n -> ratio [3.0, 5.5]'
      guard_refuse: 'test_guard_refuses_at_domain_bound: n=500k + 2 MB -> MemoryLimitExceeded'
      cells_passed: 3/3
      runtime_sec: ~2
      fit_transient_note: CV fits each candidate on train_df; _MultiplicativeWrapper streaming since v0.9.193 (no self.y_); CV holdout needs full y (O(n) transient). Merge to Theta(params=auto) v0.9.194 inherits.
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: 'CV-selection over STM/OTM × additive/multiplicative; CV needs full y for holdout split (O(n) transient). _MultiplicativeWrapper refactored v0.9.193: streaming log-transform, no self.y_ persistent. Inner Theta/OTM uses max_window (v0.9.191). Merge to ThetaForecaster(params=''auto'') in v0.9.194 inherits CV transient (honest linear).'
    state_class: O(n)
    bounded_state_dims:
      seasonal_period: 1
    state_type: aggregation
    bounded_state: true
    n_scalability: linear
    tier1_core_exception: Single-series TS; CV folds sequential. Guard refuses at state_limit. bounded_by_domain n<=1e6.
    streaming_strategy:
      fit: batched extract_series (O(batch) streaming) + full-series fit. CV folds sequential.
      predict: closed-form extrapolation; O(1) RAM.
    primitive_reuse:
    - reduce
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'AutoTheta: CV-selected STM vs OTM. Evaluates 4 candidates (STM/OTM x additive/multiplicative); holdout MASE selection; refits winner on full series. STM = fixed w2=0.5; OTM = weight-optimized (w2, alpha). Additive via STL (y=T+S+R); multiplicative via log-transform + additive STL. Skips multiplicative when y<=0. Never worse than best-of-{STM,OTM} on validation by construction. SOTA-class classical forecaster.'
    real_life_examples:
    - Automatic forecasting without manual STM/OTM choice
    - Batch demand forecast with mixed trend/seasonality
    config:
      seasonal_period: int
      val_steps: int
      n_iter: int
    depends_on_status: implemented
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/auto_theta.json
      algorithm: cadw.ts.auto_theta.AutoThetaForecaster
      algorithm_source_url: cadw/ts/auto_theta.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: univariate forecasting
      n_datasets: 2
      metric: mase
      value: 0.2093
      std: null
      note: 'CADW-native: M3-like MASE=0.209 (selected OTM_additive; beats AutoETS 0.276 by 24%, AutoTheta 1.4s vs AutoETS 38.6s); trend-dominated MASE=0.296 (selected OTM; beats STM 0.652 2.2x). HONEST LIMITATION: on M3-like, CV-holdout selected OTM but STM generalized slightly better (0.201 vs 0.209); holdout-selection risk documented. K-fold CV is backlog.'
    - benchmark: fev_bench
      benchmark_url: https://github.com/autogluon/fev
      algorithm: statsforecast AutoTheta
      algorithm_source_url: https://github.com/Nixtla/statsforecast
      algorithm_source_kind: code
      attribution: literature
      task_type: univariate forecasting
      n_datasets: 19
      metric: mase
      value: 1.381
      std: null
      note: 'fev-bench (anofox-forecast head-to-head, 2025): AutoTheta MASE 1.381 (Nixtla fev auto_theta 1.362) — SOTA-class classical, 1.4% behind Nixtla, 5.9% ahead of AutoETS (1.525). Tier3 export reference value; CADW implementation is a practical OTM/STM hybrid, not exact Nixtla port.'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: none
    data_modality: uni
    source_library: native
    evaluation_scope: both
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes:
    - mase
    - fit_time_s
    - peak_rss_mb
    transient_factor: 1.0
    notes: DEPRECATED v0.9.194 - alias for ThetaForecaster(params='auto'). Functionally equivalent (shim); Theta card is canonical. Removed in v1.0.0.
    bounded_by_window:
      axis: n
      window_param: max_window
      auto_from_guard: true
      truncation_loss: STL + Theta fit on last W_eff (bit-identical n<=W_eff)
      applies_to: params=manual
    ooc_status: debt
    ooc_strategy: 'Current: CV-selection over STM/OTM × additive/multiplicative; CV needs full y for holdout split (O(n) transient). _Multiplicative. Guard refuses above state_limit (honest refuse).'
  - name: SARIMA
    cadw_module: cadw.ts.models
    cadw_function: SARIMAForecaster
    input_api: df
    fit_batched: false
    predict_batched: false
    depends_on: []
    ram_formula: (p + q + d + s + 4) * f64 + 3.5 * batch * row_size + 256
    formula_evidence:
      state_p: models.py:1096-1099 -- _last_p_y_centered_.nbytes (p*f64)
      state_q: models.py:1102-1109 -- _last_q_e_.nbytes (q*f64)
      state_d: models.py:1112-1119 -- _y_levels_.nbytes (d*f64)
      state_s: models.py:1121-1129 -- _seas_last_.nbytes (s*f64)
      coeffs: 4*f64 -- self._ar, self._ma, self._y_mean_, self._sigma2
      header: models.py:1188 -- +256 in state_nbytes()
      batch_term: 3.5 * batch * row_size -- _extract_series + _collect_last_w use _check(df._memory_guard, ...)
      released_after_fit: _precompute_predict_state releases _yd (n*f64) and (unless save_y) the full-y buffer; O(n) state is not persistent after fit.
    min_ram_formula: 4 * f64 + 3.5 * row_size + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: component-wise (DEC-033)
      state_check: 'test_state_nbytes_manual_exact: bit-exact (p+q+d+s)*f64+256, parametrized 3 order/n; CW-1'
      state_ooc: 'test_state_nbytes_constant_in_n: state invariant in n (264 B for order=(1,0,0)); CW-11'
      approximation: test_manual_max_window_truncates (CW-3); test_bit_identical_windowed_vs_full (CW-4, atol=1e-9)
      predict: test_predict_out_of_sample_ar1_manual (CW-10, atol=1e-12); test_predict_in_sample_no_df_raises (CW-12); test_predict_in_sample_save_y_legacy (CW-13)
      state_save_y: test_state_save_y_adds_saved (CW-2, +n*f64)
      cells_passed: 6/6
      runtime_sec: ~3
