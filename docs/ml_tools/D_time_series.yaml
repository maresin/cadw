  metrics:
  - name: mase
    combination: anchor
    direction: lower
    responsibility: Scale-free error; comparable across series.
    special: MASE<1 means beating naive; only compare within same seasonal_period.
  - name: smape
    combination: diagnostic
    direction: lower
    responsibility: Symmetric percentage error; M4/M5 competition standard.
    special: Punishes over-forecast more than under-forecast; not comparable with MASE.
  - name: mape
    combination: diagnostic
    direction: lower
    responsibility: Mean absolute percentage error (%).
    special: NaN when any actual is zero; not comparable across scales.
  - name: rmse
    combination: diagnostic
    direction: lower
    responsibility: Root mean squared error in y units.
    special: Sensitive to outliers; prefer mase for cross-series comparison.
  - name: mae
    combination: diagnostic
    direction: lower
    responsibility: Mean absolute error in y units.
    special: Same units as target; not comparable across different series.
  - name: wape
    combination: diagnostic
    direction: lower
    responsibility: Weighted absolute percentage error (sum|y-f|/sum|y| * 100).
    special: Robust to zeros in actuals (unlike MAPE, which NaNs); NaN when sum|y|=0.
  - name: mqlike
    combination: diagnostic
    direction: lower
    responsibility: Mean QLIKE (variance-robust volatility loss).
    special: Requires y>0, f>0; NaN otherwise. Standard for volatility forecast.
  - name: msis
    combination: diagnostic
    direction: lower
    responsibility: Mean Scaled Interval Score (Gneiting & Raftery 2007) — width plus penalty for misses at level 1-misis_alpha.
    special: Requires forecaster.prediction_interval; skipped if unsupported. Not comparable to point metrics; measures calibration + width.
  - name: pinball
    combination: diagnostic
    direction: lower
    responsibility: Pinball loss at quantile q (a.k.a. quantile loss).
    special: Requires forecaster quantile support; report per-q (pinball_0.1, pinball_0.5, pinball_0.9 separately, not summed).
  - name: wql
    combination: diagnostic
    direction: lower
    responsibility: Weighted Quantile Loss (weighted mean pinball across quantile levels).
    special: Requires forecaster quantile support and `quantiles` parameter. Primary metric for probabilistic forecast in fev-bench (GIFT-Eval-style).
  - name: sql
    combination: diagnostic
    direction: lower
    responsibility: Scaled Quantile Loss (WQL / naive_MAE) — scale-free WQL for cross-series comparison.
    special: Requires forecaster quantile support; NaN when naive_MAE=0.
  - name: crps
    combination: diagnostic
    direction: lower
    responsibility: Continuous Ranked Probability Score (approximate from quantile losses; CRPS ~ 2 * mean pinball).
    special: Requires forecaster quantile support; approximate, not exact integral.
  ensemble_recommendation:
  - roles:
    - temporal_dynamics
    - probabilistic
    - nonlinear_interactions
    models:
    - SARIMA
    - AutoTheta
    - GBDTForecaster
    max_per_role: 2
    note: '3 complementary paradigms: SARIMA (temporal_dynamics, seasonal ARIMA via Hannan-Rissanen CSS), AutoTheta (probabilistic, CV-selected STM/OTM Theta on STL — SOTA-class classical), GBDTForecaster (nonlinear_interactions, tree-based on lag features). v0.9.78c: AutoTheta replaces AutoETS in the ensemble (both expose temporal_dynamics+probabilistic; AutoTheta has better fev MASE 1.381 vs AutoETS 1.525 and is 5-30x faster). AutoETS remains as standalone card. max_per_role=2 because SARIMA and AutoTheta both expose temporal_dynamics. Average z-scored point forecasts weighted by inverse holdout MASE.'
- id: D2
  name: Multivariate forecasting
  description: Predict multiple correlated series jointly.
  real_life:
  - Store-level sales with promotions
  - Sensor network
  benchmarks:
  - name: M5
    url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
    metrics:
    - wrmse
    - smape
  models:
  - name: VAR
    cadw_module: cadw.ts.var
    cadw_function: VARModel
    input_api: df
    fit_batched: false
    predict_batched: false
    depends_on: []
    ram_formula: n * k * f64 + k * k * p * f64 + k * f64 + 256
    formula_evidence:
      state: 'var.py:112-116 -- state_nbytes: Y_.nbytes (n*k*f64) + k*k*p*8 + k*8 + 256'
      header: var.py:116 -- +256
      guard: var.py:fit -- _extract_series guards per column
    min_ram_formula: n * k * f64 + k * k * p * f64 + k * f64 + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: bounded_by_domain (DEC-011)
      state_check: 'test_*_state_formula_exact: bit-exact vs state_nbytes()'
      state_ooc: 'test_*_state_grows_linearly: 4x n -> ratio [3.0, 5.5]'
      guard_refuse: 'test_*_guard_refuses_at_domain_bound: n=500k + 2 MB -> MemoryLimitExceeded'
      cells_passed: 3/3
      runtime_sec: ~3
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: Multi-series VAR(p); state = Y_ (n, k) + coef_ (k, k*p) + intercept_ (k) = n*k*f64 + k*k*p*f64 + k*f64 + 256. k, p small (typical k<=10, p<=4); n=1e6, k=2 = 16 MB.
    state_class: O(n)
    bounded_state_dims:
      n: 1
      k: 1
      p: 1
    state_type: aggregation
    bounded_state: false
    n_scalability: linear
    tier1_core_exception: Single-series TS; OLS on (n-p, k*p+1) design + residual (n, k); O(n*k) build. Guard refuses at state_limit.. Guard refuses at state_limit. bounded_by_domain n<=1e6.
    streaming_strategy:
      fit: batched extract_series (O(batch) streaming) + full-series fit. OLS on (n-p, k*p+1) design + residual (n, k); O(n*k) build. Guard refuses at state_limit..
      predict: closed-form extrapolation; O(1) RAM.
    primitive_reuse:
    - reduce
    tier: baseline
    tier_level: tier1_core
    evaluation_scope: both
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - temporal_dynamics
    purpose: Vector autoregression; explicit cross-series coefficients.
    real_life_examples:
    - Macroeconomic indicator forecast
    config:
      p: int
    depends_on_status: implemented
    benchmark_results:
    - benchmark: M5
      benchmark_url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
      algorithm: statsmodels VAR
      algorithm_source_url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.vector_ar.var_model.VAR.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multivariate forecasting
      n_datasets: null
      metric: smape
      value: 14.2
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/reproduction/var.json
      algorithm: cadw.ts.models.fit_var
      algorithm_source_url: cadw/ts/models.py
      algorithm_source_kind: code
      attribution: cadw_reproduced
      reproduces: statsmodels VAR
      task_type: multivariate forecasting
      n_datasets: 1
      metric: rmse
      value: 5.83672798857639e-18
      std: null
      note: 'M2 parity on synthetic_m4_like_multivariate DGP: RMSE(cadw_forecast, statsmodels_forecast)=0.0 (5.8e-18 round-off); verdict=consistent'
    transient_factor: 1.0
    ooc_status: debt
    ooc_strategy: 'Current: Multi-series VAR(p); state = Y_ (n, k) + coef_ (k, k*p) + intercept_ (k) = n*k*f64 + k*k*p*f64 + k*f64 + 256. k, p small. Guard refuses above state_limit (honest refuse).'
  - name: GBDT_multiseries
    cadw_module: cadw.ts.models
    cadw_function: GBDTForecaster
    input_api: df
    fit_batched: true
    predict_batched: false
    depends_on: []
    ram_formula: n_horizons * n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256
    formula_evidence:
      trees: cadw.ts.models:_NumpyReg per horizon × per group -- state_nbytes
      forecaster: cadw.ts.models:GBDTForecaster.state_nbytes -- sum
      header: cadw.ts.models:GBDTForecaster.state_nbytes -- +256
    min_ram_formula: n_horizons * n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: component-wise (DEC-033)
      state_check: 'test_state_within_upper_bound: actual ∈ [0.20, 1.0] of upper_bound'
      state_ooc: 'test_state_independent_of_n: n=500 vs n=5000 -> ratio <=3.0'
      lazy: 'test_state_zero_before_predict_horizons_none: Lazy; group_col variant. Same class as GBDTForecaster.'
      eager: 'test_state_after_eager_fit: horizons=3 -> state>0'
      guard_refuse: 'test_guard_refuses_during_fit: n=200 + horizons=20 + 0.001 MB -> MemoryLimitExceeded'
      cells_passed: 3/3
      runtime_sec: ~4
    bounded_state: true
    bounded_state_dims:
      n_estimators: 1
      max_depth: 1
      n_horizons: 1
      d: 1
    state_class: O(model)
    state_type: iterative
    n_scalability: constant
    tier1_core_exception: 'Tree-ensemble state bounded by {n_estimators: 1, max_depth: 1, n_horizons: 1, d: 1}; per-group per-horizon training: lag matrix per group; GBDT hist. n-independent.'
    streaming_strategy:
      fit: 'extract_series (O(batch)) -> lag matrix build. Per-horizon GBDT: per-tree Reduce on histograms. per-group per-horizon training: lag matrix per group; GBDT hist.'
      predict: per-horizon single-row tail_features -> GBDT descend; O(steps × trees). Full _extract_series at fit-time only.
    primitive_reuse:
    - reduce
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - nonlinear_interactions
    - temporal_dynamics
    purpose: GBDT on lag features per series (global model).
    real_life_examples:
    - M5 store-item forecast
    config:
      lags: tuple
      group_col: str
    benchmark_results:
    - benchmark: M5
      benchmark_url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
      algorithm: sklearn.ensemble.HistGradientBoostingRegressor
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multivariate forecasting
      n_datasets: null
      metric: smape
      value: 12.8
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    transient_factor: 1.0
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state n_estimators:1, max_depth:1, n_horizons:1, d:1; independent of n. Module: cadw.ts.models.'
  - name: BVAR
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - temporal_dynamics
    purpose: Bayesian VAR with Minnesota (random-walk) prior; Normal-Inverted Wishart conjugate posterior. Shrinks coefficients toward random walk, stabilizes forecasts on short series and large panels (Litterman 1986; Banbura-Giannone-Reichlin 2010). Streaming via sufficient statistics XTX/XTY/YTY Reduce.
    real_life_examples:
    - FRED-MD macroeconomic panel forecasting
    - Central bank short-horizon projections
    config:
      p: int
      lambda1: float
      lambda2: float
      mu: float
    cadw_module: cadw.ts.bvar
    cadw_function: BVARModel
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: ((1 + k * p) * k + k * p + 256) * f64 + 2 * batch * row_size
    formula_evidence:
      state_beta: 'bvar.py state_nbytes: beta_post((1+k*p), k) = (1+k*p)*k*f64'
      state_last_p: 'bvar.py state_nbytes: last_p_ buffer (k, p) = k*p*f64'
      header: 'bvar.py state_nbytes: +256 (header)'
      batch_transient: bvar.py:126 check_batch(extra_factor=2.0) per batch; 2 * batch * row_size
      fit_guard_state: bvar.py:117 check_state(est_state) where est_state = (m*m+m*k+k*k+k*p+512)*8 (conservative upper bound)
      fit_guard_batch: bvar.py:126 check_batch(extra_factor=2.0)
    min_ram_formula: ((1 + k * p) * k + k * p + 256) * f64 + 2 * 1 * row_size
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: component-wise (DEC-033)
      state_check: 'test_state_nbytes_exact: ((1+k*p)*k + k*p + 256) * 8, parametrized (k,p)'
      state_ooc: 'test_state_independent_of_n: n=500 vs 5000 -> unchanged'
      ooc: 'test_ooc_batch_fixed: n=50k/n=10k ratio<2.0 at bs=1000, median-of-3'
      guard_refuse: 'test_guard_refuses_at_tight: budget=0.2MB < state -> MemoryLimitExceeded'
      cells_passed: 5/5
      runtime_sec: ~1
    state_class: O(model)
    bounded_state_dims:
      k: 2
      p: 1
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: per-batch lag-pair extraction + XTX/XTY/YTY Reduce; closed-form Normal-Inverted Wishart posterior (state O(k²·p²) independent of n). batch_size auto-derive via mg.get_batch_rows (v0.9.139 DEC-023 pattern).
      predict: recursive forecast using posterior mean beta.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state k:2, p:1; independent of n. Module: cadw.ts.bvar.'
  - name: VECM
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - temporal_dynamics
    purpose: Vector Error Correction Model via Johansen MLE; recovers cointegrating relations β and adjustment speeds α for series sharing a stochastic trend. Streaming cross-covariance accumulation + generalized eigenproblem on k×k matrices (Johansen 1988/1991).
    real_life_examples:
    - Yield curve modeling (level/slope/curvature cointegrated)
    - Pairs trading / spread forecasting
    - Macro panel with cointegrated series
    config:
      k_ar_diff: int
      coint_rank: int
      det_order: int
    cadw_module: cadw.ts.vecm
    cadw_function: VECMModel
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: (4 * k * k + k * r + 256) * f64 + 2 * batch * row_size
    formula_evidence:
      state_beta_alpha: 'vecm.py state_nbytes: 3*k*k (beta_ + alpha_ + gamma_) + k*k (S00/S01/S11 temps) = 4*k*k*f64'
      state_coint: 'vecm.py state_nbytes: k*r (cointegration rank dims) = k*r*f64'
      header: 'vecm.py state_nbytes: +256'
      batch_transient: vecm.py:131 check_batch(extra_factor=2.0) per batch
      fit_guard_state: vecm.py:105 check_state(est_state) conservative upper bound
      fit_guard_batch: vecm.py:131 check_batch(extra_factor=2.0)
    min_ram_formula: (4 * k * k + k * r + 256) * f64 + 2 * 1 * row_size
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: component-wise (DEC-033)
      state_check: 'test_state_nbytes_exact: (4*k*k + k*r + 256) * 8, parametrized (k,r,p)'
      state_ooc: test_state_independent_of_n
      ooc: 'test_ooc_batch_fixed: n=50k/n=10k ratio<2.0 at bs=1000, median-of-3'
      guard_refuse: 'test_guard_refuses_at_tight: budget=0.02MB < state -> MemoryLimitExceeded'
      cells_passed: 5/5
      runtime_sec: ~1
    state_class: O(model)
    bounded_state_dims:
      k: 2
      r: 1
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: per-batch cross-cov accumulation (M00/M01/M02/M11/M12/M22) + concentration + generalized eigenproblem on k×k matrices (state O(k²·p²) independent of n). batch_size auto-derive v0.9.139 (DEC-023 pattern).
      predict: error-correction recursion α·βᵀ·Y_{t-1} + Γ·ΔY_lags.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state k:2, r:1; independent of n. Module: cadw.ts.vecm.'
