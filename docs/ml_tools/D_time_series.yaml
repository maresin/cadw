    measurement:
      verification_mode: component-wise (DEC-033)
      state_check: 'test_state_nbytes_exact: bit-exact via BOCPDResult.state_nbytes()'
      state_ratio_linear: 'test_state_ratio_linear: 10x n -> [8,12]x state (linear in n, NOT O(n*max_run) because compact mode keeps R_hist constant)'
      peak_not_quadratic: 'test_peak_not_quadratic: ratio < 15 at 10x n, max_run=30 to keep Python loop fast'
      tight_guard: 'test_tight_guard_raises: MemoryLimitExceeded via duck-typed guard (est_bytes check)'
      cells_passed: 4/4
      runtime_sec: ~20
      note: state_class O(n) honest (3 n-sized outputs). bounded_by_domain n<=1e6 (TSB-AD/UCR/NAB typical). CoxPH v0.9.114 precedent. full_posterior=True -> O(n*max_run) quadratic, documented limitation.
