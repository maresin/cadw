    primitive_reuse: []
  - name: GBDTForecaster
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: 'GBDT on lag features; SOTA on heterogeneous M4/M5-type
      series. v0.9.76c: role temporal_dynamics removed — GBDTForecaster
      captures nonlinear_interactions in lag-feature space; temporal
      structure is implicit in lag features, not a native
      temporal_dynamics model (SARIMA/AutoETS are the temporal_dynamics
      representatives). Enables 3-role ensemble in D1.'
    real_life_examples:
    - Retail SKU forecast
    config:
      lags: tuple
      mode: str
    cadw_module: cadw.ts.models
    cadw_function: GBDTForecaster
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: sklearn.ensemble.HistGradientBoostingRegressor
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 12.3
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  # ==========================================================================
  # v0.9.75: SOTA horizon (tier3_export — reference only, not implemented)
  # Covers pre-trained foundation models + stack-ensemble approach.
  # Rationale: without these, D1 matrix has no view of the 2025/2026 SOTA.
  # All cards documented_only; excluded from ensemble_recommendation (rule).
  # ==========================================================================
    state_class: O(batch)
    bounded_state_dims: {batch: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'binning + codes ReduceOps via SpillDir (P1a path); per-horizon models trained on batches.'
