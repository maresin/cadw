      note: 'CADW-native MULTI-CHANNEL SHAPE: recall=0.78 (195/250), fit_time=1.32s, RSS=17MB on gen_ts_shape_anomaly_multi (n=5000, c=3).'
    model_class: dl_from_scratch
    learning_mode: unsupervised
