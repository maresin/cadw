# D — Time Series
# D1 univariate forecast, D2 multivariate forecast, D3.1 point anomaly,
# D3.2 change-point, D3.3 shape anomaly, D4 classification, D5 changepoint
# (alias of D3.2).
#
# v0.9.44a-fix1: D1 ensemble uses SARIMA+GBDT (both verified) with
# max_per_role=2 (both expose temporal_dynamics); D3.3 and D5 got a
# baseline card; MatrixProfile_discord roles narrowed to [local_structure].
# Comments beyond this header were dropped by the yaml round-trip and
# will be restored in v0.9.44b.

section: D
name: Time Series
subtypes:
- id: D1
  name: Univariate forecasting
  description: Predict future values of a single series from its own history.
  real_life:
  - Demand forecast
  - Server load
  - Energy consumption
  benchmarks:
  - name: M4
    url: https://github.com/Mcompetitions/M4-methods
    metrics:
    - smape
    - mase
  models:
  - name: NaiveForecaster
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    purpose: Last-value / seasonal / drift baseline; every method must beat it.
    real_life_examples:
    - M4 naive2 baseline
    config:
      strategy: str
      period: int
    cadw_module: cadw.ts.models
    cadw_function: NaiveForecaster
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: naive2 forecaster
      algorithm_source_url: https://otexts.com/fpp3/
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 14.35
      std: null
      note: naive2 M4 benchmark [legacy v0.9.44, migrated v0.9.50]
    state_class: O(1)
    bounded_state_dims: {}
    transient_factor: 1.0
    state_type: elementwise
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'keep last value + seasonal window (period ticks).'
      predict: 'repeat last / seasonal / drift step.'
    primitive_reuse: [reduce]
  - name: ETS
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      described_only: false
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'Holt-Winters exponential smoothing (additive-error, additive/multiplicative seasonality, damped trend). Classical decomposition init + bounded Nelder-Mead grid search over (alpha, beta, gamma, phi); analytic Gaussian prediction intervals. Reference: Hyndman et al. 2002.'
    real_life_examples:
    - Inventory replenishment
    - Retail demand forecast
    config:
      seasonal_period: int
      seasonal: str
      trend: bool
      damped: bool
    cadw_module: cadw.ts.ets
    cadw_function: ETSForecaster
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: statsmodels ExponentialSmoothing
      algorithm_source_url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.holtwinters.ExponentialSmoothing.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 13.52
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/ets.json
      algorithm: cadw.ts.ets.ETSForecaster
      algorithm_source_url: cadw/ts/ets.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: univariate forecasting
      n_datasets: 3
      metric: fit_time_s
      value: 17.153
      std: null
      note: 'CADW-native: fit_predict_s=0.18/1.74/17.15 @n=500/5k/50k (seasonal_period=12; scripts/bench_ets.py, .pingis/benches/ets.json). Residual sigma=0.61/0.54/0.52. Peak RSS 4.9/0.1/1.4 MB. Hardware-specific; NOT comparable to external LB. Range 1000x across n - O(n * grid_size) fit; no cross-n comparable fit_time.'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: none
    data_modality: uni
    source_library: native
    evaluation_scope: both
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes: [mase, fit_time_s, peak_rss_mb]
    state_class: O(n)
    bounded_state_dims: {n: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    n_scalability: linear
    tier1_core_exception: 'Single-series forecasting; n<=1e6 typical; Holt-Winters fit needs full series for classical decomposition + bounded Nelder-Mead over (alpha,beta,gamma,phi). Grid cost O(n*grid_size); not a fit-matrix model.'
    streaming_strategy:
      fit: 'load full series; decomposition + Nelder-Mead grid search (bounded grid).'
      predict: 'closed-form recurrence + analytic Gaussian prediction intervals.'
    primitive_reuse: []
  - name: AutoETS
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'AutoETS: AICc-selected ETS. Evaluates up to 9 configurations
      (trend N/A/Ad x season N/A/M), skips invalid combos (n<2s for
      seasonal; y<=0 for multiplicative), picks minimum AICc =
      n*ln(SSE/n) + 2k + 2k(k+1)/(n-k-1) with k = sigma+alpha+[beta]+
      [gamma]+[phi]. Falls back to NaiveForecaster(last) if no config
      fits. Wraps ETSForecaster; same prediction interval logic.'
    real_life_examples:
    - Automatic retail demand forecast (no manual model selection)
    - Batch forecasting where ETS configuration varies per series
    config:
      seasonal_period: int
      warn_slow_fit: bool
      slow_fit_threshold_s: float
    cadw_module: cadw.ts.auto_ets
    cadw_function: AutoETSForecaster
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/auto_ets.json
      algorithm: cadw.ts.auto_ets.AutoETSForecaster
      algorithm_source_url: cadw/ts/auto_ets.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: univariate forecasting
      n_datasets: 1
      metric: mase
      value: 0.4998
      std: null
      note: 'CADW-native: MASE=0.4998 on synthetic_seasonal_linear
        (n=500, seasonal_period=12); 9 configs evaluated, selected
        ETS(A,A,N) (trend dominates seasonal in this DGP); fit_time
        44.1s. WARNING: 44s fit time is slow for n=500 — grid search
        is O(9 configs * 600 evals * n) Python loop. Backlog item
        "AutoETS grid search optimization" tracks vectorization /
        coordinate-descent fix.'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: none
    data_modality: uni
    source_library: native
    evaluation_scope: synthetic
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes: [mase, fit_time_s, peak_rss_mb]
    state_class: O(n)
    bounded_state_dims: {n: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    n_scalability: linear
    tier1_core_exception: 'Single-series forecasting; n<=1e6 typical; AICc selection runs up to 9 ETS fits, each needs full series. Not a fit-matrix model.'
    streaming_strategy:
      fit: 'load full series; <=9 configs, each ETS fit, pick min AICc.'
      predict: 'delegate to selected ETSForecaster; analytic PI.'
    primitive_reuse: []
  - name: Theta
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'Theta method (STM variant): STL decomposition -> OLS theta_0 (trend) + SES theta_2 (curvature) -> 0.5/0.5 combine -> reseasonalize. Capability flags: handles_trend=True, handles_seasonality=True. KNOWN LIMITATION: STM underperforms on trend-dominated series (MASE 1.4 vs AutoETS 0.5 on synthetic trend=0.3,season_amp=3) — SES on theta_2 lags behind trend by (1-alpha)/alpha*slope per step; STL fixes decomposition leak but not SES lag. This is the STM baseline; OTM variant (weight optimisation) in backlog. Use for M3-like series where seasonality dominates trend.'
    real_life_examples:
    - M3-competition-style seasonal demand
    - Fast baseline for univariate forecast
    config:
      seasonal_period: int
      n_iter: int
    cadw_module: cadw.ts.theta
    cadw_function: ThetaForecaster
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/theta.json
      algorithm: cadw.ts.theta.ThetaForecaster
      algorithm_source_url: cadw/ts/theta.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: univariate forecasting
      n_datasets: 3
      metric: fit_time_s
      value: 0.981
      std: null
      note: 'CADW-native: fit_predict_s=0.012/0.103/0.981 @n=1k/10k/100k (seasonal_period=12; scripts/bench_theta.py; .pingis/benches/theta.json). alpha=0.65 stable across n; sigma 0.677/0.674/0.680. Peak RSS 4.9/0.6/6.1 MB. Hardware-specific; NOT comparable to external LB. ~40x faster than AutoETS on same DGP (single alpha grid vs 600-eval grid).'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: none
    data_modality: uni
    source_library: native
    evaluation_scope: synthetic
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes: [mase, fit_time_s, peak_rss_mb]
    state_class: O(n)
    bounded_state_dims: {n: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    n_scalability: linear
    tier1_core_exception: 'Single-series forecasting; n<=1e6 typical; STM on STL requires full-series seasonal decomposition. Not a fit-matrix model.'
    streaming_strategy:
      fit: 'STL decomposition + theta smoothing on full series.'
      predict: 'extend theta lines, add seasonal component.'
    primitive_reuse: []
  - name: AutoTheta
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'AutoTheta: CV-selected STM vs OTM. Evaluates 4 candidates
      (STM/OTM x additive/multiplicative); holdout MASE selection;
      refits winner on full series. STM = fixed w2=0.5; OTM =
      weight-optimized (w2, alpha). Additive via STL (y=T+S+R);
      multiplicative via log-transform + additive STL. Skips
      multiplicative when y<=0. Never worse than best-of-{STM,OTM} on
      validation by construction. SOTA-class classical forecaster.'
    real_life_examples:
    - Automatic forecasting without manual STM/OTM choice
    - Batch demand forecast with mixed trend/seasonality
    config:
      seasonal_period: int
      val_steps: int
      n_iter: int
    cadw_module: cadw.ts.auto_theta
    cadw_function: AutoThetaForecaster
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/auto_theta.json
      algorithm: cadw.ts.auto_theta.AutoThetaForecaster
      algorithm_source_url: cadw/ts/auto_theta.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: univariate forecasting
      n_datasets: 2
      metric: mase
      value: 0.2093
      std: null
      note: 'CADW-native: M3-like MASE=0.209 (selected OTM_additive; beats AutoETS 0.276 by 24%, AutoTheta 1.4s vs AutoETS 38.6s); trend-dominated MASE=0.296 (selected OTM; beats STM 0.652 2.2x). HONEST LIMITATION: on M3-like, CV-holdout selected OTM but STM generalized slightly better (0.201 vs 0.209); holdout-selection risk documented. K-fold CV is backlog.'
    - benchmark: fev_bench
      benchmark_url: https://github.com/autogluon/fev
      algorithm: statsforecast AutoTheta
      algorithm_source_url: https://github.com/Nixtla/statsforecast
      algorithm_source_kind: code
      attribution: literature
      task_type: univariate forecasting
      n_datasets: 19
      metric: mase
      value: 1.381
      std: null
      note: 'fev-bench (anofox-forecast head-to-head, 2025): AutoTheta MASE 1.381 (Nixtla fev auto_theta 1.362) — SOTA-class classical, 1.4% behind Nixtla, 5.9% ahead of AutoETS (1.525). Tier3 export reference value; CADW implementation is a practical OTM/STM hybrid, not exact Nixtla port.'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: none
    data_modality: uni
    source_library: native
    evaluation_scope: both
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes: [mase, fit_time_s, peak_rss_mb]
    state_class: O(n)
    bounded_state_dims: {n: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    n_scalability: linear
    tier1_core_exception: 'Single-series forecasting; n<=1e6 typical; CV-selected STM/OTM needs multiple full-series fits. Not a fit-matrix model.'
    streaming_strategy:
      fit: 'CV over (STM, OTM) on full series, pick best.'
      predict: 'delegate to selected Theta/OTM forecaster.'
    primitive_reuse: []
