# D — Time Series
# D1 univariate forecast, D2 multivariate forecast, D3.1 point anomaly,
# D3.2 change-point, D3.3 shape anomaly, D4 classification, D5 changepoint
# (alias of D3.2).
#
# v0.9.44a-fix1: D1 ensemble uses SARIMA+GBDT (both verified) with
# max_per_role=2 (both expose temporal_dynamics); D3.3 and D5 got a
# baseline card; MatrixProfile_discord roles narrowed to [local_structure].
# Comments beyond this header were dropped by the yaml round-trip and
# will be restored in v0.9.44b.

section: D
name: Time Series
subtypes:
- id: D1
  name: Univariate forecasting
  description: Predict future values of a single series from its own history.
  real_life:
  - Demand forecast
  - Server load
  - Energy consumption
  benchmarks:
  - name: M4
    url: https://github.com/Mcompetitions/M4-methods
    metrics:
    - smape
    - mase
  models:
  - name: NaiveForecaster
    cadw_module: cadw.ts.models
    cadw_function: NaiveForecaster
    input_api: df
    fit_batched: true
    predict_batched: false
    depends_on: []
    ram_formula: period * f64 + 3.5 * batch * row_size + 256
    formula_evidence:
      state: models.py:211 -- NaiveForecaster.y_ = y (np.ndarray, n*f64)
      header: models.py -- +256 model header
      guard: models.py:218 -- _check(df._memory_guard, batch, ...)
    min_ram_formula: f64 + 3.5 * row_size + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: bounded_by_domain (DEC-011)
      state_check: 'test_*_state_formula_exact: bit-exact vs state_nbytes()'
      state_ooc: 'test_state_nbytes_grows_linearly: 4x n -> ratio [3.0, 5.5]'
      guard_refuse: 'test_guard_refuses_at_domain_bound: n=500k + 2 MB -> MemoryLimitExceeded'
      cells_passed: 3/3
      runtime_sec: ~2
    state_class: O(model)
    bounded_state_dims:
      period: 1
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: Streaming batches via _iter_target_batches; O(batch + period) RAM; tail deque + drift_sum accumulation
      predict: closed-form extrapolation; O(steps) RAM
    primitive_reuse:
    - reduce
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - temporal_dynamics
    purpose: Last-value / seasonal / drift baseline; every method must beat it.
    real_life_examples:
    - M4 naive2 baseline
    config:
      strategy: str
      period: int
    depends_on_status: implemented
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: naive2 forecaster
      algorithm_source_url: https://otexts.com/fpp3/
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 14.35
      std: null
      note: naive2 M4 benchmark [legacy v0.9.44, migrated v0.9.50]
    transient_factor: 1.0
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state period:1; independent of n. Module: cadw.ts.models.'
  - name: ETS
    cadw_module: cadw.ts.ets
    cadw_function: ETSForecaster
    migration_target: v0.9.189
    input_api: df
    fit_batched: false
    predict_batched: false
    depends_on: []
    ram_formula: n * f64 + 2 * seasonal_period * f64 + 3.5 * batch * row_size + 256
    formula_evidence:
      state: ets.py:170-172 -- y_.nbytes + fitted_.nbytes + season_.nbytes + 256
      header: ets.py:172 -- +256
      guard: ets.py:fit -- extract_series guards per batch
    min_ram_formula: 2 * 2 * seasonal_period * f64 + 3.5 * row_size + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: bounded_by_domain (DEC-011)
      state_check: 'test_*_state_formula_exact: bit-exact vs state_nbytes()'
      state_ooc: 'test_state_nbytes_grows_linearly: 4x n -> ratio [3.0, 5.5]'
      guard_refuse: 'test_guard_refuses_at_domain_bound: n=500k + 2 MB -> MemoryLimitExceeded'
      cells_passed: 3/3
      runtime_sec: ~2
      fit_transient_note: 'params=''auto'' (default for AutoETS): AICc config enumeration needs full y (_extract_series + _recompute_in_sample), O(n) transient. params=''manual'': O(W_eff) via _collect_last_w.'
    bounded_state_dims:
      seasonal_period: 1
    state_class: O(model)
    state_type: aggregation
    bounded_state: true
    bounded_by_window:
      axis: n
      window_param: max_window
      auto_from_guard: true
      truncation_loss: HW/initial_seasonal on last W_eff (bit-identical n<=W_eff)
      applies_to: params=manual
    n_scalability: linear
    streaming_strategy:
      fit: batched extract_series (O(batch) streaming) + full-series fit. Nelder-Mead grid transient.
      predict: closed-form extrapolation; O(1) RAM.
    primitive_reuse:
    - reduce
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - temporal_dynamics
    - probabilistic
    purpose: 'Holt-Winters exponential smoothing (additive-error, additive/multiplicative seasonality, damped trend). Classical decomposition init + bounded Nelder-Mead grid search over (alpha, beta, gamma, phi); analytic Gaussian prediction intervals. Reference: Hyndman et al. 2002.'
    real_life_examples:
    - Inventory replenishment
    - Retail demand forecast
    config:
      seasonal_period: int
      seasonal: str
      trend: bool
      damped: bool
    depends_on_status: implemented
    benchmark_results:
    - benchmark: M4
      benchmark_url: https://github.com/Mcompetitions/M4-methods
      algorithm: statsmodels ExponentialSmoothing
      algorithm_source_url: https://www.statsmodels.org/stable/generated/statsmodels.tsa.holtwinters.ExponentialSmoothing.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: univariate forecasting
      n_datasets: null
      metric: smape
      value: 13.52
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/ets.json
      algorithm: cadw.ts.ets.ETSForecaster
      algorithm_source_url: cadw/ts/ets.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: univariate forecasting
      n_datasets: 3
      metric: fit_time_s
      value: 17.153
      std: null
      note: 'CADW-native: fit_predict_s=0.18/1.74/17.15 @n=500/5k/50k (seasonal_period=12; scripts/bench_ets.py, .pingis/benches/ets.json). Residual sigma=0.61/0.54/0.52. Peak RSS 4.9/0.1/1.4 MB. Hardware-specific; NOT comparable to external LB. Range 1000x across n - O(n * grid_size) fit; no cross-n comparable fit_time.'
    model_class: non_learning
    learning_mode: unsupervised
    anomaly_type: none
    data_modality: uni
    source_library: native
    evaluation_scope: both
    dgp_source: synthetic_seasonal_linear
    dgp_overlap_risk: none
    leakage:
      pretraining_corpus: null
      pretraining_overlap_risk: none
      temporal_split: true
      target_leakage_checked: true
    coverage: broad
    pareto_axes:
    - mase
    - fit_time_s
    - peak_rss_mb
    transient_factor: 1.0
    ooc_status: achieved
    ooc_strategy: 'Pattern #2 window. W_eff=max_window from guard (axis=n); truncation loss: HW/initial_seasonal on last W_eff (bit-identical n<=W_eff).'
  - name: AutoETS
    cadw_module: cadw.ts.auto_ets
    cadw_function: AutoETSForecaster
    migration_target: null
    input_api: df
