# W - Probabilistic inference
# v0.9.125 (DEC-048/049). 4 described_only cards, 2 subtypes.
# Posterior inference for Bayesian models. Different from V (post-hoc
# calibration/conformal) — here the model itself is probabilistic.

section: W
name: Probabilistic inference
subtypes:
- id: W1
  name: Variational inference
  description: Approximate posterior q(theta) by optimizing ELBO. Fast, scalable; biased vs MCMC.
  real_life:
  - Bayesian neural nets
  - Large-data posteriors
  - Latent variable models
  benchmarks:
  - name: cadw_internal
    url: https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches
    metrics:
    - elbo
    - runtime_s
    note: No unified VI LB; ELBO not comparable across models (only within one).
  models:
  - name: MeanFieldVI
    tier: baseline
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - probabilistic
    purpose: 'Blei et al. 2017: mean-field VI. Factorized q = prod q_i(theta_i). Fast, closed-form coordinate ascent for conjugate models. Underestimates posterior variance.'
    real_life_examples:
    - LDA topic models
    - Fast Bayesian approximation
    - Conjugate priors
    config:
      max_iter: int
      tol: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://arxiv.org/abs/1601.00670
      algorithm: mean-field VI
      algorithm_source_url: https://arxiv.org/abs/1601.00670
      algorithm_source_kind: paper
      attribution: literature
      task_type: probabilistic_inference
      n_datasets: null
      metric: elbo
      value: null
      note: Blei et al. 2017 tutorial; per-model ELBO only.
    ooc_status: achievable
    ooc_strategy: 'Not implemented. Concrete plan: numpy CAVI updates O(n*d) per iteration; state O(model_params). Chunked batches over n — precedent: GMM (verified, Reduce-based). For LDA-like: precedent LDA (verified v0.9.117). Pattern chosen on implementation (ROADMAP §OOC by primitive).'
  - name: BlackBoxVI
    tier: sota
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - probabilistic
    - representation
    purpose: 'Ranganath et al. 2014: black-box VI. Score-function / reparameterization gradients for arbitrary models. Used in VAEs, Bayesian NN.'
    real_life_examples:
    - VAE training
    - Bayesian NN
    - General model VI
    config:
      n_samples: int
      learning_rate: float
      max_iter: int
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://arxiv.org/abs/1401.0118
      algorithm: black-box VI
      algorithm_source_url: https://arxiv.org/abs/1401.0118
      algorithm_source_kind: paper
      attribution: literature
      task_type: probabilistic_inference
      n_datasets: null
      metric: elbo
      value: null
      note: Ranganath et al. 2014.
  - name: SVI
    tier: sota
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - local_structure
    purpose: 'Stochastic Variational Inference (Hoffman 2013): minibatch VI with local steps; scalable to large data.'
    real_life_examples:
    - Large-data Bayesian fit
    - Streaming VI
    config:
      n_steps: int
      learning_rate: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: SVI
      algorithm_source_url: https://arxiv.org/abs/1303.2225
      algorithm_source_kind: paper
      attribution: literature
      task_type: probabilistic_inference
      n_datasets: null
      metric: elbo
      value: null
      note: 'no_public_benchmark: SVI convergence per-model'
  metrics:
  - name: elbo
    combination: anchor
    direction: higher
    responsibility: 'Evidence Lower BOund: VI objective; higher = better fit.'
    special: Only comparable within the same model; different models have different ELBO scales.
    not_implemented_in_cadw: true
  - name: runtime_s
    combination: diagnostic
    direction: lower
    responsibility: Wall-clock fit time.
    special: Hardware-specific.
- id: W2
  name: Markov Chain Monte Carlo
  description: Sample from exact posterior via Markov chains. Asymptotically unbiased; slower than VI.
  real_life:
  - Gold-standard posteriors
  - Small-data Bayesian inference
  - Model comparison
  benchmarks:
  - name: cadw_internal
    url: https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches
    metrics:
    - ess
    - rhat
    note: 'MCMC diagnostic metrics: ESS (higher) + Rhat (close to 1); no unified LB.'
  models:
  - name: MetropolisHastings
    tier: baseline
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - probabilistic
    purpose: 'Metropolis et al. 1953: random-walk MH. Propose + accept/reject. Simple; tuning-sensitive; slow mixing in high dim.'
    real_life_examples:
    - Simple posterior sampling
    - Baseline MCMC
    config:
      n_samples: int
      proposal_std: float
      burn_in: int
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://arxiv.org/abs/1701.02434
      algorithm: Metropolis-Hastings
      algorithm_source_url: https://arxiv.org/abs/1701.02434
      algorithm_source_kind: paper
      attribution: literature
      task_type: probabilistic_inference
      n_datasets: null
      metric: ess
      value: null
      note: Metropolis 1953.
    ooc_status: achievable
    ooc_strategy: 'Not implemented. Planned approach: Metropolis et al. 1953: random-walk MH. Propose + accept/reject. Simple; tuning-sensitive; slow mixi... Pattern chosen on implementation (ROADMAP §OOC by primitive).'
  - name: NUTS
    tier: sota
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - probabilistic
    purpose: 'Hoffman & Gelman 2014: No-U-Turn Sampler (adaptive HMC). Auto-tunes trajectory length; efficient in mid-dim. Stan/PyMC default.'
    real_life_examples:
    - Gold-standard Bayesian inference
    - Stan/PyMC production
    config:
      n_samples: int
      n_warmup: int
      target_accept: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://arxiv.org/abs/1111.4246
      algorithm: NUTS
      algorithm_source_url: https://arxiv.org/abs/1111.4246
      algorithm_source_kind: paper
      attribution: literature
      task_type: probabilistic_inference
      n_datasets: null
      metric: ess
      value: null
      note: Hoffman & Gelman 2014; Stan/PyMC default.
  metrics:
  - name: ess
    combination: anchor
    direction: higher
    responsibility: 'Effective Sample Size: independent-sample equivalent; higher = better mixing.'
    special: Must be >= 100 * n_chains for reliable inference.
    not_implemented_in_cadw: true
  - name: rhat
    combination: diagnostic
    direction: target
    responsibility: Potential Scale Reduction Factor across chains; ~1.0 = converged.
    special: Target 1.0; values > 1.01 signal non-convergence.
