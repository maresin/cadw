# G — Learning to Rank
# G1: pairwise/listwise ranking (NDCG@k).

section: G
name: Learning to Rank
subtypes:
- id: G1
  name: Ranking (LTR)
  description: Learn a scoring function that ranks items per query.
  real_life:
  - Search ranking
  - Recommendation re-rank
  - Ad ranking
  benchmarks:
  - name: LETOR
    url: https://www.microsoft.com/en-us/research/project/letor-learning-rank-information-retrieval/
    metrics:
    - ndcg_at_k
    - map_at_k
  models:
  - name: PairwiseLogistic
    tier: baseline
    depends_on:
    - cadw.ml._ltr_common.ranknet_grad
    - cadw.ml._ltr_common.listnet_grad
    - cadw.ml._ltr_common.lambdarank_grad
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    cadw_module: cadw.ml.pairwise_logistic
    cadw_function: fit_pairwise_logistic
    input_api: df
    fit_batched: true
    predict_batched: false
    n_scalability: constant
    bounded_state: true
    bounded_state_dims: {d: 1, max_query_size: 1, read_batch_size: 1}
    state_class: O(d)
    state_type: aggregation
    ram_formula: d * f64 + 256 + 2 * max_query_size * (d + 2) * f64 + 4 * 2 * max_query_size * (d + 2) * f64 + read_batch_size * (d + 2) * f64 + max_query_size * (d + 2) * f64
    min_ram_formula: d * f64 + 256 + 2 * 2 * (d + 2) * f64 + 4 * 2 * 2 * (d + 2) * f64 + 1 * (d + 2) * f64 + 2 * (d + 2) * f64
    formula_evidence:
      coef_state: 'pairwise_logistic.py -- coef_ = np.zeros(d); d*f64'
      per_query_transient: 'pairwise_logistic.py -- X_q(max_query_size, d) + s(max_query_size) + grad(max_query_size) ~ max_query_size*(d+2)*f64 (guarded via mg.check_state in query_transient)'
      header: 'pairwise_logistic.py -- PairwiseLogisticModel.state_nbytes() +256'
      batch_term: 'pairwise_logistic.py -- sorted stream read + _stack_X; check_batch(extra_factor=2.5)'
      sort_merge: 'pairwise_logistic.py -- external_sort with merge_fan_in=4, read_batch_size=500; merge-phase peak bounded by merge_fan_in * sort_read_batch_size * (d+2) * f64. Without explicit bounds peak was O(n_runs) = O(n/batch) — P22 confirmed 22x ratio.'
      phase1_buffer: 'pairwise_logistic.py -- external_sort max_buffer_bytes=2*max_query_size*(d+2)*8; P25c confirmed default 0.2*budget grew with n up to min(n*row_size, 0.2*budget) before fix.'
      write_run_transient: 'sort.py::_write_run -- ~4x buffer via from_batches + sort_indices + take (verified P26c source read).'
      reader_batch: 'sort.py::_merge_keys / read_sorted -- one batch = read_batch_size * row_size transient during merge or iteration.'
      per_query: 'pairwise_logistic.py -- X_q(max_q, d) + s(max_q) + grad(max_q) ~ max_q*(d+2)*f64; guarded by mg.check_state(query_transient).'
      reader_close: 'pairwise_logistic.py -- _iter_query_groups uses ArrowIPCBatchReader directly (read_sorted is a generator; closing generator does NOT release ipc.open_file mmap). Explicit close() in finally releases mmap each pass (fit reads 3x: validation + 2 epochs). P22 root cause of 22x peak ratio.'
    min_ram_evidence:
      derived_from: 'ram_formula with max_query_size=2 (min useful), batch=1 (auto-migrate v0.9.177)'
    measurement:
      verification_mode: 'component-wise (DEC-033)'
      note: 'Combined-matrix RSS test removed (DEC-034: baseline >> fit peak at nq<=2000; P26f confirmed 8K noise floor and 18x cell variance at nq=20000). Component-wise replaces it — framework precedent: iforest (DEC-031/033/034), linucb (DEC-033), gmm, birch, kmeans_ad, sub_pca, eif.'
      state_check: 'test_state_nbytes_exact: d*f64 + 256B bit-exact across d=2/5/20/50'
      state_bounded: 'test_state_bounded_for_n_ge_s: max/min <= 1.5x at nq=500/1000/2000'
      state_independent_of_n: 'test_state_independent_of_n: identical state across nq=100/500/2000 (bit-exact)'
      batch_coef: 'test_batch_coef_isolated: d=200, batch sweep 1000/2000/4000, coef in [2.0, 4.5], median-of-5'
      formula_sanity: 'test_formula_small_scale: d=20, batch=1000, predicted/measured in [0.5, 2.0], median-of-3'
      guard: 'test_guard_refuses_at_tight: clean MemoryLimitExceeded'
      correctness: 'test_score_parity_manual (predict==X@coef, atol=1e-9) + test_ranking_quality_ndcg (pairwise concordance > 0.80)'
      cells_passed: '8/8'
      runtime_sec: '~30'
    roles:
    roles:
    - linear_signal
    purpose: Pairwise logistic on (item_a, item_b) preference pairs; simplest LTR baseline.
    real_life_examples:
    - Simple search re-rank
    config:
      alpha: float
      max_iter: int
    benchmark_results:
    - benchmark: LETOR
      benchmark_url: https://web.archive.org/web/20240101000000/https://www.microsoft.com/en-us/research/project/letor-learning-rank-information-retrieval/
      algorithm: sklearn.linear_model.LogisticRegression
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: learning-to-rank
      n_datasets: null
      metric: ndcg_at_k
      value: 0.42
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50] canonical microsoft.com LETOR page returns HTTP 403; using wayback 2024-01-01 snapshot'
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state d*f64 + 256; fit peak O(max_query_size*d) per-query transient + O(batch*row_size) sorted stream. max_query_size guard refuses oversized queries (honest). predict n-sized output guarded (predict_batched: false). Module: cadw.ml.pairwise_logistic.'

  - name: LambdaMART
    cadw_module: cadw.ml.lambdamart
    cadw_function: fit_lambdamart
    input_api: df
    fit_batched: true
    predict_batched: false
    depends_on: []
    ram_formula: n_estimators * (2**(max_depth+1) - 1) * 96 + d * f64 * 512 + 256
    formula_evidence:
      tree_nodes: 'lambdamart.py:588-598 -- state_nbytes: n_nodes * 96 + n_features * 4096 (exact node byte count)'
      node_byte: 96 B/node -- CPython _Node object with left/right/feat/thr/leaf (5 fields + header)
      feature_cache: n_features * 4096 -- per-feature binning scratch (mn_/mx_/range_ + bins)
    min_ram_formula: n_estimators * (2**(max_depth+1) - 1) * 96 + d * f64 * 512 + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      verification_mode: component-wise (DEC-033)
      state_check: 'test_state_within_upper_bound: actual ∈ [0.20, 1.0] of upper_bound'
      state_ooc: 'test_state_independent_of_n: same params, n=480 vs n=4800 -> ratio <=3.0'
      guard_refuse: 'test_guard_refuses: nq=40 n=12 n_est=50 depth=10 + 0.001 MB -> MemoryLimitExceeded'
      correctness: test_lambdamart.py existing suite (ndcg_at_k, mixin, e2e) + test_predict_smoke
      cells_passed: 4/4
      runtime_sec: ~5
    bounded_state: true
    bounded_state_dims:
      n_estimators: 1
      max_depth: 1
      d: 1
    state_class: O(model)
    state_type: iterative
    n_scalability: constant
    tier1_core_exception: 'Tree-ensemble state bounded by {n_estimators: 1, max_depth: 1, d: 1}; LambdaMART tree state: n_nodes*96 (Python node objects) + n_features*4096 (per-feature cache/scratch). Bounded by n_estimators × 2^(max_depth+1)-1 nodes. n-independent (via SpillDir memmap fit for n-sized codes/y/scores/grad/hess).'
    streaming_strategy:
      fit: external_sort by query_col + SpillDir memmap for n-sized state (codes uint8, y/scores/grad/hess float64, node_id int32). Tree build via ReduceOps; RAM = O(batch*d + n_nodes*d*bins).
      predict: per-batch _stack_numeric -> binning -> tree descend; returns pa.Table[score]. O(batch*d + n_trees*nodes).
    primitive_reuse:
    - external_sort
    - reduce
    - memmap
    - spill_dir
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - nonlinear_interactions
    purpose: GBDT with lambda gradients (Burges 2010); SOTA on LTR benchmarks.
    real_life_examples:
    - Bing search ranking
    - Kaggle LTR competitions
    config:
      n_estimators: int
      max_depth: int
      learning_rate: float
    benchmark_results:
    - benchmark: LETOR
      benchmark_url: https://web.archive.org/web/20240101000000/https://www.microsoft.com/en-us/research/project/letor-learning-rank-information-retrieval/
      algorithm: LightGBM lambdarank
      algorithm_source_url: https://github.com/microsoft/LightGBM/tree/master/examples/lambdarank
      algorithm_source_kind: code
      attribution: literature
      task_type: learning-to-rank
      n_datasets: null
      metric: ndcg_at_k
      value: 0.51
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50] canonical microsoft.com LETOR page returns HTTP 403; using wayback 2024-01-01 snapshot'
    transient_factor: 1.0
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state n_estimators:1, max_depth:1, d:1; independent of n. Module: cadw.ml.lambdamart.'
  - name: ListNet
    tier: sota
    depends_on:
    - cadw.ml._ltr_common.ranknet_grad
    - cadw.ml._ltr_common.listnet_grad
    - cadw.ml._ltr_common.lambdarank_grad
    tier_level: tier2_wrapper
    implementation_status:
      verified_in_cadw: true
      status: verified
    cadw_module: cadw.ml.listnet
    cadw_function: fit_listnet
    input_api: df
    fit_batched: true
    predict_batched: false
    n_scalability: constant
    bounded_state: true
    bounded_state_dims: {d: 1, max_query_size: 1, read_batch_size: 1}
    state_class: O(d)
    state_type: aggregation
    ram_formula: d * f64 + 256 + 2 * max_query_size * (d + 2) * f64 + 4 * 2 * max_query_size * (d + 2) * f64 + read_batch_size * (d + 2) * f64 + max_query_size * (d + 2) * f64
    min_ram_formula: d * f64 + 256 + 2 * 2 * (d + 2) * f64 + 4 * 2 * 2 * (d + 2) * f64 + 1 * (d + 2) * f64 + 2 * (d + 2) * f64
    formula_evidence:
      coef_state: 'listnet.py -- coef_ = np.zeros(d); d*f64'
      header: 'listnet.py -- ListNetModel.state_nbytes() +256'
      phase1_buffer: 'listnet.py -- external_sort max_buffer_bytes=2*max_query_size*(d+2)*8; P25c confirmed default 0.2*budget grew with n before fix.'
      write_run_transient: 'sort.py::_write_run -- ~4x buffer via from_batches + sort_indices + take (P26c source).'
      reader_batch: 'sort.py::_merge_keys / read_sorted -- one batch = read_batch_size * row_size transient during merge or iteration.'
      per_query: 'listnet.py -- X_q(max_q, d) + s(max_q) + grad(max_q) ~ max_q*(d+2)*f64; guarded by mg.check_state(query_transient).'
    min_ram_evidence:
      derived_from: 'ram_formula with max_query_size=2, read_batch_size=1, batch=1 (auto-migrate v0.9.177)'
    measurement:
      verification_mode: 'component-wise (DEC-033)'
      note: 'Combined-matrix RSS test omitted (DEC-034: baseline >> fit peak at small n; P26f 8K noise floor; framework precedent iforest/linucb/gmm). Component-wise per DEC-033.'
      state_check: 'test_state_nbytes_exact: d*f64 + 256B bit-exact across d=2/5/20/50'
      state_bounded: 'test_state_bounded_for_n_ge_s: max/min <= 1.5x at nq=500/1000/2000'
      state_independent_of_n: 'test_state_independent_of_n: identical state across nq=100/500/2000'
      formula_sanity: 'test_formula_small_scale: d=200, 5000 rows, predicted/measured in [0.5, 2.0]'
      guard: 'test_guard_refuses_at_tight: clean MemoryLimitExceeded'
      grad_property: 'test_listnet_grad_sum_zero: sum(grad) == 0 (softmax difference; property of primitive)'
      correctness: 'test_score_parity_manual (predict == X@coef) + test_ranking_quality_concordance (concordance > 0.80)'
      cells_passed: '8/8'
      runtime_sec: '~25'
    roles:
    - probabilistic
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state d*f64 + 256; fit peak O(max_query_size*d) per-query transient + O(batch*row_size) sorted stream read. max_query_size + phase1_buffer bound peak. predict n-sized output guarded (predict_batched: false). Module: cadw.ml.listnet.'
    purpose: 'ListNet (Cao 2007): Plackett-Luce probability of permutation; listwise probabilistic LTR.'
    real_life_examples:
    - Whole-page ranking
    - Query-document list
    config:
      n_epochs: int
      lr: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: ListNet
      algorithm_source_url: https://arxiv.org/abs/2002.07416
      algorithm_source_kind: paper
      attribution: literature
      task_type: ltr
      n_datasets: null
      metric: ndcg_at_10
      value: null
      note: 'no_public_benchmark: ListNet per-dataset'
  metrics:
  - name: ndcg_at_k
    combination: anchor
    direction: higher
    responsibility: Position-weighted ranking quality in top-K.
    special: Report per-K; not comparable across K or across different relevance labels.
  - name: map_at_k
    combination: pareto_axis
    direction: higher
    responsibility: Mean Average Precision in top-K.
    special: Binary-relevance variant of NDCG; do not combine into a scalar.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - PairwiseLogistic
    - LambdaMART
    max_per_role: 1
    note: PairwiseLogistic is described_only; ensemble is a spec for Phase F/H.
