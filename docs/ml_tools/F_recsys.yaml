# F — Recommender Systems
# F1 collaborative, F2 hybrid.

section: F
name: Recommender Systems
subtypes:
- id: F1
  name: Collaborative filtering
  description: Predict user-item preference from interaction matrix alone.
  real_life:
  - Movie recommendation
  - Product recommendation
  - Song/playlist
  benchmarks:
  - name: Amazon_Recsys
    url: https://cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/
    metrics:
    - recall_at_k
    - ndcg_at_k
  models:
  - name: ItemKNN
    tier: baseline
    tier_level: tier3_export
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - local_structure
    purpose: Item-item cosine similarity; classic non-personalized baseline.
    real_life_examples:
    - E-commerce 'you might also like'
    config:
      k: int
      metric: str
    benchmark_results:
    - benchmark: Amazon_Recsys
      benchmark_url: https://web.archive.org/web/20240101000000/https://cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/
      algorithm: sklearn.neighbors.NearestNeighbors
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.NearestNeighbors.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: collaborative filtering
      n_datasets: null
      metric: ndcg_at_k
      value: 0.18
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50] canonical cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/ currently refuses connection; using wayback 2024-01-01 snapshot'
  - name: ALS
    tier: sota
    tier_level: tier1_core
    evaluation_scope: both
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - representation
    purpose: Alternating Least Squares on implicit feedback; scalable to millions.
    real_life_examples:
    - Spotify-like playlist recommendation
    config:
      n_factors: int
      n_iter: int
      reg: float
    cadw_module: cadw.ml.als
    cadw_function: fit_als
    input_api: df
    ram_formula: "(U+I)*n_factors*f64 + (U+I)*(dict_entry_bytes + py_str_overhead_bytes) + 8.0*batch*row_size + 256"
    formula_evidence:
      factors: "als.py:56-57 -- state_nbytes: user_factors_.nbytes + item_factors_.nbytes = (U+I)*k*8"
      index_lists_and_dicts: "als.py:47-50 -- user_index_ + item_index_ (lists) + _u_pos + _i_pos (dicts), v0.9.112 extension"
      header: "als.py -- +256 constant (v0.9.112 extension)"
      batch: "als.py:120, 174 -- check_batch(b, extra_factor=8.0); batch_size kwarg propagates at v0.9.112"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: (U+I)*k*8 + (U+I)*(dict_b+str_b) + 256"
      state_bounded: "test_state_independent_of_n: same U/I/k -> same state, dense vs sparse"
      formula_sanity: "test_formula_small_scale: predicted/measured in [0.5, 2.0]"
      ooc: "test_ooc_batch_fixed: median-of-3, ratio < 2.0 (batch_size kwarg at v0.9.112)"
      cells_passed: "4/4"
      runtime_sec: "~30"
      note: "batch coef isolated skipped: d=2 (only u,i cols), SNR < 1 at typical row_size. Coefficient 8.0 from code check_batch(extra_factor=8.0), conservative upper bound."
    benchmark_results:
    - benchmark: Amazon_Recsys
      benchmark_url: https://web.archive.org/web/20240101000000/https://cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/
      algorithm: implicit.als.AlternatingLeastSquares
      algorithm_source_url: https://github.com/benfred/implicit
      algorithm_source_kind: code
      attribution: literature
      task_type: collaborative filtering
      n_datasets: null
      metric: ndcg_at_k
      value: 0.23
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50] canonical cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/ currently refuses connection; using wayback 2024-01-01 snapshot'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/reproduction/als.json
      algorithm: cadw.ml.als.fit_als
      algorithm_source_url: cadw/ml/als.py
      algorithm_source_kind: code
      attribution: cadw_reproduced
      reproduces: implicit.als.AlternatingLeastSquares
      task_type: collaborative filtering
      n_datasets: 1
      metric: ndcg_at_k
      value: 0.3827250969586643
      std: null
      note: M2 parity on synthetic_recsys_like DGP; cadw=0.38273, ref(implicit)=0.36734, verdict=consistent; NDCG@10 on 20% holdout, user-item matrix ~10% density
    state_class: O(N·d)
    bounded_state_dims: {U: 1, I: 1, n_factors: 1}
    transient_factor: 1.0
    state_type: partitioned
    bounded_state: true
    n_scalability: linear  # external_sort K-way merge: K = n/run_buffer, peak O(K)
    streaming_strategy:
      fit: 'HashShuffle by user/item + external_sort item-sweep; per-factor state (m+n)·k param-bounded by k.'
      predict: 'per-batch dot product on cached factors.'
    primitive_reuse:
    - hash_shuffle
    - external_sort
    - reduce
  - name: GBDT_ALS_embedding
    tier: sota
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles: [nonlinear_interactions]
    purpose: "GBDT stacking on ALS factor embeddings (nonlinear side-features on top of MF)."
    real_life_examples: ["Hybrid side-info recommendation", "Click prediction on MF features"]
    config: {n_estimators: int, max_depth: int}
    benchmark_results:
      - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'GBDT_ALS_embedding', algorithm_source_url: 'https://arxiv.org/abs/1609.02464', algorithm_source_kind: paper, attribution: literature, task_type: collaborative filtering, n_datasets: null, metric: ndcg_at_k, value: null, note: 'no_public_benchmark: GBDT-on-MF per-dataset'}
  metrics:
  - name: ndcg_at_k
    combination: anchor
    direction: higher
    responsibility: Position-weighted ranking quality in top-K.
    special: Compare only within the same K and the same negative sampling.
  - name: recall_at_k
    combination: pareto_axis
    direction: higher
    responsibility: Hit rate in top-K, unweighted.
    special: Higher when K grows; not comparable across K.
  ensemble_recommendation:
  - roles:
    - representation
    models:
    - ALS
    max_per_role: 1
    note: Single model — ItemKNN is tier3_export (reference only).
- id: F2
  name: Hybrid recommendation
  description: Combine collaborative signal with item/content features.
  real_life:
  - Cold-start products with text descriptions
  - Bundle recommendation
  benchmarks:
  - name: Amazon_Recsys
    url: https://cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/
    metrics:
    - ndcg_at_k
    - recall_at_k
  models:
  - name: ALS
    tier: baseline
    tier_level: tier1_core
    evaluation_scope: both
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - representation
    purpose: See F1; used as the collaborative tower of the hybrid.
    real_life_examples:
    - Collaborative baseline
    config:
      n_factors: int
      n_iter: int
      reg: float
    cadw_module: cadw.ml.als
    cadw_function: fit_als
    input_api: df
    ram_formula: "(U+I)*n_factors*f64 + (U+I)*(dict_entry_bytes + py_str_overhead_bytes) + 8.0*batch*row_size + 256"
    formula_evidence:
      factors: "als.py:56-57 -- state_nbytes: user_factors_.nbytes + item_factors_.nbytes = (U+I)*k*8"
      index_lists_and_dicts: "als.py:47-50 -- user_index_ + item_index_ (lists) + _u_pos + _i_pos (dicts), v0.9.112 extension"
      header: "als.py -- +256 constant (v0.9.112 extension)"
      batch: "als.py:120, 174 -- check_batch(b, extra_factor=8.0); batch_size kwarg propagates at v0.9.112"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: (U+I)*k*8 + (U+I)*(dict_b+str_b) + 256"
      state_bounded: "test_state_independent_of_n: same U/I/k -> same state, dense vs sparse"
      formula_sanity: "test_formula_small_scale: predicted/measured in [0.5, 2.0]"
      ooc: "test_ooc_batch_fixed: median-of-3, ratio < 2.0 (batch_size kwarg at v0.9.112)"
      cells_passed: "4/4"
      runtime_sec: "~30"
      note: "batch coef isolated skipped: d=2 (only u,i cols), SNR < 1 at typical row_size. Coefficient 8.0 from code check_batch(extra_factor=8.0), conservative upper bound."
    benchmark_results:
    - benchmark: Amazon_Recsys
      benchmark_url: https://web.archive.org/web/20240101000000/https://cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/
      algorithm: implicit.als.AlternatingLeastSquares
      algorithm_source_url: https://github.com/benfred/implicit
      algorithm_source_kind: code
      attribution: literature
      task_type: hybrid recommendation
      n_datasets: null
      metric: ndcg_at_k
      value: 0.23
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50] canonical cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/ currently refuses connection; using wayback 2024-01-01 snapshot'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/reproduction/als.json
      algorithm: cadw.ml.als.fit_als
      algorithm_source_url: cadw/ml/als.py
      algorithm_source_kind: code
      attribution: cadw_reproduced
      reproduces: implicit.als.AlternatingLeastSquares
      task_type: hybrid recommendation
      n_datasets: 1
      metric: ndcg_at_k
      value: 0.3827250969586643
      std: null
      note: M2 parity on synthetic_recsys_like DGP; cadw=0.38273, ref(implicit)=0.36734, verdict=consistent; NDCG@10 on 20% holdout, user-item matrix ~10% density
    state_class: O(N·d)
    bounded_state_dims: {U: 1, I: 1, n_factors: 1}
    transient_factor: 1.0
    state_type: partitioned
    bounded_state: true
    n_scalability: linear  # external_sort K-way merge: K = n/run_buffer, peak O(K)
    streaming_strategy:
      fit: 'HashShuffle + external_sort (same as F1.ALS).'
      predict: 'per-batch dot product.'
    primitive_reuse:
    - hash_shuffle
    - external_sort
    - reduce
  - name: Hybrid_MF_GBDT
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - representation
    - nonlinear_interactions
    purpose: ALS embeddings + content features fed to GBDT ranker.
    real_life_examples:
    - Amazon product recommendation with category features
    config:
      n_factors: int
      n_estimators: int
    cadw_module: cadw.ml.hybrid_mf
    cadw_function: fit_hybrid_mf
    input_api: df
    benchmark_results:
    - benchmark: Amazon_Recsys
      benchmark_url: https://web.archive.org/web/20240101000000/https://cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/
      algorithm: sklearn.ensemble.HistGradientBoostingRegressor
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingRegressor.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: hybrid recommendation
      n_datasets: null
      metric: ndcg_at_k
      value: 0.27
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50] canonical cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/ currently refuses connection; using wayback 2024-01-01 snapshot'
    state_class: O(batch)
    bounded_state_dims: {batch: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'ALS factors (F1 pattern) + GBDT codes path (P1a) on stacked features.'
      predict: 'per-batch ALS dot + GBDT recursion.'
    primitive_reuse:
    - hash_shuffle
    - external_sort
    - reduce
    - spill_dir
    - codes_bin
  - name: SVDpp
    tier: sota
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles: [local_structure]
    purpose: "SVD++ (Koren 2008): MF + implicit-neighborhood signals; local structure of user-item graph."
    real_life_examples: ["Implicit-feedback recsys", "Neighborhood-augmented MF"]
    config: {n_factors: int, n_epochs: int}
    benchmark_results:
      - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'SVDpp', algorithm_source_url: 'https://arxiv.org/abs/0804.0861', algorithm_source_kind: paper, attribution: literature, task_type: hybrid recommendation, n_datasets: null, metric: ndcg_at_k, value: null, note: 'no_public_benchmark: SVD++ per-dataset'}
  metrics:
  - name: ndcg_at_k
    combination: anchor
    direction: higher
    responsibility: Ranking quality in top-K.
    special: Report per-K; not comparable across K.
  - name: coverage
    combination: diagnostic
    direction: higher
    responsibility: Fraction of catalog surfaced in top-K; diversity indicator.
    special: Do not combine with ndcg into a scalar; Pareto axis.
  ensemble_recommendation:
  - roles:
    - representation
    - nonlinear_interactions
    models:
    - ALS
    - Hybrid_MF_GBDT
    max_per_role: 2
    note: Hybrid subsumes ALS; use ALS only when content features are sparse.
