      described_only: true
      not_implemented_in_cadw: true
    roles:
    - local_structure
    purpose: 'Ester et al. 1996: clusters as dense regions via eps-neighborhood + min_pts. Flat; single global eps struggles with varying density.'
    real_life_examples:
    - Spatial clustering
    - Anomaly (noise points)
    - No k required
    config:
      eps: float
      min_samples: int
      metric: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.cluster.DBSCAN
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.cluster.DBSCAN.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: clustering
      n_datasets: null
      metric: adjusted_rand_score
      value: null
      note: 'no_public_benchmark: no unified clustering LB.'
    ooc_status: achievable
    ooc_strategy: 'Not implemented. Concrete plan: knn_query_stream (v0.9.197) for eps-neighborhood streaming (state O(n*k)); core_distances chunked. Union-find (path compression) for cluster labels — O(n) but no n-sized matrix. Same pattern as verified LOF (v0.9.198). Pattern chosen on implementation (ROADMAP §OOC by primitive).'
  - name: HDBSCAN
    cross_ref: N_density.HDBSCAN
    tier: sota
    depends_on:
