    direction: higher
    responsibility: Preservation of pairwise distances in dendrogram.
    special: Requires dendrogram; for flat methods (k-means) use silhouette.
  - name: fit_time_s
    combination: diagnostic
    direction: lower
    responsibility: Wall-clock fit time.
    special: Hardware-specific.
