# B - Clustering
# v0.9.123 (DEC-048/049). 2 draft (KMeans, MiniBatchKMeans) + 8 described_only.

section: B
name: Clustering
subtypes:
- id: B1
  name: Centroid-based clustering
  description: Partition points into k clusters by centroid proximity.
  real_life:
  - Customer segmentation (k known)
  - Vector quantization
  - Anomaly via distance-to-centroid
  benchmarks:
  - name: cadw_internal
    url: https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches
    metrics:
    - silhouette
    - inertia
    - fit_time_s
    note: No unified clustering leaderboard; cadw_internal synthetic DGP.
  models:
  - name: KMeans
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - local_structure
    purpose: Lloyd k-means with k-means++ init. Spherical equal-variance clusters; centroid objective. Canonical baseline.
    real_life_examples:
    - Customer segmentation (k known)
    - Vector quantization
    - Anomaly via distance to nearest centroid
    config:
      k: int
      n_init: int
      max_iter: int
      tol: float
      seed: int
    cadw_module: cadw.ml.kmeans
    cadw_function: fit_kmeans
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.cluster.KMeans
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: clustering
      n_datasets: null
      metric: inertia
      value: null
      note: 'no_public_benchmark: KMeans on AMLB is pre-processing; no unified clustering LB. Measure v0.9.124.'
    state_class: O(model)
    bounded_state_dims:
      k: 1
      d: 1
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    ram_formula: 2 * k * batch * row_size + k * d * f64 + k * f64 + f64 + 256
    formula_evidence:
      batch_transient: kmeans.py:54-64 -- KMeansStepOp.batch_memory_factor() = 2.0 * k (diff + diff*diff)
      state_sums: kmeans.py:60 -- np.zeros((k, d)) sums; k*d*f64
      state_counts: kmeans.py:61 -- np.zeros(k) counts; k*f64
      state_inertia: kmeans.py:62 -- inertia float; f64
      header: kmeans.py -- KMeansModel metadata; 256
    min_ram_formula: 2 * k * 1 * row_size + k * d * f64 + k * f64 + f64 + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      status: pending (v0.9.124)
      note: 'Formula from code (AP23); measurement plan: component-wise (DEC-033).'
    streaming_strategy:
      fit: iter-Reduce (sums, counts, inertia); O(k*d) state independent of n.
      predict: per-batch nearest-centroid.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state k:1, d:1; independent of n. Module: cadw.ml.kmeans.'
  - name: MiniBatchKMeans
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - local_structure
    purpose: 'Sculley 2010 streaming k-means: per-centroid updates with eta = 1/count. Reservoir init + streaming sweeps.'
    real_life_examples:
    - Large-scale segmentation (n > 10^6)
    - Online clustering with drift
    config:
      n_clusters: int
      batch_size: int
      max_iter: int
      tol: float
      seed: int
    cadw_module: cadw.ml.minibatch
    cadw_function: fit_minibatch_kmeans
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.cluster.MiniBatchKMeans
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: clustering
      n_datasets: null
      metric: inertia
      value: null
      note: 'no_public_benchmark: same as KMeans; measure v0.9.124.'
    state_class: O(model)
    bounded_state_dims:
      k: 1
      d: 1
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    ram_formula: 3 * batch * row_size + 10 * batch * (d * f64 + f64) + k * d * f64 + k * f64 + 256
    formula_evidence:
      batch_transient: minibatch.py:131 -- check_batch(extra_factor=3.0); _stack_numeric + per-row iteration
      reservoir_state: minibatch.py:128-145 -- cap=10*batch; per-row (d*f64 + f64)
      model_centers: minibatch.py:73 -- centers_ (k,d); k*d*f64
      model_counts: minibatch.py:74 -- counts_ (k,); k*f64
      header: minibatch.py -- MiniBatchKMeansModel header; 256
    min_ram_formula: 3 * 1 * row_size + 10 * 1 * (d * f64 + f64) + k * d * f64 + k * f64 + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      status: pending (v0.9.124)
      note: Formula from code (AP23); reservoir (10*batch) dominates at small k.
    streaming_strategy:
      fit: two-pass (reservoir init + streaming sweep); reservoir cap=10*batch.
      predict: per-batch nearest-centroid.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state k:1, d:1; independent of n. Module: cadw.ml.minibatch.'
  - name: BisectingKMeans
    tier: sota
    depends_on: []
    tier_level: tier1_core
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - local_structure
    purpose: 'Top-down hierarchical k-means: recursively bisect each cluster via 2-means. Better for non-convex shapes than Lloyd.'
    real_life_examples:
    - Taxonomy induction
    - Document clustering
    - Non-spherical clusters
    config:
      n_clusters: int
      bisecting_strategy: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.cluster.BisectingKMeans
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.cluster.BisectingKMeans.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: clustering
      n_datasets: null
      metric: inertia
      value: null
      note: 'no_public_benchmark: not on AMLB.'
  - name: GaussianMixtureClustering
    tier: sota
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - probabilistic
    purpose: Soft-assignment clustering via Gaussian mixture; probabilistic alternative to hard centroid.
    real_life_examples:
    - Soft customer segmentation
    - Model-based clustering
    config:
      n_components: int
      covariance_type: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: GaussianMixtureClustering
      algorithm_source_url: https://scikit-learn.org/stable/modules/mixture.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: clustering
      n_datasets: null
      metric: adjusted_rand_score
      value: null
      note: 'no_public_benchmark: GMM clustering per-dataset'
  - name: SpectralClustering
    tier: sota
    depends_on:
    - cadw.ml.spectral_clustering.fit_spectral_clustering
    - cadw.ops.graph.graph_laplacian_sparse
    - cadw.ops.graph.eigsh_topk
    - cadw.ops.linalg.knn_query_stream
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - representation
    purpose: Graph-Laplacian spectral clustering (Ng 2002); captures non-convex cluster shape via eigenvectors.
    real_life_examples:
    - Non-convex cluster discovery
    - Manifold-based grouping
    config:
      n_clusters: int
      affinity: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: SpectralClustering
      algorithm_source_url: https://papers.nips.cc/paper/2001/hash/f4b9ec30ad9f68f89b29639786cb62ef-Abstract.html
      algorithm_source_kind: paper
      attribution: literature
      task_type: clustering
      n_datasets: null
      metric: adjusted_rand_score
      value: null
      note: 'no_public_benchmark: spectral clustering per-dataset'
    cadw_function: fit_spectral_clustering
    cadw_module: cadw.ml.spectral_clustering
    input_api: df
    bounded_state: false
    n_scalability: linear
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: 'Embedding (n, n_clusters) + affinity nnz O(n*n_neighbors) + kmeans state; sklearn ARPACK eigsh path. At n=1e6, n_neighbors=10: embedding 16 MB + affinity 240 MB. For larger n: reduce n_neighbors, or Nystroem+PCA chain.'
    bounded_state_dims:
      n: 1
      n_clusters: 1
      n_neighbors: 1
    state_class: O(n)
    state_type: partitioned
    ram_formula: n * n_neighbors * f64 * 3 + n * n_clusters * f64 + n * f64 + 256
    min_ram_formula: n_neighbors * f64 * 3 + n_clusters * f64 + f64 + 256
    formula_evidence:
      affinity: spectral_clustering.py -- W csr nnz~n*n_neighbors; data+indices+indptr ~= n*n_neighbors*f64*3 (upper)
      embedding: 'spectral_clustering.py -- embedding (n, n_clusters): n*n_clusters*f64'
      labels: 'spectral_clustering.py -- labels (n,) int -> f64: n*f64'
      header: spectral_clustering.py -- +256 in state_nbytes()
    measurement:
      verification_mode: component-wise (DEC-033)
      sklearn_parity: 'test_sklearn_ari_parity_blobs/moons/rbf: ARI 1.0000 vs sklearn 1.0000 (3 datasets x 2 affinities); test_spectral_embedding_parity_dense/sparse: max embed diff < 1e-4 after sign align'
      state_check: 'test_state_nbytes_reasonable: < 500 KB for n=100'
      intrinsic_bound: 'test_n_above_bound_raises: n=1e6+1 -> MemoryLimitExceeded'
      release: test_release_idempotent
      validation: test_bad_affinity_raises / test_nan_raises
      reproducibility: test_reproducibility_same_seed
      cells_passed: 8/8
      runtime_sec: ~2
    streaming_strategy:
      fit: kNN affinity (sparse) -> csgraph_laplacian sym -> eigsh(-1e-5) -> sign flip -> sklearn KMeans. Affinity O(n*n_neighbors); embedding O(n*n_clusters).
      predict: NOT IMPLEMENTED v0.9.203 (deferred v0.9.204+)
    primitive_reuse:
    - knn_query_stream
    - graph_laplacian_sparse
    - eigsh_topk
    - spill_dir
    migration_target: null
    notes: 'v0.9.203: fit verified (component-wise DEC-033, sklearn SpectralClustering parity: ARI 1.0000). Pipeline: kNN affinity -> graph_laplacian_sparse sym -> eigsh(sigma=-1e-5) -> sign flip -> sklearn KMeans. Embedding diff < 1e-4. Large n: Nystroem+PCA chain. predict() v0.9.204+.'
    ooc_status: debt
    ooc_strategy: 'Permanent debt: X streamed (v0.9.210-a), but W (n*k_nnz) + embedding (n*k) + ARPACK matvec are intrinsic O(n). For n>1e6: subsample (disclosed) or Nystroem-chain. Guard refuses above bound.'
    ooc_alternative: 'Subsample approximation: (a) landmark n_b<=5000 + out-of-sample transform via kNN for new points; (b) Nystroem kernel approx + PCA chain (precedent v0.9.202 for KernelPCA); (c) MiniBatchKMeans on raw features for approximate clustering. Exact O(n*k) embedding + ARPACK Lanczos matvec are intrinsic — cannot be streamed.'
  metrics:
  - name: silhouette
    combination: anchor
    direction: higher
    responsibility: Unsupervised cluster separation; primary diagnostic without labels.
    special: O(n^2) naive; sample-based for large n. Not comparable across k.
  - name: inertia
    combination: diagnostic
    direction: lower
    responsibility: Within-cluster sum of squared distances (KMeans objective).
    special: Decreases with k; only comparable at same k.
- id: B2
  name: Density-based clustering
  description: Arbitrary-shaped clusters as dense regions; noise points labelled -1; k not needed.
  real_life:
  - Unknown-k segmentation
  - Anomaly via noise label
  - Spatial clustering
