- id: B5
  name: Biclustering
  description: Cluster rows AND columns simultaneously.
  real_life:
  - Gene expression (samples × genes)
  - Recommender co-clustering
  - Text co-clustering
  benchmarks:
  - name: cadw_internal
    url: https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches
    metrics:
    - mean_squared_residue
    - fit_time_s
    note: No unified biclustering LB.
  models:
  - name: SpectralCoclustering
    tier: baseline
    depends_on:
    - cadw.ops.linalg.eigh_topk
    - cadw.ops.linalg.sq_dists
    - cadw.ml.kmeans.fit_kmeans
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    cadw_function: fit_spectral_coclustering
    cadw_module: cadw.ml.spectral_coclustering
    input_api: df
    bounded_state: true
    n_scalability: bounded_by_window
    bounded_by_window:
      axis: gram_dim
      window_param: gram_dim = min(r, c)
      bound: 10000
      auto_from_guard: true
      truncation_loss: none (chunked Reduce; state c^2 Gram bounded by c, not r; no semantic truncation)
      reason: 'Gram is c^2*f64 = 800 MB at c=1e4. c = len(X_cols) is typically vocab/items after prune (<=10^4 in 95%+ tabular cases). r (rows/users/documents) is unbounded: state independent of r via chunked Reduce.'
    bounded_state_dims:
      c: 1
      k_sv: 1
    ram_formula: c*c*f64 + c*k_sv*f64 + k_sv*f64 + batch*(c+k_sv)*f64*2 + c*f64*2 + 256
    min_ram_formula: c*c*f64 + c*k_sv*f64 + k_sv*f64 + (c+k_sv)*f64*2 + c*f64*2 + 256
    formula_evidence:
      gram: 'spectral_coclustering.py -- G = zeros((c, c)): c*c*f64'
      eigh_V: 'spectral_coclustering.py -- eigh_topk(G, k_sv): c*k_sv*f64 + k_sv*f64'
      batch_transients: 'spectral_coclustering.py -- A_norm_b (batch, c): batch*(c+k_sv)*f64*2 (bsz auto from guard)'
      state_cols: 'spectral_coclustering.py -- col_labels + col_diag: c*f64*2 + 256'
    fit_batched: true
    predict_batched: null
    migration_target: null
    primitive_reuse:
    - reduce
    - eigh_topk
    - spill_array
    - fit_kmeans
    streaming_strategy:
      fit: chunked Reduce (col_sum, Gram, U, Z); eigh_topk on c*c Gram; fit_kmeans on streamed Z df; row_labels SpillArray int64
    roles:
    - local_structure
    purpose: 'Dhillon 2001: spectral co-clustering on checkerboard patterns. SVD on normalized matrix; rows and cols cluster together.'
    real_life_examples:
    - Gene expression submatrices
    - Users × items co-clusters
    config:
      n_clusters: int
      svd_method: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.cluster.SpectralCoclustering
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.cluster.SpectralCoclustering.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: biclustering
      n_datasets: null
      metric: mean_squared_residue
      value: null
      note: 'no_public_benchmark: no unified biclustering LB.'
    ooc_status: achieved
    ooc_strategy: 'Pattern #2 window. W_eff=gram_dim = min(r, c) from guard (axis=gram_dim); truncation loss: none (chunked Reduce; state c^2 Gram bounded by c, not r; no semantic truncation.'
  - name: SpectralBiclustering
    tier: sota
    depends_on:
    - cadw.ops.linalg.svd_topk
    - cadw.ml.kmeans.fit_kmeans
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - local_structure
    purpose: 'Kluger 2003: generalized spectral biclustering. Handles checkerboard + non-checkerboard patterns; rows and cols cluster independently after SVD.'
    real_life_examples:
    - Gene expression submatrices
    - General biclustering
    config:
      n_clusters: tuple
      method: string
      svd_method: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.cluster.SpectralBiclustering
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.cluster.SpectralBiclustering.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: biclustering
      n_datasets: null
      metric: mean_squared_residue
      value: null
      note: 'no_public_benchmark: no unified biclustering LB.'
    cadw_function: fit_spectral_biclustering
    cadw_module: cadw.ml.spectral_biclustering
    input_api: df
    bounded_state: false
    n_scalability: bounded_by_window
    bounded_by_window:
      axis: gram_dim
      window_param: gram_dim = min(r, c)
      bound: 10000
      auto_from_guard: true
      truncation_loss: none (chunked Gram via svd_topk; state c^2 Gram bounded by min(r,c), not total n)
      reason: 'svd_topk Pattern #1 (chunked Gram, state O(min(r,c)^2)); 800 MB Gram at min(r,c)=1e4 (realistic vocab/items). A (r*c) materialized — sklearn _project_and_cluster intrinsic O(r*c).'
    bounded_by_domain:
      axis: r*c
      bound: 1000000000
      reason: A (r*c f64) + A_norm (r*c f64) materialized for sklearn _project_and_cluster (A @ best_vt.T, A.T @ best_ut.T). Streaming plan v0.9.213+ (chunked A@V + incremental kmeans).
    bounded_state_dims:
      r: 1
      c: 1
      n_best: 1
      n_row_clusters: 1
      n_col_clusters: 1
    ram_formula: 2 * r * c * f64 + c * c * f64 * 2 + n_best * c * f64 + n_row_clusters * n_col_clusters * (r + c) * 1 + 256
    min_ram_formula: 2 * 2 * 2 * f64 + 2 * 2 * f64 * 2 + 1 * 2 * f64 + 2 * 2 * (2 + 2) * 1 + 256
    formula_evidence:
      A_materialize: 'spectral_biclustering.py -- A (r,c) + A_norm (r,c): 2*r*c*f64'
      gram_svd: 'svd_topk -- G (c,c) + eigh copy: c*c*f64*2'
      best_vectors: 'spectral_biclustering.py -- best_ut/best_vt: n_best*c*f64'
      indicators: 'spectral_biclustering.py -- rows_/columns_: n_row*n_col*(r+c)*1 (bool)'
      header: spectral_biclustering.py -- 256 byte header
    fit_batched: false
    predict_batched: null
    migration_target: null
    primitive_reuse:
    - svd_topk
    - fit_kmeans
    streaming_strategy:
      fit: 'Normalize A -> svd_topk (Pattern #1 chunked Gram) -> _fit_best_piecewise -> _project_and_cluster. A materialized (sklearn parity); streaming plan v0.9.213+.'
    ooc_status: achievable
    ooc_strategy: 'svd_topk Pattern #1 (chunked Gram, bounded_by_window gram_dim<=1e4). A materialized O(r*c) — sklearn _project_and_cluster intrinsic. Current bound: r*c*8 <= 1e9 (A + A_norm f64). Target v0.9.213+ (streaming A@V + incremental kmeans).'
    ooc_target_version: v0.9.213+
    ooc_alternative: 'Streaming A@V + incremental kmeans removes A from RAM. Precedent: Coclustering v0.9.207 Pattern #1 chunked Reduce. For _project_and_cluster: use SpillArray + fit_kmeans on streamed projected df (r, n_best).'
  - name: PlaidModel
    tier: sota
    depends_on: []
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - probabilistic
    purpose: 'Plaid biclustering (Lazzeroni & Owen 2002): probabilistic submatrix model with layer decomposition.'
    real_life_examples:
    - Gene expression layers
    - Recommender co-cluster
    config:
      n_clusters: int
      max_layers: int
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: PlaidModel
      algorithm_source_url: https://academic.oup.com/biostatistics/article/3/4/459/247731
      algorithm_source_kind: paper
      attribution: literature
      task_type: biclustering
      n_datasets: null
      metric: mean_squared_residue
      value: null
      note: 'no_public_benchmark: plaid per-dataset'
    cadw_function: fit_plaid_model
    cadw_module: cadw.ml.plaid_model
    input_api: df
    bounded_state: false
    n_scalability: refuse_at_guard
    refuse_above: 500
    bounded_by_domain:
      axis: min(r,c)
      bound: 500
      reason: 'Per-layer ALS O(max_layer_size * iters); dense submatrix intrinsic. min(r,c) > 500 would take hours per layer (Lazzeroni & Owen 2002 §3: iterative dense ALS not streamable).'
    bounded_state_dims:
      r: 1
      c: 1
      n_layers: 1
      max_als_iters: 1
    ram_formula: 2 * r * c * f64 + n_layers * (r + c) * f64 + 256
    min_ram_formula: 2 * 2 * 2 * f64 + 1 * (2 + 2) * f64 + 256
    formula_evidence:
      A_residual: 'plaid_model.py -- A (r,c) + residual R (r,c): 2*r*c*f64'
      layer_state: 'plaid_model.py -- per layer alpha (R_l) + beta (C_l): (r+c)*f64'
      header: plaid_model.py -- 256 byte header
    fit_batched: false
    predict_batched: null
    primitive_reuse: []
    streaming_strategy:
      fit: Materialize A + residual (r*c f64 each). Iterative ALS per layer (dense submatrix). refuse_at_guard {min(r,c) <= 500}. Deterministic ALS variant (not Bayesian MCMC).
      predict: n/a (fit-only; layers_ member assignment).
    ooc_status: debt
    ooc_target_version: null
    ooc_alternative: 'Permanent. Iterative dense ALS intrinsic (per-layer submatrix + max_als_iters). Approximations: (a) sample rows/cols (lose exact recovery); (b) Sparse-Plaid formulation (shrink per-layer submatrix to sparse observed entries). Neither preserves exact Lazzeroni-Owen MAP.'
    ooc_strategy: 'Permanent debt (iterative dense ALS intrinsic). refuse_at_guard {min(r,c) <= 500}; bounded_by_domain {r*c: 1e8} (A + residual = 1.6 GB at 1e8). max_layers=10, max_als_iters=10 hard caps.'
    migration_target: null
  - name: Bimax
    tier: baseline
    depends_on: []
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - local_structure
    purpose: 'Bimax (Prelic 2006): binary biclustering; local rule-based pattern submatrices.'
    real_life_examples:
    - Binary cohort pattern
    - Sparse binary co-cluster
    config:
      min_rows: int
      min_cols: int
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: Bimax
      algorithm_source_url: https://academic.oup.com/bioinformatics/article/22/9/1122/232367
      algorithm_source_kind: paper
      attribution: literature
      task_type: biclustering
      n_datasets: null
      metric: mean_squared_residue
      value: null
      note: 'no_public_benchmark: Bimax per-dataset'
    ooc_status: debt
    ooc_strategy: Permanent debt (O(r*c*beta^min(r,c)) exponential intrinsic). refuse_at_guard {min(r,c) <= 25}. max_iterations=100_000 cap; max_biclusters=1000.
    ooc_alternative: 'Permanent. Exponential in min(r,c). Approx: MAX-PLAID formulation (relax all-1 to >=alpha coverage) or biclique enumeration with size cap. Neither preserves exact Bimax inclusion-maximal property.'
    bounded_state: false
    n_scalability: refuse_at_guard
    bounded_by_domain:
      axis: min(r,c)
      bound: 25
      reason: 'Bimax is O(r*c*beta^min(r,c)) — exponential in min(r,c). Prelic 2006 §2: intrinsic algorithmic limit; cannot stream without losing inclusion-maximal property. Refuse at min(r,c) > 25 (2^25 ~ 33M paths).'
    cadw_function: fit_bimax
    cadw_module: cadw.ml.bimax
    input_api: df
    refuse_above: 25
    bounded_state_dims:
      r: 1
      c: 1
      n_biclusters: 1
    ram_formula: r * c * i8 + n_biclusters * (r + c) * i64 + 256
    min_ram_formula: min_rows * min_cols * i8 + 1 * (min_rows + min_cols) * i64 + 256
    formula_evidence:
      A_state: 'bimax.py -- A (r, c) int8 binary: r*c*i8'
      bicluster_store: 'bimax.py -- each bicluster (R, C): (r+c)*i64'
      header: bimax.py -- 256 byte header
    fit_batched: false
    predict_batched: null
    primitive_reuse: []
    streaming_strategy:
      fit: Recursive divide-and-conquer on binary A (in RAM). Exponential in min(r,c); refuse_at_guard 25. max_iterations=100_000 cap.
      predict: n/a (fit-only; labels via biclusters_ memberships).
    ooc_target_version: null
    migration_target: null
  metrics:
  - name: mean_squared_residue
    combination: anchor
    direction: lower
    responsibility: Coherence of bicluster submatrices (lower = tighter).
    special: Depends on data scale; report per-dataset.
  - name: fit_time_s
    combination: diagnostic
    direction: lower
    responsibility: Wall-clock fit time.
    special: Hardware-specific.
