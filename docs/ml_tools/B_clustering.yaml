      affinity: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: SpectralClustering
      algorithm_source_url: https://papers.nips.cc/paper/2001/hash/f4b9ec30ad9f68f89b29639786cb62ef-Abstract.html
      algorithm_source_kind: paper
      attribution: literature
      task_type: clustering
