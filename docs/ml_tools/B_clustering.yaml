    real_life_examples:
    - Unknown-k segmentation
    - Anomaly via noise label
    - Spatial clustering with varying density
    config:
      min_cluster_size: int
      min_samples: int
      metric: string
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: hdbscan.HDBSCAN
      algorithm_source_url: https://github.com/scikit-learn-contrib/hdbscan
      algorithm_source_kind: code
      attribution: literature
      task_type: clustering
      n_datasets: null
      metric: adjusted_rand_score
      value: null
      note: 'no_public_benchmark: Campello 2013 per-dataset numbers. Reference impl in .pingis/impl/N/HDBSCAN.txt.'
  - name: GaussianMixtureClustering
    tier: sota
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - probabilistic
    purpose: Density view via GMM; contrasts with DBSCAN/HDBSCAN (no explicit p(x)).
    real_life_examples:
    - Density-mode discovery
    - Soft density cluster
