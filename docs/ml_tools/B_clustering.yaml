# B - Clustering
# v0.9.123 (DEC-048/049). 2 draft (KMeans, MiniBatchKMeans) + 8 described_only.
# cross-ref (markdown only): BIRCH/HDBSCAN canonical N_density.N1; KShape
# canonical D_time_series.D4. P provides clustering-task view.

section: B
name: Clustering
subtypes:
  - id: B1
    name: "Centroid-based clustering"
    description: "Partition points into k clusters by centroid proximity."
    real_life: ["Customer segmentation (k known)", "Vector quantization", "Anomaly via distance-to-centroid"]
    benchmarks:
      - {name: cadw_internal, url: "https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches", metrics: [silhouette, inertia, fit_time_s], note: "No unified clustering leaderboard; cadw_internal synthetic DGP."}
    models:
      - name: KMeans
        tier: baseline
        tier_level: tier1_core
        implementation_status:
          verified_in_cadw: true
          verified_by_agent: true
          status: verified
        roles: [local_structure]
        purpose: "Lloyd k-means with k-means++ init. Spherical equal-variance clusters; centroid objective. Canonical baseline."
        real_life_examples: ["Customer segmentation (k known)", "Vector quantization", "Anomaly via distance to nearest centroid"]
        config: {k: int, n_init: int, max_iter: int, tol: float, seed: int}
        cadw_module: cadw.ml.kmeans
        cadw_function: fit_kmeans
        input_api: df
        fit_batched: true
        predict_batched: true
        depends_on: []
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.KMeans', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: inertia, value: null, note: 'no_public_benchmark: KMeans on AMLB is pre-processing; no unified clustering LB. Measure v0.9.124.'}
        state_class: O(model)
        bounded_state_dims: {k: 1, d: 1}
        state_type: iterative
        bounded_state: true
        n_scalability: constant
        ram_formula: "2 * k * batch * row_size + k * d * f64 + k * f64 + f64 + 256"
        formula_evidence:
          batch_transient: "kmeans.py:54-64 -- KMeansStepOp.batch_memory_factor() = 2.0 * k (diff + diff*diff)"
          state_sums: "kmeans.py:60 -- np.zeros((k, d)) sums; k*d*f64"
          state_counts: "kmeans.py:61 -- np.zeros(k) counts; k*f64"
          state_inertia: "kmeans.py:62 -- inertia float; f64"
          header: "kmeans.py -- KMeansModel metadata; 256"
        measurement:
          status: "pending (v0.9.124)"
          note: "Formula from code (AP23); measurement plan: component-wise (DEC-033)."
        streaming_strategy:
          fit: 'iter-Reduce (sums, counts, inertia); O(k*d) state independent of n.'
          predict: 'per-batch nearest-centroid.'
        primitive_reuse: [reduce]

      - name: MiniBatchKMeans
        tier: baseline
        tier_level: tier1_core
        implementation_status:
          verified_in_cadw: true
          verified_by_agent: true
          status: verified
        roles: [local_structure]
        purpose: "Sculley 2010 streaming k-means: per-centroid updates with eta = 1/count. Reservoir init + streaming sweeps."
        real_life_examples: ["Large-scale segmentation (n > 10^6)", "Online clustering with drift"]
        config: {n_clusters: int, batch_size: int, max_iter: int, tol: float, seed: int}
        cadw_module: cadw.ml.minibatch
        cadw_function: fit_minibatch_kmeans
        input_api: df
        fit_batched: true
        predict_batched: true
        depends_on: []
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.MiniBatchKMeans', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.MiniBatchKMeans.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: inertia, value: null, note: 'no_public_benchmark: same as KMeans; measure v0.9.124.'}
        state_class: O(model)
        bounded_state_dims: {k: 1, d: 1}
        state_type: iterative
        bounded_state: true
        n_scalability: constant
        ram_formula: "3 * batch * row_size + 10 * batch * (d * f64 + f64) + k * d * f64 + k * f64 + 256"
        formula_evidence:
          batch_transient: "minibatch.py:131 -- check_batch(extra_factor=3.0); _stack_numeric + per-row iteration"
          reservoir_state: "minibatch.py:128-145 -- cap=10*batch; per-row (d*f64 + f64)"
          model_centers: "minibatch.py:73 -- centers_ (k,d); k*d*f64"
          model_counts: "minibatch.py:74 -- counts_ (k,); k*f64"
          header: "minibatch.py -- MiniBatchKMeansModel header; 256"
        measurement:
          status: "pending (v0.9.124)"
          note: "Formula from code (AP23); reservoir (10*batch) dominates at small k."
        streaming_strategy:
          fit: 'two-pass (reservoir init + streaming sweep); reservoir cap=10*batch.'
          predict: 'per-batch nearest-centroid.'
        primitive_reuse: [reduce]

      - name: BisectingKMeans
        tier: sota
        depends_on: []
        tier_level: tier1_core
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure]
        purpose: "Top-down hierarchical k-means: recursively bisect each cluster via 2-means. Better for non-convex shapes than Lloyd."
        real_life_examples: ["Taxonomy induction", "Document clustering", "Non-spherical clusters"]
        config: {n_clusters: int, bisecting_strategy: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.BisectingKMeans', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.BisectingKMeans.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: inertia, value: null, note: 'no_public_benchmark: not on AMLB.'}
      - name: GaussianMixtureClustering
        tier: sota
        depends_on: []
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [probabilistic]
        purpose: "Soft-assignment clustering via Gaussian mixture; probabilistic alternative to hard centroid."
        real_life_examples: ["Soft customer segmentation", "Model-based clustering"]
        config: {n_components: int, covariance_type: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'GaussianMixtureClustering', algorithm_source_url: 'https://scikit-learn.org/stable/modules/mixture.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'no_public_benchmark: GMM clustering per-dataset'}
      - name: SpectralClustering
        tier: sota
        depends_on:
        - cadw.ops.linalg.rbf_kernel
        - cadw.ops.graph.graph_laplacian
        - cadw.ops.graph.eigsh_topk
        - cadw.ops.linalg.eigh_topk
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [representation]
        purpose: "Graph-Laplacian spectral clustering (Ng 2002); captures non-convex cluster shape via eigenvectors."
        real_life_examples: ["Non-convex cluster discovery", "Manifold-based grouping"]
        config: {n_clusters: int, affinity: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'SpectralClustering', algorithm_source_url: 'https://papers.nips.cc/paper/2001/hash/f4b9ec30ad9f68f89b29639786cb62ef-Abstract.html', algorithm_source_kind: paper, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'no_public_benchmark: spectral clustering per-dataset'}
    metrics:
      - {name: silhouette, combination: anchor, direction: higher, responsibility: "Unsupervised cluster separation; primary diagnostic without labels.", special: "O(n^2) naive; sample-based for large n. Not comparable across k."}
      - {name: inertia, combination: diagnostic, direction: lower, responsibility: "Within-cluster sum of squared distances (KMeans objective).", special: "Decreases with k; only comparable at same k."}

  - id: B2
    name: "Density-based clustering"
    description: "Arbitrary-shaped clusters as dense regions; noise points labelled -1; k not needed."
    real_life: ["Unknown-k segmentation", "Anomaly via noise label", "Spatial clustering"]
    benchmarks:
      - {name: cadw_internal, url: "https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches", metrics: [adjusted_rand_score, noise_ratio, fit_time_s], note: "cadw_internal synthetic DGP with known labels."}
    models:
      - name: DBSCAN
        tier: baseline
        depends_on:
        - cadw.ops.linalg.knn_query
        - cadw.ops.linalg.core_distances
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure]
        purpose: "Ester et al. 1996: clusters as dense regions via eps-neighborhood + min_pts. Flat; single global eps struggles with varying density."
        real_life_examples: ["Spatial clustering", "Anomaly (noise points)", "No k required"]
        config: {eps: float, min_samples: int, metric: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.DBSCAN', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.DBSCAN.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'no_public_benchmark: no unified clustering LB.'}

      - name: HDBSCAN
        tier: sota
        depends_on:
        - cadw.ops.linalg.knn_query
        - cadw.ops.linalg.core_distances
        - cadw.ops.graph.mst
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
          reference_impl_ready: true
        roles: [local_structure]
        purpose: "Campello et al. 2013: hierarchical DBSCAN. Mutual-reachability MST + condensed cluster tree. No global eps; handles varying density."
        real_life_examples: ["Unknown-k segmentation", "Anomaly via noise label", "Spatial clustering with varying density"]
        config: {min_cluster_size: int, min_samples: int, metric: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'hdbscan.HDBSCAN', algorithm_source_url: 'https://github.com/scikit-learn-contrib/hdbscan', algorithm_source_kind: code, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'no_public_benchmark: Campello 2013 per-dataset numbers. Reference impl in .pingis/impl/N/HDBSCAN.txt.'}
      - name: GaussianMixtureClustering
        tier: sota
        depends_on: []
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [probabilistic]
        purpose: "Density view via GMM; contrasts with DBSCAN/HDBSCAN (no explicit p(x))."
        real_life_examples: ["Density-mode discovery", "Soft density cluster"]
        config: {n_components: int, covariance_type: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'GaussianMixtureClustering', algorithm_source_url: 'https://scikit-learn.org/stable/modules/mixture.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'no_public_benchmark: GMM clustering per-dataset'}
      - name: SpectralClustering
        tier: sota
        depends_on:
        - cadw.ops.linalg.rbf_kernel
        - cadw.ops.graph.graph_laplacian
        - cadw.ops.graph.eigsh_topk
        - cadw.ops.linalg.eigh_topk
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [representation]
        purpose: "Graph-based density clustering: mode-seeking via spectral eigenvectors of similarity graph."
        real_life_examples: ["Arbitrary-shape density cluster", "Manifold density"]
        config: {n_clusters: int, affinity: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'SpectralClustering', algorithm_source_url: 'https://papers.nips.cc/paper/2001/hash/f4b9ec30ad9f68f89b29639786cb62ef-Abstract.html', algorithm_source_kind: paper, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'no_public_benchmark: spectral clustering per-dataset'}
    metrics:
      - {name: adjusted_rand_score, combination: anchor, direction: higher, responsibility: "Pairwise agreement with ground truth, chance-corrected.", special: "Requires labels; use silhouette for unsupervised mode."}
      - {name: noise_ratio, combination: diagnostic, direction: target, responsibility: "Fraction of points labelled -1.", special: "Domain-dependent; high noise may signal wrong eps."}

  - id: B3
    name: "Hierarchical clustering"
    description: "Tree of nested clusters (dendrogram)."
    real_life: ["Taxonomy induction", "Dendrogram visualization", "Cluster count exploration"]
    benchmarks:
      - {name: cadw_internal, url: "https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches", metrics: [cophenetic_correlation, fit_time_s], note: "No unified clustering LB."}
    models:
      - name: AgglomerativeClustering
        tier: baseline
        depends_on: []
        tier_level: tier1_core
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure]
        purpose: "Bottom-up hierarchical: merge closest pairs by linkage (ward/complete/average/single). O(n^2) memory naive."
        real_life_examples: ["Dendrogram (cluster hierarchy)", "Taxonomy discovery", "Small n (< 10^4)"]
        config: {n_clusters: int, linkage: string, metric: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.AgglomerativeClustering', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.AgglomerativeClustering.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: cophenetic_correlation, value: null, note: 'no_public_benchmark: no unified clustering LB.'}

      - name: BIRCH
        tier: sota
        depends_on: []
        tier_level: tier1_core
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
          reference_impl_ready: true
        roles: [local_structure]
        purpose: "Zhang et al. 1996: Clustering Feature (CF) tree. Bounded memory; O(n) single-pass. Leaf CFs = microclusters. Scalable streaming hierarchical."
        real_life_examples: ["Streaming clustering", "Large n bounded memory", "Pre-clustering for k-means"]
        config: {threshold: float, branching_factor: int, n_clusters: int}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.Birch', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.Birch.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: cophenetic_correlation, value: null, note: 'no_public_benchmark: CADW-native measurement in .pingis/benches/birch.json (fit_time_s).'}
      - name: BisectingKMeans
        tier: sota
        depends_on: []
        tier_level: tier1_core
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure]
        purpose: "Top-down recursive bisection with 2-means; centroid-based hierarchical alternative to bottom-up."
        real_life_examples: ["Taxonomy induction via bisection", "Document hierarchy"]
        config: {n_clusters: int, bisecting_strategy: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'BisectingKMeans', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.BisectingKMeans.html', algorithm_source_kind: docs, attribution: literature, task_type: clustering, n_datasets: null, metric: cophenetic_correlation, value: null, note: 'no_public_benchmark: bisecting clustering per-dataset'}
      - name: SpectralClustering
        tier: sota
        depends_on:
        - cadw.ops.linalg.rbf_kernel
        - cadw.ops.graph.graph_laplacian
        - cadw.ops.graph.eigsh_topk
        - cadw.ops.linalg.eigh_topk
        depends_on_backlog: "PRIMITIVES_BACKLOG §L3, §L6, §L19"
        depends_on_status: planned
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [representation]
        purpose: "Graph-spectral hierarchical clustering; reveals manifold structure lost by bottom-up linkage."
        real_life_examples: ["Non-convex hierarchical cluster", "Graph community hierarchy"]
        config: {n_clusters: int, affinity: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'SpectralClustering', algorithm_source_url: 'https://papers.nips.cc/paper/2001/hash/f4b9ec30ad9f68f89b29639786cb62ef-Abstract.html', algorithm_source_kind: paper, attribution: literature, task_type: clustering, n_datasets: null, metric: cophenetic_correlation, value: null, note: 'no_public_benchmark: spectral clustering per-dataset'}
    metrics:
      - {name: cophenetic_correlation, combination: anchor, direction: higher, responsibility: "Preservation of pairwise distances in dendrogram.", special: "Requires dendrogram; for flat methods (k-means) use silhouette."}
      - {name: fit_time_s, combination: diagnostic, direction: lower, responsibility: "Wall-clock fit time.", special: "Hardware-specific."}

  - id: B4
    name: "Shape-based clustering (time series)"
    description: "Cluster series by shape, invariant to amplitude/offset."
    real_life: ["TS motif discovery", "Equipment operating mode clustering", "Patient trajectory phenotyping"]
    benchmarks:
      - {name: UCR_Classification, url: "https://www.timeseriesclassification.com/", metrics: [adjusted_rand_score], note: "TS clustering benchmarks use ARI on UCR archive."}
    models:
      - name: EuclideanKMeansZ
        tier: baseline
        depends_on: []
        tier_level: tier1_core
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure, temporal_dynamics]
        purpose: "K-means on z-normalized series with Euclidean distance. Shape-aware baseline; ignores temporal shifts (unlike KShape)."
        real_life_examples: ["TS clustering (baseline)", "Shape-aware segmentation"]
        config: {n_clusters: int, max_iter: int}
        benchmark_results:
          - {benchmark: UCR_Classification, benchmark_url: 'https://www.timeseriesclassification.com/', algorithm: 'k-means on z-norm (naive baseline)', algorithm_source_url: 'https://arxiv.org/abs/1506.07608', algorithm_source_kind: paper, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'Baseline referenced in Paparrizos & Gravano 2015; naive Euclidean k-means on z-normalized series.'}

      - name: KShape
        tier: sota
        depends_on: []
        tier_level: tier1_core
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure, temporal_dynamics]
        purpose: "Paparrizos & Gravano 2015: k-shape. Shape-based distance via cross-correlation; centroids as shape-averaged series. Invariant to amplitude and offset."
        real_life_examples: ["TS motif clustering", "Equipment mode discovery", "Patient trajectory grouping"]
        config: {n_clusters: int, max_iter: int, tol: float}
        benchmark_results:
          - {benchmark: UCR_Classification, benchmark_url: 'https://www.timeseriesclassification.com/', algorithm: 'k-Shape (Paparrizos & Gravano 2015)', algorithm_source_url: 'https://arxiv.org/abs/1506.07608', algorithm_source_kind: paper, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'Paper reports ARI per UCR dataset; no unified LB. CADW TS-anomaly implementation in D_time_series (fit_kshape); clustering-task view here.'}
      - name: ShapeGMM
        tier: sota
        depends_on: []
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [probabilistic]
        purpose: "Gaussian Mixture on z-normalized shapes; soft shape-cluster assignment."
        real_life_examples: ["Soft TS motif clustering", "Patient trajectory uncertainty"]
        config: {n_components: int, covariance_type: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'ShapeGMM', algorithm_source_url: 'https://arxiv.org/abs/2205.00905', algorithm_source_kind: paper, attribution: literature, task_type: clustering, n_datasets: null, metric: adjusted_rand_score, value: null, note: 'no_public_benchmark: ShapeGMM per-dataset'}
    metrics:
      - {name: adjusted_rand_score, combination: anchor, direction: higher, responsibility: "Pairwise agreement with ground truth, chance-corrected.", special: "Requires labels (UCR benchmark); use silhouette for unsupervised."}

  - id: B5
    name: "Biclustering"
    description: "Cluster rows AND columns simultaneously."
    real_life: ["Gene expression (samples × genes)", "Recommender co-clustering", "Text co-clustering"]
    benchmarks:
      - {name: cadw_internal, url: "https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches", metrics: [mean_squared_residue, fit_time_s], note: "No unified biclustering LB."}
    models:
      - name: SpectralCoclustering
        tier: baseline
        depends_on:
        - cadw.ops.linalg.rbf_kernel
        - cadw.ops.graph.graph_laplacian
        - cadw.ops.graph.eigsh_topk
        - cadw.ops.linalg.eigh_topk
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure]
        purpose: "Dhillon 2001: spectral co-clustering on checkerboard patterns. SVD on normalized matrix; rows and cols cluster together."
        real_life_examples: ["Gene expression submatrices", "Users × items co-clusters"]
        config: {n_clusters: int, svd_method: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.SpectralCoclustering', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.SpectralCoclustering.html', algorithm_source_kind: docs, attribution: literature, task_type: biclustering, n_datasets: null, metric: mean_squared_residue, value: null, note: 'no_public_benchmark: no unified biclustering LB.'}

      - name: SpectralBiclustering
        tier: sota
        depends_on:
        - cadw.ops.linalg.rbf_kernel
        - cadw.ops.graph.graph_laplacian
        - cadw.ops.graph.eigsh_topk
        - cadw.ops.linalg.eigh_topk
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [local_structure]
        purpose: "Kluger 2003: generalized spectral biclustering. Handles checkerboard + non-checkerboard patterns; rows and cols cluster independently after SVD."
        real_life_examples: ["Gene expression submatrices", "General biclustering"]
        config: {n_clusters: tuple, method: string, svd_method: string}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'sklearn.cluster.SpectralBiclustering', algorithm_source_url: 'https://scikit-learn.org/stable/modules/generated/sklearn.cluster.SpectralBiclustering.html', algorithm_source_kind: docs, attribution: literature, task_type: biclustering, n_datasets: null, metric: mean_squared_residue, value: null, note: 'no_public_benchmark: no unified biclustering LB.'}
      - name: PlaidModel
        tier: sota
        depends_on: []
        tier_level: tier2_wrapper
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [probabilistic]
        purpose: "Plaid biclustering (Lazzeroni & Owen 2002): probabilistic submatrix model with layer decomposition."
        real_life_examples: ["Gene expression layers", "Recommender co-cluster"]
        config: {n_clusters: int, max_layers: int}
        benchmark_results:
          - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'PlaidModel', algorithm_source_url: 'https://academic.oup.com/biostatistics/article/3/4/459/247731', algorithm_source_kind: paper, attribution: literature, task_type: biclustering, n_datasets: null, metric: mean_squared_residue, value: null, note: 'no_public_benchmark: plaid per-dataset'}
      - name: Bimax
        tier: baseline
