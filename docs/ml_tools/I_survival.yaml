section: I
name: Survival analysis
subtypes:
- id: I1
  name: Time-to-event (Cox / AFT / deep)
  description: Predict time-to-event under right-censoring; rank patients by hazard.
  real_life:
  - Clinical prognosis (cancer, cardiovascular)
  - Customer churn with unobserved exits
  - Equipment failure / predictive maintenance
  benchmarks:
  - name: CoxPH_Survival
    url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
    metrics:
    - c_index
    - ibs
    - brier_time
    note: Only accepted public survival benchmark in this repo. PWC SUPPORT2/METABRIC SOTA tables archived (HTTP 429/404) as of 2026-10-24; live numeric leaderboards not fetchable.
  models:
  - name: CoxPH
    tier: baseline
    tier_level: tier1_core
    evaluation_scope: both
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - linear_signal
    purpose: 'Semi-parametric proportional-hazards model; additive log-hazard in features. Inductive bias: linear log-risk with time-independent covariate effects — strong when effects are multiplicative and n is moderate.'
    real_life_examples:
    - Clinical risk scoring on tabular covariates
    - Churn with censoring
    - Reliability / field-failure modeling
    config:
      max_iter: int
      tol: float
    benchmark_results:
    - benchmark: CoxPH_Survival
      benchmark_url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
      algorithm: lifelines.CoxPHFitter
      algorithm_source_url: https://lifelines.readthedocs.io/en/latest/fitters/regression/CoxPHFitter.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: survival
      n_datasets: null
      metric: c_index
      value: null
      note: 'no_public_benchmark: sksurv datasets page (fetched 2026-10-24) lists datasets but no C-index leaderboard'
    - benchmark: CoxPH_Survival
      benchmark_url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
      algorithm: lifelines.CoxPHFitter
      algorithm_source_url: https://lifelines.readthedocs.io/en/latest/fitters/regression/CoxPHFitter.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: survival
      n_datasets: null
      metric: ibs
      value: null
      note: 'no_public_benchmark: no public integrated-Brier leaderboard for CoxPH on sksurv collection'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/reproduction/coxph.json
      algorithm: cadw.ml.coxph
      algorithm_source_url: cadw/ml/coxph.py
      algorithm_source_kind: code
      attribution: cadw_reproduced
      reproduces: lifelines.CoxPHFitter
      task_type: survival
      n_datasets: 1
      metric: c_index
      value: 0.6755
      note: M2 parity on synthetic_survival_like DGP; cadw=0.675451, ref(lifelines)=0.675451, verdict=consistent (tol=0.10)
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/coxph.json
      algorithm: cadw.ml.coxph
      algorithm_source_url: cadw/ml/coxph.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: survival
      n_datasets: 2
      metric: c_index
      value: 0.7229
      std: 0.0011
      note: 'CADW-native: c_index=0.7229 @n=5000 and 0.7244 @n=50000 (coxph.json); std=half-range; NOT comparable to external LB.'
    cadw_module: cadw.ml.coxph
    cadw_function: fit_coxph
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: "d*d*f64 + n_events*2*f64 + 2*d*d*f64 + 3*batch*row_size + 256"
    formula_evidence:
      coef_and_cov: "coxph.py -- CoxPHModel.state_nbytes: coef_.nbytes (d*f64) + covariance_.nbytes (d*d*f64 if closed; None for sgd)"
      baseline: "coxph.py -- baseline_t_.nbytes + baseline_h_.nbytes = n_events*2*f64 (Breslow at every event time)"
      info_matrix: "coxph.py -- info (d,d) + S2 (d,d) transient during Newton, O(d^2)"
      batch_input: "coxph.py -- fit_coxph pre-pass + _checked_iter: check_batch(extra_factor=3.0)"
      header: "coxph.py -- +256 constant"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: coef + cov + baseline_t + baseline_h + 256"
      state_bounded: "test_state_bounded_by_n_events: n_events <= n; sweep across n confirms O(n_events) not O(n_rows)"
      fit_peak_unmeasurable: "fit peak dominated by external_sort run_buffer (~0.5*mg) at practical mg=50MB; baseline O(n_events)*16B is ~1MB at n=100K, below measure_peak_traced noise (~5MB). state_nbytes is bit-exact (CW-1) and bounded by n_events (CW-2). verified per DEC-033 with rationale: peak-based CW-5 not applicable when external_sort buffer dominates."
      predict_ooc: "test_predict_risk_ooc: output='disk' peak ratio < 2.0 at fixed batch"
      predict_memory_equiv: "test_predict_risk_memory_bit_identical: memory == auto+to_numpy"
      concordance_limitation: "v0.9.97 do-not-re-solve: concordance_index O(n) intrinsic (Ts/Es/Rs concat + chunked pair matrix); bounded_by_domain n<=1e6"
      cells_passed: "4/4"
      runtime_sec: "~20"
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: "CoxPH c-index statistically unstable at n>1e6 (v0.9.97 do-not-re-solve); concordance_index O(n) intrinsic (Ts/Es/Rs). fit_coxph and predict_risk are OOC; concordance bounded for typical n<=1e6."
    state_class: O(n)
    bounded_state_dims: {d: 1, n_events: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    n_scalability: linear
    tier1_core_exception: 'Fit path OOC after v0.9.87-P5a-fix-coxph (external_sort + streaming Breslow, RAM = O(batch·d + d²)). Model state baseline_t_/baseline_h_ are O(n_events), n_events ≤ n. Guard-checked at fit; refuse_at_guard if baseline > state_limit. Predict path is OOC (per-batch linear predictor); baseline arrays persisted with model.'
    streaming_strategy:
      fit: 'external_sort by T desc + streaming Breslow reduce; cov = pinv(info d²); baseline arrays O(n_events) guard-checked.'
      predict: 'per-batch X @ coef_; baseline arrays held in model.'
    primitive_reuse:
    - external_sort
    - reduce
    - memmap
    - spill_dir
  - name: KaplanMeier
    cadw_function: fit_kaplan_meier
    cadw_module: cadw.ml.kaplan_meier
    input_api: df
    n_scalability: constant
    bounded_state: true
    bounded_state_dims: {n_unique: 1}
    state_class: O(model)
    state_type: partitioned
    streaming_strategy: |
      fit: external_sort by time_col + streaming KM accumulator.
      Step function buffer (n_unique, 5) is RAM until
      n_unique*40 > state_limit_bytes, then spills to SpillDir.
      survival_at(t): O(n_unique) RAM or streaming over spill chunks.
    primitive_reuse: [sort, spill_array]
    fit_batched: true
    predict_batched: true
    ram_formula: "5 * n_unique * f64 + 128 + 4.0 * batch * row_size"
    formula_evidence:
      steps: "cadw/ml/kaplan_meier.py -- _KMAccumulator.buf: np.empty((cap, 5))"
      cap: "cadw/ml/kaplan_meier.py -- cap = max(1024, state_limit_bytes // 40)"
      header: "cadw/ml/kaplan_meier.py -- KaplanMeierModel.state_nbytes(): +128 (RAM) / +256 (spilled)"
      batch_term: "cadw/ml/kaplan_meier.py -- external_sort read batch + 2 to_numpy + mask"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_km_state_nbytes_exact: bit-exact, 3 (n,n_unique) parametrized"
      state_ooc: "test_km_state_independent_of_n: state identical for n=1000 vs 5000 (same n_unique)"
      state_spilled: "test_km_state_spilled_constant: n_unique>cap -> state=256"
      formula_sanity: "test_km_ooc_at_fixed_batch: SKIPPED (DEC-034; signal < noise, state_ooc is primary)"
      guard: "test_km_guard_refuses_at_tight: n=5000 + 0.01 MB -> MemoryLimitExceeded"
      correctness: "test_km_survival_at_matches_manual: bit-identical product-limit"
      cells_passed: "4/4 (OOC sanity skipped per DEC-034)"
      runtime_sec: "~3"
    tier: baseline
    depends_on: []
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - probabilistic
    purpose: 'Non-parametric product-limit estimator of the marginal survival curve. Inductive bias: no covariate effects — only the pooled survival function, so it is the canonical right-censored baseline that any covariate model must improve. Reference impl in .pingis/impl/I/kaplan_meier.py (smoke 9/9, REPORT.md §6).'
    real_life_examples:
    - Unadjusted survival by trial arm
    - Baseline churn / retention curves
    - Reliability curves on censored field data
    config:
      confidence_interval: string
    benchmark_results:
    - benchmark: CoxPH_Survival
      benchmark_url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
      algorithm: lifelines.KaplanMeierFitter
      algorithm_source_url: https://lifelines.readthedocs.io/en/latest/fitters/univariate/KaplanMeierFitter.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: survival
      n_datasets: null
      metric: ibs
      value: null
      note: 'no_public_benchmark: KM is a marginal-curve baseline; no public IBS leaderboard on sksurv collection'
  - name: WeibullAFT
    cadw_function: fit_weibull_aft
    cadw_module: cadw.ml.weibull_aft
    input_api: df
    n_scalability: constant
    bounded_state: true
    bounded_state_dims: {d: 2}
    state_class: O(d)
    state_type: aggregation
    streaming_strategy: |
      fit: single-pass Reduce over sufficient stats (XTX, XT_ty, XT_tc)
      + closed-form Gauss-Newton step. n-independent state O(d^2)
      transient (sufficient stats), model O(d).
      predict_median: O(d) per row.
    primitive_reuse: [reduce]
    fit_batched: true
    predict_batched: true
    ram_formula: "d * d * f64 + 3 * d * f64 + 128 + 4.0 * batch * row_size"
    formula_evidence:
      XTX: "cadw/ml/weibull_aft.py -- _AFTStatsOp.init: np.zeros((d, d))"
      XT_ty_tc: "cadw/ml/weibull_aft.py -- XT_ty, XT_tc: np.zeros(d) x 2"
      header: "cadw/ml/weibull_aft.py -- _HEADER_BYTES=128"
      model_beta: "cadw/ml/weibull_aft.py -- WeibullAFTModel.state_nbytes(): d*8 + 8 + 128"
      batch_term: "cadw/ml/weibull_aft.py -- _AFTStatsOp.update: X column_stack + t + e + logt + X.T@logt"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_waft_state_nbytes_exact: bit-exact, 4 (d) parametrized"
      state_ooc: "test_waft_state_independent_of_n: state identical for n=500 vs 5000"
      formula_sanity: "test_waft_ooc_at_fixed_batch: peak ratio < 2.5 at fixed batch"
      ooc: "test_waft_ooc_at_fixed_batch: median-of-3"
      guard: "test_waft_guard_refuses_at_tight: d=100 + 0.05 MB -> MemoryLimitExceeded"
      correctness: "test_waft_beta_recovers_true: sign matches, 3 seeds + test_waft_predict_median_shape"
      cells_passed: "5/5"
      runtime_sec: "~2"
    tier: baseline
    depends_on: []
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    - probabilistic
    purpose: 'Parametric accelerated-failure-time model with Weibull baseline. Inductive bias: log-time is linear in covariates plus a Weibull noise shape — stronger than Cox when the Weibull assumption holds; misspecified when hazard is non-monotone. Reference impl in .pingis/impl/I/weibull_aft.py (smoke 9/9, REPORT.md §6).'
    real_life_examples:
    - Industrial reliability with monotone hazard
    - Clinical survival when Weibull fits
    - Small-n trial survival with strong parametric prior
    config:
      fit_intercept: bool
    benchmark_results:
    - benchmark: CoxPH_Survival
      benchmark_url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
      algorithm: lifelines.WeibullAFTFitter
      algorithm_source_url: https://lifelines.readthedocs.io/en/latest/fitters/regression/WeibullAFTFitter.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: survival
      n_datasets: null
      metric: c_index
      value: null
      note: 'no_public_benchmark: no public C-index leaderboard for WeibullAFT on sksurv collection'
  - name: RandomSurvivalForest
    tier: sota
    depends_on:
    - cadw.ml._survival_common.logrank
    tier_level: tier3_export
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - nonlinear_interactions
    purpose: 'Ishwaran & Kogalur ensemble of survival trees (log-rank splits). Inductive bias: piecewise-constant hazard with nonlinear interactions and no proportional-hazards assumption; strong on heterogeneous tabular cohorts.'
    real_life_examples:
    - Clinical risk on heterogeneous cohorts
    - Predictive maintenance with mixed signals
    - Genomic survival (high-d, small-n)
    config:
      n_estimators: int
      min_samples_split: int
      max_depth: int
    benchmark_results:
    - benchmark: CoxPH_Survival
      benchmark_url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
      algorithm: sksurv.ensemble.RandomSurvivalForest
      algorithm_source_url: https://scikit-survival.readthedocs.io/en/stable/api/generated/sksurv.ensemble.RandomSurvivalForest.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: survival
      n_datasets: null
      metric: c_index
      value: null
      note: 'no_public_benchmark: sksurv docs page (fetched 2026-10-24) has no aggregated C-index table'
  - name: DeepSurv
    tier: sota
    depends_on: []
    nn_excluded: true
    tier_level: tier3_export
    implementation_status:
      described_only: false
      not_implemented_in_cadw: true
      requires_torch: true
    roles:
    - nonlinear_interactions
    - representation
    purpose: 'Katzman 2018 — Cox proportional hazards with an MLP as the log-risk function. Inductive bias: learned nonlinear covariate representation feeding the Cox partial likelihood; torch-only, reachable only via to_batches(format=''torch''). Optional numpy draft-target (2-3 sessions); marginal over RSF (C-index +0.05); v0.9.128+ revisit.'
    real_life_examples:
    - Large-cohort clinical risk
    - Genomic survival prediction
    - Censored CTR / churn with high-d features
    config:
      hidden_sizes: list
      dropout: float
      lr: float
    benchmark_results:
    - benchmark: CoxPH_Survival
      benchmark_url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
      algorithm: DeepSurv (Katzman et al. 2018)
      algorithm_source_url: https://arxiv.org/abs/1606.08131
      algorithm_source_kind: paper
      attribution: literature
      task_type: survival
      n_datasets: null
      metric: c_index
      value: null
      note: 'no_public_benchmark: DeepSurv reports per-dataset C-index on its own splits; no unified LB on sksurv collection'
  - name: DeepHit
    tier: sota
    depends_on: []
    nn_excluded: true
    tier_level: tier3_export
    implementation_status:
      described_only: false
      not_implemented_in_cadw: true
      requires_torch: true
    roles:
    - nonlinear_interactions
    - representation
    purpose: 'Lee 2018 — deep network predicting a discrete-time cause-specific hazard distribution directly, no PH assumption. Inductive bias: fully nonparametric hazard curve learned by NN + ranking loss; SOTA when hazards cross, torch-only. Optional numpy draft-target (2-3 sessions); marginal over RSF (C-index +0.05); v0.9.128+ revisit.'
    real_life_examples:
    - Competing-risks clinical survival
    - Multi-cause churn with non-PH effects
    - Non-proportional time-to-failure
    config:
      hidden_sizes: list
      num_durations: int
      alpha: float
      beta: float
    benchmark_results:
    - benchmark: CoxPH_Survival
      benchmark_url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
      algorithm: DeepHit (Lee et al. 2018)
      algorithm_source_url: https://arxiv.org/abs/1801.05599
      algorithm_source_kind: paper
      attribution: literature
      task_type: survival
      n_datasets: null
      metric: c_index
      value: null
      note: 'no_public_benchmark: DeepHit reports on its own synthetic + METABRIC splits; no public LB on sksurv collection'
  metrics:
  - name: c_index
    combination: anchor
    direction: higher
    responsibility: Concordance of risk ranking under censoring; the primary survival metric.
    special: Depends on censoring rate; only compare within the same dataset. Prefer time-dependent AUC when censoring is heavy.
  - name: ibs
    combination: diagnostic
    direction: lower
    responsibility: Integrated Brier score — calibration + discrimination, censoring-adjusted.
    special: Not comparable to c_index numerically; report side-by-side.
  - name: brier_time
    combination: diagnostic
    direction: lower
    responsibility: Time-resolved Brier at fixed horizons (1y, 5y, ...).
    special: Requires pre-specified horizons; not summed across time.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - probabilistic
    models:
    - CoxPH
    max_per_role: 2
    note: CoxPH (semi-parametric PH) and WeibullAFT (parametric AFT) give complementary hazard parameterizations; average the predicted risk ranking when both verified in cadw.
