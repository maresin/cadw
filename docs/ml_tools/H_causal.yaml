# H — Causal Inference & Uplift
# H1 treatment effect (ATE/CATE), H2 uplift (Qini ranking).
# D.3.1 (CoxPH) belongs to survival (not in 5 priority sections).

section: H
name: Causal Inference & Uplift
subtypes:
- id: H1
  name: Treatment effect (ATE / CATE)
  description: Estimate average and heterogeneous treatment effect from observational or RCT data.
  real_life:
  - A/B test incrementality
  - Drug efficacy
  - Marketing campaign lift
  benchmarks:
  - name: RCT_IHDP
    url: https://www.fredjo.com/
    metrics:
    - ate_error
    - pehe
  models:
  - name: T_learner
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - nonlinear_interactions
    purpose: Two outcome models, one per arm; CATE = mu1 - mu0 (Kunzel et al. 2019).
    real_life_examples:
    - A/B test CATE estimation
    config:
      n_estimators: int
      propensity_alpha: float
    cadw_module: cadw.ml.meta_learners
    cadw_function: fit_meta_learner
    input_api: df
    fit_batched: false
    predict_batched: true
    depends_on: []
    benchmark_results:
    - benchmark: RCT_IHDP
      benchmark_url: https://www.fredjo.com/
      algorithm: T-learner (Kunzel et al.)
      algorithm_source_url: https://arxiv.org/abs/1706.03461
      algorithm_source_kind: paper
      attribution: literature
      task_type: causal treatment effect estimation
      n_datasets: null
      metric: ate_error
      value: 0.1
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    ram_formula: "n_estimators * 2 * 4096 + n * f64 + 1024"
    formula_evidence:
      trees: "meta_learners.py MetaLearnerModel.state_nbytes: trees * 4096; kind='t' => len(mu1.trees_) + len(mu0.trees_) = 2 * n_estimators"
      propensity: "meta_learners.py: propensity_ is np.ndarray (n,) per-row; len(propensity_)*8 = n*f64"
      header: "meta_learners.py: +1024 (trees*4096 + prop*8 + 1024)"
      fit_transient: "meta_learners.py _collect: Xs.append + np.vstack (AP2); n*d*f64 peak, backlog v0.9.142"
      collect_guard: "meta_learners.py _collect: check_batch(extra_factor=2.0) + check_state(n*(d*8+16)) per batch"
      fit_guard: "meta_learners.py fit_meta_learner: check_state via _collect"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: n_estimators*2*4096 + n*8 + 1024, parametrized (n, n_estimators)"
      state_ratio_linear: "test_state_ratio_linear: 5x n -> ratio 2-5 (propensity dominates for small trees)"
      fit_refuse: "test_fit_refuses_at_tight: n=1e6 + budget=1MB -> MLE (via _collect check_state)"
      cells_passed: "3/3"
      runtime_sec: "~15"
    tier1_core_exception: 'fit transient O(n*d) via _collect + vstack (AP2); refactor v0.9.142+ (streaming GBDT-per-arm via df.filter). state = trees*4096 + n*f64 + 1024 honest O(n). bounded_by_domain n<=1e6.'
    state_class: O(n)
    bounded_state_dims: {n: 1, n_estimators: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: "single-dataset causal ATE; n<=1e6 typical for RCT/observational tabular. O(n) X materialization from _collect (AP2 refactor v0.9.113)."
    n_scalability: linear
    streaming_strategy:
      fit: 'two arm-separated GBDT fits, each P1a codes path.'
      predict: 'per-batch (mu1 - mu0).'
    primitive_reuse:
    - reduce
    - spill_dir
    - codes_bin
  - name: S_learner
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
      status: verified
    roles:
    - nonlinear_interactions
    purpose: Single model with treatment as a feature; CATE = f(x,1) - f(x,0).
    real_life_examples:
    - Marketing campaign CATE
    config:
      n_estimators: int
      propensity_alpha: float
    cadw_module: cadw.ml.meta_learners
    cadw_function: fit_meta_learner
    input_api: df
    fit_batched: false
    predict_batched: true
    depends_on: []
    benchmark_results:
    - benchmark: RCT_IHDP
      benchmark_url: https://www.fredjo.com/
      algorithm: S-learner (Kunzel et al.)
      algorithm_source_url: https://arxiv.org/abs/1706.03461
      algorithm_source_kind: paper
      attribution: literature
      task_type: causal treatment effect estimation
      n_datasets: null
      metric: ate_error
      value: 0.12
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    ram_formula: "n_estimators * 4096 + n * f64 + 1024"
    formula_evidence:
      trees: "meta_learners.py MetaLearnerModel.state_nbytes: trees * 4096; kind='s' => len(s_model.trees_) = n_estimators"
      propensity: "meta_learners.py: propensity_ is np.ndarray (n,) per-row; len(propensity_)*8 = n*f64"
      header: "meta_learners.py: +1024"
      fit_transient: "meta_learners.py _collect: Xs.append + np.vstack (AP2); n*(d+1)*f64 peak (treatment as feature); backlog v0.9.142"
      collect_guard: "meta_learners.py _collect: check_batch(extra_factor=2.0) + check_state(n*(d*8+16)) per batch"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: n_estimators*4096 + n*8 + 1024, parametrized (n, n_estimators)"
      state_ratio_linear: "test_state_ratio_linear: 5x n -> ratio 2-5 (propensity dominates for small trees)"
      fit_refuse: "test_fit_refuses_at_tight: n=1e6 + budget=1MB -> MLE"
      cells_passed: "3/3"
      runtime_sec: "~15"
    tier1_core_exception: 'fit transient O(n*d) via _collect + vstack (AP2); refactor v0.9.142+. state = trees*4096 + n*f64 + 1024 honest O(n). bounded_by_domain n<=1e6.'
    state_class: O(n)
    bounded_state_dims: {n: 1, n_estimators: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: false
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: "single-dataset causal ATE; n<=1e6 typical for RCT/observational tabular. O(n) X materialization from _collect (AP2 refactor v0.9.113)."
    n_scalability: linear
    streaming_strategy:
      fit: 'single GBDT with treatment as feature (P1a codes path).'
      predict: 'per-batch (mu(x,1) - mu(x,0)).'
    primitive_reuse:
    - reduce
    - spill_dir
    - codes_bin
  - name: DR_learner
    tier: sota
    depends_on:
    - cadw.ml._causal_common.dr_score
    tier_level: tier3_export
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - nonlinear_interactions
    - probabilistic
    purpose: Doubly-robust (AIPW) meta-learner; uses propensity + outcome model.
    real_life_examples:
    - Observational causal inference
    config: {}
    benchmark_results:
    - benchmark: RCT_IHDP
      benchmark_url: https://www.fredjo.com/
      algorithm: DR-learner (EconML)
      algorithm_source_url: https://econml.azurewebsites.net/spec/estimation/dr.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: causal treatment effect estimation
      n_datasets: null
      metric: ate_error
      value: 0.06
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
  - name: CausalForest
    tier: sota
    depends_on:
    - cadw.ml._causal_common.dr_score
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles: [local_structure]
    purpose: "Generalized Random Forest (Athey 2019): honest-split local CATE estimation."
    real_life_examples: ["Heterogeneous treatment effects", "Subgroup policy targeting"]
    config: {n_trees: int, honesty: bool}
    benchmark_results:
      - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'CausalForest', algorithm_source_url: 'https://arxiv.org/abs/1510.04342', algorithm_source_kind: paper, attribution: literature, task_type: causal, n_datasets: null, metric: cate_rmse, value: null, note: 'no_public_benchmark: CausalForest per-dataset'}
  metrics:
  - name: ate_error
    combination: anchor
    direction: lower
    responsibility: Absolute error of the estimated average treatment effect.
    special: ATE error alone hides heterogeneity quality; report PEHE alongside.
  - name: pehe
    combination: pareto_axis
    direction: lower
    responsibility: Precision in Estimation of Heterogeneous Effect; PEHE(x) RMSE.
    special: PEHE is sensitive to noise level; not comparable across DGPs.
  ensemble_recommendation:
  - roles:
    - nonlinear_interactions
    models:
    - T_learner
    - S_learner
    max_per_role: 2
    note: Average CATE; T-learner wins when arms have distinct dynamics, S-learner when sparse.
- id: H2
  name: Uplift modeling (Qini)
  description: Rank customers by incremental gain from a treatment.
  real_life:
  - Targeted promotions (avoid 'sure things')
  - Retention campaigns
  benchmarks:
  - name: RCT_IHDP
    url: https://www.fredjo.com/
    metrics:
    - ate_error
    - pehe
  models:
  - name: T_learner_uplift
    cadw_module: cadw.ml.uplift
    cadw_function: _fit_uplift_two_model
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: "2 * (n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256) + 256"
    formula_evidence:
      state_nbytes: "uplift.py:371-372 -- _TLearnerShim.state_nbytes: m1_.state_nbytes() + m0_.state_nbytes()"
      breakdown: "uplift.py:_fit_uplift_two_model -- 2 separate fit_gbdt_classifier calls (arm=1.0, arm=0.0)"
      B_C: ""
    measurement:
      fit_transient_note: "S1 audit: fit transient = pred/grad/hess (n × 90 B); persistent trees bounded. Refactor planned v0.9.168+ (SpillDir memmap for grad/hess/pred → truly O(batch))."
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_*_state_bounded: actual > 0"
      state_ooc: "test_*_state_independent_of_n: ratio <=3.0"
      guard_refuse: "test_*_guard_refuses: 0.001 MB -> MemoryLimitExceeded"
      cells_passed: "3/3"
      runtime_sec: "~3"
    bounded_state: true
    bounded_state_dims: {n_estimators: 1, max_depth: 1, d: 1}
    bounded_by_domain:
      axis: n
      bound: 100000
      reason: "S1 audit: fit transient pred/grad/hess (n × 90 B) in RAM; codes in SpillDir memmap. Persistent state = trees (bounded, state_nbytes exact). Refactor planned v0.9.168+."
    state_class: O(model)
    state_type: iterative
    n_scalability: constant
    tier1_core_exception: "T-learner: 2 independent GBDT classifiers (treatment / control arms). Each = n_estimators * (2^(max_depth+1)-1) nodes × 500 B/node. n-independent (trees bounded)."
    streaming_strategy:
      fit: "per-arm GBDT fit (hist reduce per tree)."
      predict: "per-batch dual GBDT predict; CATE = p1(x) - p0(x)."
    primitive_reuse: [reduce]
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
      verified_in_cadw: true
    roles:
    - nonlinear_interactions
    purpose: Two-model uplift (see _fit_uplift_two_model); reference baseline.
    real_life_examples:
    - Promotions targeting
    config:
      n_estimators: int
    benchmark_results:
    - benchmark: RCT_IHDP
      benchmark_url: https://www.fredjo.com/
      algorithm: T-learner (Kunzel et al.)
      algorithm_source_url: https://arxiv.org/abs/1706.03461
      algorithm_source_kind: paper
      attribution: literature
      task_type: uplift modeling
      n_datasets: null
      metric: pehe
      value: 0.15
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    transient_factor: 1.0
  - name: CausalTree
    cadw_module: cadw.ml.uplift
    cadw_function: fit_uplift
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: "n_estimators * (2**(max_depth+1) - 1) * 500 + d * f64 + 1024"
    formula_evidence:
      state_nbytes: "uplift.py:219-220 -- UpliftModel.state_nbytes: sum(tr.state_nbytes()) + 1024"
      breakdown: "uplift.py:_CausalTree -- honest leaf: separate train/holdout split; state = tree nodes"
      B_C: ""
    measurement:
      fit_transient_note: "S1 audit: fit transient = pred/grad/hess (n × 90 B); persistent trees bounded. Refactor planned v0.9.168+ (SpillDir memmap for grad/hess/pred → truly O(batch))."
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_*_state_bounded: actual > 0"
      state_ooc: "test_*_state_independent_of_n: ratio <=3.0"
      guard_refuse: "test_*_guard_refuses: 0.001 MB -> MemoryLimitExceeded"
      cells_passed: "3/3"
      runtime_sec: "~3"
    bounded_state: true
    bounded_state_dims: {n_estimators: 1, max_depth: 1, d: 1}
    bounded_by_domain:
      axis: n
      bound: 100000
      reason: "S1 audit: fit transient pred/grad/hess (n × 90 B) in RAM; codes in SpillDir memmap. Persistent state = trees (bounded, state_nbytes exact). Refactor planned v0.9.168+."
    state_class: O(model)
    state_type: iterative
    n_scalability: constant
    tier1_core_exception: "Honest causal forest (trees_ list). Each _CausalTree: 2^(max_depth+1)-1 nodes × 500 B/node. n-independent; +1024 header. ED-gain splits; honest leaves."
    streaming_strategy:
      fit: "n_estimators × per-tree: train/holdout split + ED-gain split search + honest leaf update."
      predict: "per-batch causal tree descend; leaf τ prediction; O(batch × n_trees × depth)."
    primitive_reuse: [reduce]
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
      verified_in_cadw: true
    roles:
    - nonlinear_interactions
    purpose: ED-divergence splits + honest leaves (Rzepakowski-Jaroszewicz 2012, Wager-Athey 2018).
    real_life_examples:
    - Uplift campaigns
    config:
      n_estimators: int
      max_depth: int
      max_samples: int
    benchmark_results:
    - benchmark: RCT_IHDP
      benchmark_url: https://www.fredjo.com/
      algorithm: Causal tree (Athey & Imbens)
      algorithm_source_url: https://arxiv.org/abs/1504.01132
      algorithm_source_kind: paper
      attribution: literature
      task_type: uplift modeling
      n_datasets: null
      metric: pehe
      value: 0.12
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    transient_factor: 1.0
  - name: CausalForest
    tier: sota
    depends_on:
    - cadw.ml._causal_common.dr_score
    depends_on_backlog: "PRIMITIVES_BACKLOG §L11"
    depends_on_status: planned
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles: [local_structure]
    purpose: "Generalized Random Forest (Athey 2019): local CATE estimation via honest trees; used for uplift targeting."
    real_life_examples: ["Uplift targeting with local CATE", "Subgroup policy for uplift"]
    config: {n_trees: int, honesty: bool}
    benchmark_results:
      - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'CausalForest', algorithm_source_url: 'https://arxiv.org/abs/1510.04342', algorithm_source_kind: paper, attribution: literature, task_type: causal, n_datasets: null, metric: qini_coefficient, value: null, note: 'no_public_benchmark: causal forest uplift per-dataset'}
  - name: DR_learner_uplift
    tier: sota
    depends_on:
    - cadw.ml._causal_common.dr_score
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles: [probabilistic]
    purpose: "Doubly-robust meta-learner for uplift; propensity + outcome models give semiparametric efficiency."
    real_life_examples: ["Semiparametric uplift estimation", "Robust Qini vs misspecification"]
    config: {n_estimators: int, propensity: 'logistic'}
    benchmark_results:
      - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'DR_learner_uplift', algorithm_source_url: 'https://arxiv.org/abs/1712.05898', algorithm_source_kind: paper, attribution: literature, task_type: causal, n_datasets: null, metric: qini_coefficient, value: null, note: 'no_public_benchmark: DR-learner per-dataset'}
  metrics:
  - name: qini
    combination: anchor
    direction: higher
    responsibility: Area between Qini curve and random-targeting baseline.
    special: Noisy at n_test<2000; sample std ~sqrt(qini*(1-qini)/n); report SE.
  - name: auuc
    combination: pareto_axis
    direction: higher
    responsibility: Area Under Uplift Curve; alternative to Qini.
    special: Monotone transform of Qini under uniform weighting; use one, not both.
  ensemble_recommendation:
  - roles:
    - nonlinear_interactions
    models:
    - T_learner_uplift
    - CausalTree
    max_per_role: 2
    note: Causal tree wins on high-dim noise / deep interactions / large n. On simple DGPs parity. See d3_3_uplift.md.
