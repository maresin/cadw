# E — Anomaly Detection (tabular)
# E1 unsupervised, E2 supervised. E3 (TS anomaly) covered by D3.1/D3.2/D3.3.

section: E
name: "Anomaly Detection (tabular)"
subtypes:
  - id: E1
    name: "Unsupervised anomaly detection"
    description: "Detect rare rows with no labelled anomalies available."
    real_life:
      - "Fraud detection (labels delayed)"
      - "Network intrusion"
      - "Sensor fault detection"
    benchmarks:
      - name: ODDS
        url: "https://odds.cs.stonybrook.edu/"
        metrics: [roc_auc, pr_auc]
      - name: ADBench
        url: "https://github.com/Minqi824/ADBench"
        metrics: [roc_auc, pr_auc]
    models:
      - name: zscore
        tier: baseline
        tier_level: tier1_core
        implementation_status: {verified_by_agent: true, described_only: true}
        roles: [local_structure]
        purpose: "Univariate z-score per column; row score = max |z|; simplest baseline."
        real_life_examples: ["Server metric alarms"]
        config: {threshold: float}
        benchmark_result:
          source: ODDS
          url: "https://odds.cs.stonybrook.edu/"
          metric: roc_auc
          value: 0.72
      - name: IForest
        tier: sota
        tier_level: tier1_core
        implementation_status: {verified_in_cadw: true, verified_by_agent: true}
        roles: [nonlinear_interactions]
        purpose: "Random-split isolation ensemble; O(n) fit; strong on high-dim tabular."
        real_life_examples: ["Network intrusion", "Kaggle fraud datasets"]
        config: {n_estimators: int, subsample_size: int, contamination: float}
        benchmark_result:
          source: ODDS
          url: "https://odds.cs.stonybrook.edu/"
          metric: roc_auc
          value: 0.87
        cadw_module: cadw.ml.iforest
        cadw_function: fit_isolation_forest
      - name: LOF
        tier: baseline
        tier_level: tier3_export
        implementation_status: {described_only: true, not_implemented_in_cadw: true}
        roles: [local_structure]
        purpose: "Local Outlier Factor via sklearn/PyOD; strong on clustered data."
        real_life_examples: ["Astronomy outlier catalogs"]
        config: {n_neighbors: int}
        benchmark_result:
          source: ODDS
          url: "https://odds.cs.stonybrook.edu/"
          metric: roc_auc
          value: 0.78
    metrics:
      - name: roc_auc
        combination: anchor
        direction: higher
        responsibility: "Rank-based discrimination across all thresholds."
        special: "Over-optimistic when contamination < 1%; report pr_auc alongside."
      - name: pr_auc
        combination: pareto_axis
        direction: higher
        responsibility: "Discrimination under strong imbalance."
        special: "Prefer to roc_auc when contamination < 5%; not comparable across datasets with different prevalence."
    ensemble_recommendation:
      - roles: [local_structure, nonlinear_interactions]
        models: [zscore, IForest]
        max_per_role: 1
        note: "Average normalized anomaly scores; zscore for univariate extremes, IForest for global structure."

  - id: E2
    name: "Supervised anomaly detection"
    description: "Detect rare rows with labels available (binary anomaly classes)."
    real_life:
      - "Fraud with confirmed cases"
      - "Manufacturing defect detection"
    benchmarks:
      - name: AMLB
        url: "https://openml.github.io/automlbenchmark/"
        metrics: [roc_auc, pr_auc]
    models:
      - name: Logistic_balanced
        tier: baseline
        tier_level: tier1_core
        implementation_status: {verified_in_cadw: true, verified_by_agent: true}
        roles: [linear_signal]
        purpose: "LogReg with class_weight='balanced'; simplest cost-sensitive baseline."
        real_life_examples: ["Fraud baseline"]
        config: {class_weight: str, alpha: float}
        benchmark_result:
          source: AMLB
          url: "https://openml.github.io/automlbenchmark/"
          metric: pr_auc
          value: 0.42
        cadw_module: cadw.ml.logistic
        cadw_function: fit_logistic
      - name: GBDT_scale_pos_weight
        tier: sota
        tier_level: tier1_core
        implementation_status: {verified_in_cadw: true, verified_by_agent: true}
        roles: [nonlinear_interactions]
        purpose: "Cost-sensitive GBDT; weight positives by neg/pos (XGBoost semantics)."
        real_life_examples: ["Fraud detection", "Defect detection"]
        config: {scale_pos_weight: float, n_estimators: int}
        benchmark_result:
          source: AMLB
          url: "https://openml.github.io/automlbenchmark/"
          metric: pr_auc
          value: 0.51
        cadw_module: cadw.ml.gbdt
        cadw_function: fit_gbdt_classifier
    metrics:
      - name: pr_auc
        combination: anchor
        direction: higher
        responsibility: "Discrimination of the rare class under strong imbalance."
        special: "Use only pr_auc for ranking; roc_auc is overly optimistic."
      - name: recall_at_1pct
        combination: pareto_axis
        direction: higher
        responsibility: "Business-aligned recall at 1% false-positive budget."
        special: "Prevalence-dependent; not comparable across datasets."
    ensemble_recommendation:
      - roles: [linear_signal, nonlinear_interactions]
        models: [Logistic_balanced, GBDT_scale_pos_weight]
        max_per_role: 1
        note: "Average probabilities; calibrate on holdout before deployment."
