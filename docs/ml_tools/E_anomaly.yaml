# E — Anomaly Detection (tabular)
# E1 unsupervised, E2 supervised. E3 (TS anomaly) covered by D3.1/D3.2/D3.3.

section: E
name: Anomaly Detection (tabular)
subtypes:
- id: E1
  name: Unsupervised anomaly detection
  description: Detect rare rows with no labelled anomalies available.
  real_life:
  - Fraud detection (labels delayed)
  - Network intrusion
  - Sensor fault detection
  benchmarks:
  - name: ODDS
    url: https://odds.cs.stonybrook.edu/
    metrics:
    - roc_auc
    - pr_auc
  - name: ADBench
    url: https://github.com/Minqi824/ADBench
    metrics:
    - roc_auc
    - pr_auc
  models:
  - name: zscore
    tier: baseline
    depends_on: []
    tier_level: tier1_core
    implementation_status:
      verified_by_agent: true
      described_only: true
    roles:
    - local_structure
    purpose: Univariate z-score per column; row score = max |z|; simplest baseline.
    real_life_examples:
    - Server metric alarms
    config:
      threshold: float
    benchmark_results:
    - benchmark: ODDS
      benchmark_url: http://web.archive.org/web/20240913183309/https://odds.cs.stonybrook.edu/
      algorithm: scipy.stats.zscore
      algorithm_source_url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.zscore.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: unsupervised anomaly detection
      n_datasets: null
      metric: roc_auc
      value: 0.72
      std: null
      note: canonical odds.cs.stonybrook.edu now returns HTTP 403; using wayback snapshot 2024-09-13 [legacy v0.9.44, migrated v0.9.50]
  - name: IForest
    tier: sota
    tier_level: tier1_core
    evaluation_scope: both
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - nonlinear_interactions
    purpose: Random-split isolation ensemble; O(n) fit; strong on high-dim tabular.
    real_life_examples:
    - Network intrusion
    - Kaggle fraud datasets
    config:
      n_estimators: int
      subsample_size: int
      contamination: float
    cadw_module: cadw.ml.iforest
    cadw_function: fit_isolation_forest
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    benchmark_results:
    - benchmark: ODDS
      benchmark_url: http://web.archive.org/web/20240913183309/https://odds.cs.stonybrook.edu/
      algorithm: sklearn.ensemble.IsolationForest
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.IsolationForest.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: unsupervised anomaly detection
      n_datasets: null
      metric: roc_auc
      value: 0.87
      std: null
      note: canonical odds.cs.stonybrook.edu now returns HTTP 403; using wayback snapshot 2024-09-13 [legacy v0.9.44, migrated v0.9.50]
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/reproduction/iforest.json
      algorithm: cadw.ml.iforest.fit_isolation_forest
      algorithm_source_url: cadw/ml/iforest.py
      algorithm_source_kind: code
      attribution: cadw_reproduced
      reproduces: sklearn.ensemble.IsolationForest
      task_type: unsupervised anomaly detection
      n_datasets: 1
      metric: roc_auc
      value: 0.9987789473684211
      std: null
      note: M2 parity on synthetic_odds_like DGP; cadw=0.9988, ref(sklearn.IsolationForest)=0.9992, verdict=consistent
    state_class: O(model)
    bounded_state_dims: {n_trees: 1, subsample_size: 1, d: 1}
    transient_factor: 1.0
    state_type: partitioned
    bounded_state: true
    ram_formula: "n_trees * 2 * subsample_size * 40 + 3.5 * batch * row_size + subsample_size * d * f64"
    formula_evidence:
      state_upper: "iforest.py -- _Tree.nbytes_estimate() returns len(feature)*40 per tree; upper bound n_trees*2*S*40 (S leaves -> ~2S nodes)"
      batch_term: "iforest.py -- fit loop: arrays list + np.column_stack + X_b[mask] per batch; coef 2.77 measured (isolated sweep d=200, batch 1000-4000), ceil(2.77*1.15)=3.5 for guard safety"
      X_fit: "iforest.py -- X_fit[idx] temporary during _Tree.build; S*d*f64"
      ef_guard: "expansion_factor=3.0 in derive (matches coef 2.77 rounded up to 3; safety margin via state_upper overestimate ~5x)"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_bounded: actual <= n_trees*2*S*40 AND >= 10% of upper (actual ~20-25% of upper; Python int cache)"
      state_bound_n_ge_s: "test_state_bounded_for_n_ge_s: n in {500,2000,5000}, max/min <= 1.5x (reservoir sample varies tree shape)"
      state_monotone_n_lt_s: "test_state_monotone_for_n_lt_s: psi=min(n,S); n=100 < n=500 monotone"
      coef_batch: "test_batch_coef_isolated: slope/row_size in [2.0, 4.5] (measured 2.77)"
      formula_sanity: "test_formula_small_scale: predicted/measured in [0.7, 1.4] (d=200, batch=1000, predicted 6.2 MB vs measured 7.7 MB, ratio 0.81)"
      ooc: "test_ooc_batch_fixed: peak(n=5000)/peak(n=1000) < 2.0 (measured 0.89)"
      cells_passed: "8/8"
      runtime_sec: "~3"
      note: "Combined RSS matrix not achievable at large d (baseline >> peak). Component-wise per DEC-033: state exact via state_nbytes(), coef isolated, formula small-scale validated, OOC proven."
    n_scalability: constant
    streaming_strategy:
      fit: 'bounded reservoir subsample; build trees per subsample.'
      predict: 'per-batch traversal (path-length score).'
    primitive_reuse: [reduce]
  - name: LOF
    tier: baseline
    depends_on:
    - cadw.ops.linalg.knn_query
    - cadw.ops.linalg.core_distances
    tier_level: tier3_export
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - local_structure
    purpose: Local Outlier Factor via sklearn/PyOD; strong on clustered data.
    real_life_examples:
    - Astronomy outlier catalogs
    config:
      n_neighbors: int
    benchmark_results:
    - benchmark: ODDS
      benchmark_url: http://web.archive.org/web/20240913183309/https://odds.cs.stonybrook.edu/
      algorithm: sklearn.neighbors.LocalOutlierFactor
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.LocalOutlierFactor.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: unsupervised anomaly detection
      n_datasets: null
      metric: roc_auc
      value: 0.78
      std: null
      note: canonical odds.cs.stonybrook.edu now returns HTTP 403; using wayback snapshot 2024-09-13 [legacy v0.9.44, migrated v0.9.50]
  - name: GMMAnomaly
    tier: sota
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles: [probabilistic]
    purpose: "Anomaly via low-likelihood threshold on a fitted Gaussian mixture."
    real_life_examples: ["Multimodal anomaly detection", "Cohort outlier detection"]
    config: {n_components: int, threshold_q: float}
    benchmark_results:
      - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'GMMAnomaly', algorithm_source_url: 'https://scikit-learn.org/stable/modules/mixture.html', algorithm_source_kind: docs, attribution: literature, task_type: anomaly, n_datasets: null, metric: roc_auc, value: null, note: 'no_public_benchmark: GMM anomaly per-dataset'}
  metrics:
  - name: roc_auc
    combination: anchor
    direction: higher
    responsibility: Rank-based discrimination across all thresholds.
    special: Over-optimistic when contamination < 1%; report pr_auc alongside.
  - name: pr_auc
    combination: pareto_axis
    direction: higher
    responsibility: Discrimination under strong imbalance.
    special: Prefer to roc_auc when contamination < 5%; not comparable across datasets with different prevalence.
  ensemble_recommendation:
  - roles:
    - local_structure
    - nonlinear_interactions
    models:
    - zscore
    - IForest
    max_per_role: 1
    note: Average normalized anomaly scores; zscore for univariate extremes, IForest for global structure.
- id: E2
  name: Supervised anomaly detection
  description: Detect rare rows with labels available (binary anomaly classes).
  real_life:
  - Fraud with confirmed cases
  - Manufacturing defect detection
  benchmarks:
  - name: AMLB
    url: https://openml.github.io/automlbenchmark/
    metrics:
    - roc_auc
    - pr_auc
  models:
  - name: Logistic_balanced
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: LogReg with class_weight='balanced'; simplest cost-sensitive baseline.
    real_life_examples:
    - Fraud baseline
    config:
      class_weight: str
      alpha: float
    cadw_module: cadw.ml.logistic
    cadw_function: fit_logistic
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on:
    - cadw.ops.optim.sgd_streaming
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.linear_model.LogisticRegression
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: supervised anomaly detection
      n_datasets: null
      metric: pr_auc
      value: 0.42
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    ram_formula: "2 * batch * row_size + 4 * d * d * f64"
    formula_evidence:
      batch_term: "same (anomaly class-weighted); a=3.05"
      state_term: "b=3.97"
      guard: "logistic.py:LogisticGradOp.batch_memory_factor = 4.0"
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise class-weighted XTX/XTy Reduce.'
      predict: 'per-batch sigmoid.'
    primitive_reuse: [reduce]
  - name: GBDT_scale_pos_weight
    cadw_module: cadw.ml.gbdt
    cadw_function: fit_gbdt_classifier
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: "n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256"
    formula_evidence:
      trees: "gbdt.py:_grad_hess -- weight w = where(y>0.5, pos_weight, 1.0); tree build identical"
      minmax: "gbdt.py:_MinMaxOp -- mn_, mx_ = 2*d*f64"
      header: "gbdt.py:_STATE_HEADER_BYTES=256"
      state_nbytes: "gbdt.py:GBDTClassifier.state_nbytes -- _deep_nbytes per tree"
    measurement:
      fit_transient_note: "S1 audit: fit transient = pred/grad/hess (n × 90 B); persistent trees bounded. Refactor planned v0.9.168+ (SpillDir memmap for grad/hess/pred → truly O(batch))."
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_*_state_within_upper_bound: actual ∈ [0.20, 1.0] of upper_bound"
      state_ooc: "test_*_state_independent_of_n: same params, n=1k vs n=10k -> ratio <= 3.0"
      guard_refuse: "test_*_guard_refuses: n=200 + 0.001 MB -> MemoryLimitExceeded"
      correctness: "test_*_classification/regression/multiclass existing suites green"
      cells_passed: "3/3"
      runtime_sec: "~3"
    bounded_state: true
    bounded_state_dims: {n_estimators: 1, max_depth: 1, d: 1}
    bounded_by_domain:
      axis: n
      bound: 100000
      reason: "S1 audit: fit transient pred/grad/hess (n × 90 B) in RAM; codes in SpillDir memmap. Persistent state = trees (bounded, state_nbytes exact). Refactor planned v0.9.168+."
    state_class: O(model)
    state_type: iterative
    n_scalability: constant
    tier1_core_exception: "Tree-ensemble state is bounded by {n_estimators: 1, max_depth: 1, d: 1}; iter per tree: weighted hist reduce. n-independent (trees do not grow with n)."
    streaming_strategy:
      fit: "per-tree Reduce over histograms (S nodes × F features × B bins); iter per tree: weighted hist reduce."
      predict: per-batch _iter_filtered_batches -> stacked X -> tree descend; O(batch × trees).
    primitive_reuse: [reduce]
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
      verified_in_cadw: true
    roles:
    - nonlinear_interactions
    purpose: Cost-sensitive GBDT; weight positives by neg/pos (XGBoost semantics).
    real_life_examples:
    - Fraud detection
    - Defect detection
    config:
      scale_pos_weight: float
      n_estimators: int
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: XGBoost scale_pos_weight
      algorithm_source_url: https://xgboost.readthedocs.io/en/stable/parameter.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: supervised anomaly detection
      n_datasets: null
      metric: pr_auc
      value: 0.51
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    transient_factor: 1.0
  - name: CalibratedClassifierCV
    tier: sota
    depends_on: []
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles: [probabilistic]
    purpose: "Platt/isotonic-calibrated anomaly score; decision threshold derived from calibrated proba."
    real_life_examples: ["Supervised fraud threshold", "Anomaly scoring with calibrated P(y|x)"]
    config: {method: 'sigmoid|isotonic', cv: int}
    benchmark_results:
      - {benchmark: cadw_internal, benchmark_url: '.pingis/benches/', algorithm: 'CalibratedClassifierCV', algorithm_source_url: 'https://scikit-learn.org/stable/modules/calibration.html', algorithm_source_kind: docs, attribution: literature, task_type: supervised anomaly detection, n_datasets: null, metric: roc_auc, value: null, note: 'no_public_benchmark: calibration wrapper; use supervised anomaly LB upstream'}
  metrics:
  - name: pr_auc
    combination: anchor
    direction: higher
    responsibility: Discrimination of the rare class under strong imbalance.
    special: Use only pr_auc for ranking; roc_auc is overly optimistic.
  - name: recall_at_1pct
    combination: pareto_axis
    direction: higher
    responsibility: Business-aligned recall at 1% false-positive budget.
    special: Prevalence-dependent; not comparable across datasets.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - Logistic_balanced
    - GBDT_scale_pos_weight
    max_per_role: 1
    note: Average probabilities; calibrate on holdout before deployment.
