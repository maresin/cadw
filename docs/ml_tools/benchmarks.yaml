# Benchmark registry for the ML-tools matrix (M1, v0.9.44).
# Every benchmark_result.source in section YAML MUST name an entry here.
#
# `warning` is REQUIRED for every benchmark and states the comparability
# caveat. Rule: numbers from different benchmarks are NEVER comparable;
# each carries its own dataset selection, protocol, and metric definition.

benchmarks:
  AMLB:
    url: https://openml.github.io/automlbenchmark/
    modality: tabular
    metrics: [accuracy, roc_auc, rmse, logloss]
    warning: "Tabular AutoML benchmark (OpenML datasets). Do not compare
      with ODDS (different task types) or with per-dataset Kaggle
      results (different splits)."

  ODDS:
    url: https://odds.cs.stonybrook.edu/
    modality: tabular_anomaly
    metrics: [roc_auc, pr_auc]
    warning: "26 curated tabular anomaly datasets. Train-on-contamination
      variant differs from ADBench. Compare only within ODDS."

  ADBench:
    url: https://github.com/Minqi824/ADBench
    modality: tabular_anomaly
    metrics: [roc_auc, pr_auc]
    warning: "57 datasets, unlabeled/unsupervised variant. Numbers not
      comparable to ODDS (different label definition and sample size)."

  UCR_Classification:
    url: https://www.timeseriesclassification.com/
    modality: ts_classification
    metrics: [accuracy]
    warning: "109+ UCR/UEA datasets with 30 resamples; reported numbers
      are mean over resamples. Not comparable to UCR_Anomaly."

  UCR_Anomaly:
    url: https://www.cs.ucr.edu/~eamonn/time_series_data_2018/
    modality: ts_anomaly
    metrics: [auprc, point_adjusted_f1]
    warning: "250 curated time series. Different papers use different
      anomaly labels (some synthetic, some real); AUPRC absolute values
      vary by protocol. Prefer ranking (best-5 / best-10) over absolute
      numbers. Not comparable to TSB-AD."

  TSB-AD:
    url: https://github.com/TheDatumOrg/TSB-AD
    modality: ts_anomaly
    metrics: [vus_pr, auprc]
    warning: "NeurIPS 2024 archive, 1070 series / 40 datasets, proposes
      VUS-PR as the recommended metric. Newer than UCR_Anomaly; not
      directly comparable to it."

  M4:
    url: https://github.com/Mcompetitions/M4-methods
    modality: ts_forecast
    metrics: [smape, mase]
    warning: "100k time series across 6 frequencies; ensemble-heavy
      baseline. Do not compare with M5 (different target, hierarchical)."

  M5:
    url: https://www.kaggle.com/competitions/m5-forecasting-accuracy
    modality: ts_forecast_hierarchical
    metrics: [wrmssе, smape]
    warning: "Retail hierarchical forecast; WRMSSE is hierarchical-only.
      Not comparable to M4 sMAPE."

  RCT_IHDP:
    url: https://www.fredjo.com/
    modality: causal
    metrics: [ate_error, pehe]
    warning: "Semi-synthetic IHDP and RCT benchmarks. Different papers
      simulate treatment effect with different DGP; absolute PEHE
      differences < 0.1 are typically noise."

  CoxPH_Survival:
    url: https://github.com/sebp/scikit-survival/tree/master/sksurv/datasets
    modality: survival
    metrics: [c_index, ibs, brier_time]
    warning: "Collection of small survival datasets. C-index depends on
      censoring rate; compare only within the same dataset."

  LETOR:
    url: https://www.microsoft.com/en-us/research/project/letor-learning-rank-information-retrieval/
    modality: learning_to_rank
    metrics: [ndcg_at_k, map_at_k]
    warning: "LETOR datasets (MQ2007/MQ2008/MSLR-WEB10K) differ in query
      count and relevance labels; NDCG@10 is standard. Not comparable to
      recsys NDCG (different negative sampling)."

  Amazon_Recsys:
    url: https://cseweb.ucsd.edu/~jmcauley/datasets/amazon_v2/
    modality: recsys
    metrics: [recall_at_k, ndcg_at_k]
    warning: "Implicit-feedback split; NDCG@10 varies with negative
      sampling. Compare only within the same split."


  SST-2:
    url: https://huggingface.co/datasets/nyu-mll/glue
    modality: nlp_classification
    metrics: [accuracy]
    warning: "Binary sentiment (GLUE SST-2). Evaluated on GLUE dev/test splits; PLM numbers assume pre-trained transformers and are NOT comparable to from-scratch bag-of-words baselines."

  AG_News:
    url: https://www.kaggle.com/datasets/amananandrai/ag-news-classification-dataset
    modality: nlp_classification
    metrics: [accuracy, error_rate]
    warning: "4-class news topic. Numbers vary by tokenizer and train/test split; compare only within the same leaderboard."

  20Newsgroups:
    url: https://scikit-learn.org/stable/datasets/real_world.html#the-20-newsgroups-text-dataset
    modality: nlp_classification
    metrics: [accuracy, f1_macro]
    warning: "20-class newsgroup; 'all' vs 'subset' variants differ. Compare only within the same variant."

  Reuters:
    url: https://www.nltk.org/book/ch02.html
    modality: nlp_classification
    metrics: [accuracy, f1_macro]
    warning: "Reuters-21578 or RCV1; the two are NOT comparable. Use Reuters-21578 with ModApté split for the classic benchmark."

  MTEB:
    url: https://huggingface.co/spaces/mteb/leaderboard
    modality: nlp_embeddings
    metrics: [nDCG_at_10, mean_average_precision, main_score]
    warning: "Massive Text Embedding Benchmark (HuggingFace Space). Leaderboard rendered client-side; static HTML has no per-model numbers. Numbers are mean over task families; compare only on the same task subset."

  STS-B:
    url: https://huggingface.co/datasets/sentence-transformers/stsb
    modality: nlp_embeddings
    metrics: [spearman_cosine, pearson_cosine]
    warning: "Semantic Textual Similarity benchmark (GLUE STS-B). Spearman on dev/test; PLM numbers assume fine-tuning — NOT comparable to unsupervised TF-IDF/SVD cosine."

  cadw_internal_nlp:
    url: "https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches"
    modality: internal
    metrics: ["perplexity", "fit_time_s", "peak_rss_mb", "vocab_size"]
    warning: "CADW-native NLP measurements. NOT comparable to external leaderboards. Use only for runtime / perplexity on synthetic corpora from scripts/bench_*.py."

  cadw_internal:
    url: "https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches"
    modality: internal
    metrics: ["peak_rss_mb", "fit_time_s", "qini", "ndcg_at_k", "auprc", "rmse"]
    warning: "CADW-native measurement. NOT comparable to external
      leaderboards. Use only when (a) no public leaderboard exists for
      the metric (memory, runtime), or (b) as evidence in a
      cadw_reproduced pair. Never alone for cross-framework ranking.
      Also: metrics list is illustrative — schema accepts any string
      when benchmark=cadw_internal."

  Yahoo_R6A:
    url: https://webscope.sandbox.yahoo.com/catalog.php?datatype=r&did=1
    modality: bandit_ctr
    metrics: [ctr, ctr_lift_pct]
    warning: "Yahoo! Today Module R6A/R6B (Li et al. 2010). Numbers are CTR
      on the one-week evaluation set; lift is relative to epsilon-greedy.
      Not comparable to Open Bandit Dataset (different domain/protocol)."

  Open_Bandit_Dataset:
    url: https://github.com/st-tech/zr-obp
    modality: bandit_ctr
    metrics: [ctr, relative_ctr]
    warning: "ZOZO Open Bandit Dataset (Saito et al. 2020). CTR and relative
      CTR vs uniform-random. Different domain (fashion e-commerce) than
      Yahoo R6A; not comparable across the two."

  Mushroom:
    url: https://archive.ics.uci.edu/dataset/73/mushroom
    modality: bandit_simulated
    metrics: [cumulative_reward]
    warning: "UCI Mushroom, a standard simulated contextual-bandit benchmark
      (each arm's reward is deterministic per context). Cumulative reward
      depends on horizon and reward encoding; compare only within the same
      simulation."
