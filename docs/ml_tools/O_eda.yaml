  metrics:
  - name: auc
    combination: anchor
    direction: higher
    responsibility: Downstream model AUC (XAI is evaluated indirectly via model sanity).
    special: XAI has no ground-truth metric; report fidelity against a held-out baseline where possible.
  - name: fidelity
