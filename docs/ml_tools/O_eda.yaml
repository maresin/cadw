  metrics:
  - name: p_value
    combination: anchor
    direction: lower
    responsibility: p-value of the two-sample test; lower means stronger evidence against the null.
    special: Never compare p-values across experiments; the decision threshold is a design choice.
  - name: power
    combination: diagnostic
    direction: higher
    responsibility: Probability of detecting a true effect of the given size.
  - name: ci_width
    combination: diagnostic
    direction: lower
    responsibility: Width of the confidence interval on the effect; CUPED shrinks this.
  - name: cuped_theta
    combination: diagnostic
    direction: target
    responsibility: CUPED regression coefficient theta on the pre-period covariate.
  - name: t_p
    combination: diagnostic
    direction: lower
    responsibility: Welch t-test p-value for A/B.
  - name: mw_p
    combination: diagnostic
    direction: lower
    responsibility: Mann-Whitney U p-value for A/B.
  ensemble_recommendation:
  - roles:
    - probabilistic
    - calibration
    models:
    - ProportionsZTest
    - CUPED
    max_per_role: 2
    note: Use CUPED on top of ProportionsZTest when a pre-period covariate is available; drop to MannWhitneyU when the metric is heavy-tailed.
