  - name: PermutationImportance
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - calibration
    purpose: 'Shuffle one feature at a time and measure the drop in a chosen metric. Inductive bias: model-agnostic, captures any dependence; noisy under correlated features.'
    real_life_examples:
    - Model debug on tabular
    - Feature triage
    - Model card attributions
    config:
      n_repeats: int
      scoring: string
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://scikit-learn.org/stable/modules/permutation_importance.html
