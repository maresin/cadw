section: O
name: Data Science outside ML (EDA / cleaning / feature engineering / validation)
subtypes:
- id: O1
  name: EDA / descriptive statistics
  description: 'Summarize a dataset: per-column statistics, distributions, frequencies — aggregate-first, no row materialization.'
  real_life:
  - Quick profile of a new table
  - Report-ready summary statistics
  - Distribution sanity check before modeling
  benchmarks:
  - name: sklearn_reference
    url: https://scikit-learn.org/stable/modules/
    metrics:
    - describe
    - hist
    - value_counts
    note: Descriptive-statistics primitives; no cross-library accuracy leaderboard exists.
  models:
  - name: Describe
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - linear_signal
    purpose: 'Per-column count/mean/std/min/max/quantiles computed by a Reduce over chunks. Inductive bias: none — pure descriptive summary; no model.'
    real_life_examples:
    - New-table profiling
    - Feature sanity before fit
    - Report tables
    config:
      quantiles: list
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/eda.json
      algorithm: cadw.CadwDataFrame.describe
      algorithm_source_url: cadw/dataframe/_aggregations.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: eda
      n_datasets: 2
      metric: fit_time_s
      value: 9.2618
      note: 'CADW-native: describe fit_time_s=0.4961 @n=10k, 9.2618 @n=100k (d=11, single-chunk; eda.json). NOT comparable to external.'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/eda.json
      algorithm: cadw.CadwDataFrame.describe
      algorithm_source_url: cadw/dataframe/_aggregations.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: eda
      n_datasets: 2
      metric: peak_rss_mb
      value: 7.13
      note: 'CADW-native: peak_mb=3.46 @n=10k, 7.13 @n=100k (eda.json). NOT comparable to external.'
    cadw_module: cadw.dataframe
    cadw_function: describe
    input_api: df
    state_class: O(d)
    bounded_state_dims: {d: 1}
    transient_factor: 1.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'no fit; per-column streaming count/mean/std/min/max/quantile Reduce.'
      predict: 'returns summary table (output, not state).'
    primitive_reuse: [reduce]
  - name: Hist
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - representation
    purpose: 'Binned per-column histogram via a Shuffle+Reduce over chunk-wise partial counts. Inductive bias: fixed-width bins; no model.'
    real_life_examples:
    - Distribution plots
    - Skew detection
    - Report figures
    config:
      bins: int
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.KBinsDiscretizer.html
      algorithm: sklearn.preprocessing.KBinsDiscretizer
      algorithm_source_url: https://scikit-learn.org/stable/modules/preprocessing.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: eda
      n_datasets: null
      metric: accuracy
      value: null
      note: 'no_public_benchmark: binning is a preprocessing primitive; no accuracy leaderboard applies.'
    cadw_module: cadw.plot_accessor
    cadw_function: hist
    input_api: df
    state_class: O(1)
    bounded_state_dims: {}
    transient_factor: 1.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'no fit; streaming bin counts (bins hyperparameter).'
      predict: 'returns histogram table (output).'
    primitive_reuse: [reduce]
  - name: ValueCounts
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - probabilistic
    purpose: 'Per-category frequency via groupby+Reduce. Inductive bias: none — counts only.'
    real_life_examples:
    - Cardinality check
    - Top-K category report
    - Class imbalance look
    config:
      normalize: bool
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://scikit-learn.org/stable/modules/feature_selection.html
      algorithm: pandas.Series.value_counts
      algorithm_source_url: https://pandas.pydata.org/docs/reference/api/pandas.Series.value_counts.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: eda
      n_datasets: null
      metric: accuracy
      value: null
      note: 'no_public_benchmark: frequency counting has no accuracy benchmark. CADW multi-chunk value_counts hits BUG-1 (see .pingis/audits/v0.9.48_bugs.md).'
    cadw_module: cadw.dataframe
    cadw_function: value_counts
    input_api: df
    state_class: O(model)
    bounded_state_dims: {k: 1, d: 1}
    transient_factor: 1.0
    state_type: partitioned
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'no fit; HashShuffle by value -> per-partition count; multi-chunk safe.'
      predict: 'returns value/count table (output).'
    primitive_reuse: [hash_shuffle, reduce]
  - name: YDataProfiling
    tier: sota
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - representation
    purpose: Full dataset profile (missingness, cardinality, correlations, distributions) in one pass; external library, not shipped.
    real_life_examples:
    - Automatic EDA report
    - Data-quality hand-off
    - Notebook profiling
    config:
      minimal: bool
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://scikit-learn.org/stable/
      algorithm: ydata-profiling.ProfileReport
      algorithm_source_url: https://github.com/ydataai/ydata-profiling
      algorithm_source_kind: docs
      attribution: literature
      task_type: eda
      n_datasets: null
      metric: accuracy
      value: null
      note: 'no_public_benchmark: no EDA-profiling leaderboard exists. Official docs URL https://ydata-profiling.ydata.ai/docs/master/ returned status=404 (fetch_failed); the algorithm source is the GitHub repo.'
  metrics:
  - name: fit_time_s
    combination: anchor
    direction: lower
    responsibility: Wall-clock for a full describe over the frame.
    special: Chunk-size and d dependent; report n and d.
  - name: peak_rss_mb
    combination: diagnostic
    direction: lower
    responsibility: Peak resident memory during describe.
    special: tracemalloc-based; single-chunk numbers only (see BUG-1).
  - name: accuracy
    combination: diagnostic
    direction: higher
    responsibility: Accuracy metric placeholder for binning preprocessing; no meaningful leaderboard.
    special: Reported as null; semantics noted.
  ensemble_recommendation:
  - roles:
    - representation
    models:
    - Describe
    - Hist
    max_per_role: 3
    note: Layer the external profiler on top of CADW primitives for a richer report while keeping compute in the frame.
- id: O2
  name: Data cleaning / imputation
  description: Fill missing values without leaking information across the split; preserve distributional shape.
  real_life:
  - Sensor dropouts in telemetry
  - Survey non-response
  - Medical record gaps
  benchmarks:
  - name: sklearn_reference
    url: https://scikit-learn.org/stable/modules/impute.html
    metrics:
    - rmse
    - accuracy
    note: Imputation primitives; no cross-library leaderboard. RMSE of imputed vs true values is the standard proxy.
  models:
  - name: SimpleImputer
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - linear_signal
    purpose: 'Replace missing values with a column statistic (mean/median/mode) computed by Reduce. Inductive bias: missing-at-random per column; destroys inter-column correlation.'
    real_life_examples:
    - Filling numeric gaps quickly
    - Pre-model baseline
    - Survey mode fill
    config:
      strategy: string
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://scikit-learn.org/stable/modules/impute.html
      algorithm: sklearn.impute.SimpleImputer
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.impute.SimpleImputer.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: imputation
      n_datasets: null
      metric: rmse
      value: null
      note: 'no_public_benchmark: SimpleImputer is a reference primitive; no published per-dataset RMSE table exists.'
    cadw_module: cadw.dataframe
    cadw_function: fillna
    input_api: df
    state_class: O(d)
    bounded_state_dims: {d: 1}
    transient_factor: 1.0
    state_type: elementwise
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'streaming per-column fill value (mean/median/mode).'
      predict: 'per-batch fillna with fitted constants.'
    primitive_reuse: [reduce]
  - name: KNNImputer
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      described_only: true
    roles:
    - local_structure
    purpose: 'Impute from k nearest neighbours in feature space. Inductive bias: local similarity predicts missing values; O(n²) naive, requires blocking.'
    real_life_examples:
    - Filling correlated sensor gaps
    - Recommendation-style fill
    - Small-n survey imputation
    config:
      n_neighbors: int
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://scikit-learn.org/stable/modules/impute.html
      algorithm: sklearn.impute.KNNImputer
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.impute.KNNImputer.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: imputation
      n_datasets: null
      metric: rmse
      value: null
      note: 'no_public_benchmark: KNNImputer docs example numbers are illustrative, not a benchmark ranking.'
  - name: IterativeImputer
    tier: sota
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
    roles:
    - linear_signal
    - representation
    purpose: 'Iteratively regress each feature on the others (MICE / EM-like). Inductive bias: linear cross-feature structure; captures correlations SimpleImputer loses.'
    real_life_examples:
    - Clinical multi-feature gaps
    - Survey with correlated items
    - Sensor fusion with redundancy
    config:
      max_iter: int
      estimator: string
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://scikit-learn.org/stable/modules/impute.html
      algorithm: sklearn.impute.IterativeImputer
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.impute.IterativeImputer.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: imputation
      n_datasets: null
      metric: rmse
      value: null
      note: 'no_public_benchmark: IterativeImputer ships no per-dataset RMSE table; it is the reference MICE implementation.'
  metrics:
  - name: rmse
    combination: anchor
    direction: lower
    responsibility: RMSE of imputed vs held-out true values.
    special: Only comparable within the same missingness mask and split; MCAR vs MAR matters.
  - name: accuracy
    combination: diagnostic
    direction: higher
    responsibility: Downstream classification accuracy after imputation.
    special: Downstream-dependent; report the model used.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - local_structure
    models:
    - SimpleImputer
    max_per_role: 2
    note: Use SimpleImputer as the fast fallback; escalate to KNNImputer only for small-n correlated gaps.
- id: O3
  name: Feature engineering / encoding
  description: 'Transform raw columns into model-ready features: categorical encoders, binning, polynomial expansions.'
  real_life:
  - Categorical columns to one-hot
  - Continuous variables to bins
  - Interaction features for linear models
  benchmarks:
  - name: OpenML_Benchmarks
    url: https://www.openml.org/search?type=benchmark
    metrics:
    - accuracy
    note: Feature encoding is evaluated through downstream accuracy; OpenML suites (CC18/CTR23) provide the tabular tasks.
  models:
  - name: OneHotEncoder
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      described_only: true
      reference_impl_ready: true
    roles:
    - representation
    purpose: 'Expand a categorical column to one binary indicator per category. Inductive bias: categories are independent; high cardinality explodes dimensionality.'
    real_life_examples:
    - Small-cardinality categoricals
    - Linear model preprocessing
    - Tree-friendly encodings
    config:
      handle_unknown: string
    benchmark_results:
    - benchmark: OpenML_Benchmarks
      benchmark_url: https://www.openml.org/search?type=benchmark
      algorithm: sklearn.preprocessing.OneHotEncoder
      algorithm_source_url: https://scikit-learn.org/stable/modules/preprocessing.html#encoding-categorical-features
      algorithm_source_kind: docs
      attribution: literature
      task_type: tabular
      n_datasets: null
      metric: accuracy
      value: null
      note: 'no_public_benchmark: encoding is a preprocessing step; OpenML leaderboards rank full pipelines, not encoders alone.'
  - name: KBinsDiscretizer
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      described_only: true
    roles:
    - representation
    purpose: 'Bin a continuous column into k quantile/uniform bins. Inductive bias: piecewise-constant effect of the feature; can help non-linear models and regularize.'
    real_life_examples:
    - Age buckets
    - Income deciles
    - Monotone encoding for linear models
    config:
      n_bins: int
      strategy: string
    benchmark_results:
    - benchmark: OpenML_Benchmarks
      benchmark_url: https://www.openml.org/search?type=benchmark
      algorithm: sklearn.preprocessing.KBinsDiscretizer
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.KBinsDiscretizer.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: tabular
      n_datasets: null
      metric: accuracy
      value: null
      note: 'no_public_benchmark: binning has no standalone accuracy leaderboard.'
  - name: PolynomialFeatures
    tier: sota
    tier_level: tier1_core
    implementation_status:
      described_only: true
    roles:
    - nonlinear_interactions
    - representation
    purpose: 'Expand features to degree-k polynomial terms, adding cross-products. Inductive bias: interaction structure is multiplicative; explodes d^k without regularization.'
    real_life_examples:
    - Linear model with interactions
    - Physics formula recovery
    - Feature crosses for CTLs
    config:
      degree: int
      interaction_only: bool
    benchmark_results:
    - benchmark: OpenML_Benchmarks
      benchmark_url: https://www.openml.org/search?type=benchmark
      algorithm: sklearn.preprocessing.PolynomialFeatures
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.preprocessing.PolynomialFeatures.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: tabular
      n_datasets: null
      metric: accuracy
      value: null
      note: 'no_public_benchmark: polynomial expansion is a preprocessing transform; no standalone leaderboard.'
  - name: EncodeCategorical
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - representation
    purpose: 'Map each unique category to a dense int32 id, sorted for determinism. Pass 1: pc.value_counts per batch, union in a Python set (O(K) RAM). Pass 2: pc.index_in streaming over batches (O(batch) per batch). Inductive bias: none — pure representation; reverse_maps is O(K) by contract.'
    real_life_examples:
    - Categorical to tree/linear feature
    - Deterministic id assignment across runs
    - Pre-fit encoding for downstream models
    config:
      columns: "str or Sequence[str]"
    cadw_module: cadw.dataframe
    cadw_function: encode_categorical
    input_api: df
    state_class: O(K)
    state_type: aggregation
    bounded_state: false
    tier1_core_exception: "reverse_maps is list[unique_values] (public API contract, O(K) by design); Pass 2 encoding is O(batch). K <= state_limit works (default ~70 MB). v0.9.102 targets lazy reverse_maps (SpillMap on disk)."
    n_scalability: refuse_at_guard
    streaming_strategy:
      fit: 'Pass 1 uniques in a Python set (O(K)); Pass 2 pc.index_in streaming (O(batch)).'
      predict: 'N/A (pure transform).'
    primitive_reuse: []
    bounded_state_dims: {K: 1}
    transient_factor: 22.5
  metrics:
  - name: accuracy
    combination: anchor
    direction: higher
    responsibility: Downstream accuracy of the model trained on the transformed features.
    special: Depends on the model and the split; report both.
  ensemble_recommendation: []
- id: O4
  name: Feature selection
  description: Rank and drop features by relevance, redundancy or stability before modeling.
  real_life:
  - High-dimensional genomics / wide tables
  - Reducing training cost for GBDT
  - Removing leakage / constant columns
  benchmarks:
  - name: OpenML_Benchmarks
    url: https://www.openml.org/search?type=benchmark
    metrics:
    - accuracy
    note: Feature selection is evaluated through downstream accuracy on tabular suites; no standalone leaderboard.
  - name: cadw_internal
    url: https://github.com/maresin/Cadw_framework/tree/main/.pingis/benches
    metrics:
    - fit_time_s
    - peak_rss_mb
    note: CADW measured fit time and peak RSS of the selection algorithms; NOT comparable to external accuracy.
  models:
  - name: MutualInfoSelect
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - linear_signal
    - probabilistic
    purpose: 'Rank features by mutual information to the target (binned for continuous). Inductive bias: any monotone or non-monotone dependence is detected; no assumption of linearity.'
    real_life_examples:
    - Genomic feature triage
    - Text n-gram pruning
    - Wide-table reduction
    config:
      k: int
      n_bins: int
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/feature_select.json
      algorithm: cadw.ml.feature_select.fit_feature_select (mutual_info)
      algorithm_source_url: cadw/ml/feature_select.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: feature_selection
      n_datasets: 2
      metric: fit_time_s
      value: 3.962
      note: 'CADW-native: mutual_info fit_s=1.508 @n=10k, 3.962 @n=50k, d=20 (feature_select.json). NOT comparable to external.'
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/feature_select.json
      algorithm: cadw.ml.feature_select.fit_feature_select (mutual_info)
      algorithm_source_url: cadw/ml/feature_select.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: feature_selection
      n_datasets: 2
      metric: peak_rss_mb
      value: 13.7
      note: 'CADW-native: mutual_info peak_mb=85.0 @n=10k, 13.7 @n=50k (feature_select.json; higher at small n due to fixed overheads). NOT comparable to external.'
    - benchmark: OpenML_Benchmarks
      benchmark_url: https://scikit-learn.org/stable/modules/feature_selection.html
      algorithm: sklearn.feature_selection.mutual_info_classif
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.feature_selection.mutual_info_classif.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: feature_selection
      n_datasets: null
      metric: accuracy
      value: null
      note: 'no_public_benchmark: sklearn docs describe mutual_info_classif but publish no cross-dataset accuracy leaderboard for the selector.'
    cadw_module: cadw.ml.feature_select
    cadw_function: fit_feature_select
    input_api: df
    state_class: O(d)
    bounded_state_dims: {d: 1}
    transient_factor: 1.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'per-feature joint histogram (X bin, Y class) Reduce.'
      predict: 'returns ranked feature list (output).'
    primitive_reuse: [reduce]
  - name: VarianceThreshold
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - linear_signal
    purpose: 'Drop features whose variance is below a threshold. Inductive bias: low variance means low information; catches constants and near-constants cheaply.'
    real_life_examples:
    - Drop constant columns
    - Cheap pre-filter
    - Remove near-zero-variance sensors
    config:
      threshold: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/feature_select.json
      algorithm: cadw.ml.feature_select.fit_feature_select (variance)
      algorithm_source_url: cadw/ml/feature_select.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: feature_selection
      n_datasets: 2
      metric: fit_time_s
      value: 0.032
      note: 'CADW-native: variance fit_s=0.003 @n=10k, 0.032 @n=50k (feature_select.json). NOT comparable to external.'
    cadw_module: cadw.ml.feature_select
    cadw_function: fit_feature_select
    input_api: df
    state_class: O(d)
    bounded_state_dims: {d: 1}
    transient_factor: 1.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'per-column Welford variance Reduce.'
      predict: 'returns selected feature list (output).'
    primitive_reuse: [reduce]
  - name: BorutaSelect
    tier: sota
    tier_level: tier2_wrapper
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: 'Shadow-feature wrapper: repeated GBDT fits compare real vs shuffled shadow features; selects only those that beat all shadows. Inductive bias: relevance detectable by tree ensembles; stable, expensive.'
    real_life_examples:
    - Tabular feature triage
    - Genomic relevance
    - Stable selection for production
    config:
      n_iter: int
      max_depth: int
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/feature_select.json
      algorithm: cadw.ml.feature_select.fit_feature_select (boruta)
      algorithm_source_url: cadw/ml/feature_select.py
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: feature_selection
      n_datasets: 3
      metric: fit_time_s
      value: 8.355
      note: 'CADW-native: boruta fit_s=4.642 @n=2k, 5.394 @n=5k, 8.355 @n=10k; n_selected=2 of d=20 (feature_select.json). NOT comparable to external.'
    cadw_module: cadw.ml.feature_select
    cadw_function: fit_feature_select
    input_api: df
    state_class: O(batch)
    bounded_state_dims: {batch: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'shadow features + GBDT P1a codes path, multi-trial (bounded iterations).'
      predict: 'returns selected features (output).'
    primitive_reuse:
    - reduce
    - spill_dir
    - codes_bin
  metrics:
  - name: accuracy
    combination: anchor
    direction: higher
    responsibility: Downstream model accuracy after feature selection.
    special: Model-dependent; report the downstream model.
  - name: fit_time_s
    combination: diagnostic
    direction: lower
    responsibility: Selection wall-clock.
  - name: peak_rss_mb
    combination: diagnostic
    direction: lower
    responsibility: Selection peak memory.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - VarianceThreshold
    - MutualInfoSelect
    max_per_role: 2
    note: Always start with VarianceThreshold (near-free); layer MutualInfo on survivors.
- id: O5
  name: Validation / data quality
  description: Assert schema and statistical contracts on incoming batches before fitting or scoring.
  real_life:
  - Pipeline entry validation
  - Schema drift detection
  - Data contract enforcement
  benchmarks:
  - name: sklearn_reference
    url: https://scikit-learn.org/stable/modules/
    metrics:
    - validation_rate
    note: Schema/contract libraries; no accuracy benchmark exists.
  models:
  - name: PanderaSchema
    tier: baseline
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
    roles:
    - calibration
    purpose: 'Declarative dataframe schema (dtypes, ranges, unique, custom checks). Inductive bias: a fixed contract; no learning.'
    real_life_examples:
    - Parquet-load schema guard
    - Statistical range asserts
    - Pandas-style data contracts
    config:
      strict: bool
    benchmark_results:
    - benchmark: sklearn_reference
      benchmark_url: https://pandera.readthedocs.io/en/stable/
