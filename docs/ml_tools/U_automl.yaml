# U - AutoML (end-to-end pipeline search)
# v0.9.125 (DEC-048/049). 3 described_only cards, 1 subtype.
# Full-pipeline AutoML (preprocessing + model + HPO + ensembling).
# HPO-only canonical in T_optimization; GridSearch/RandomizedSearch in O_eda.O7.

section: U
name: AutoML
subtypes:
  - id: U1
    name: "Full AutoML (pipeline search + ensemble)"
    description: "Search over full pipelines: preprocessing, model family, hyperparameters, ensemble. Produces a fitted pipeline given a task."
    real_life: ["Rapid prototyping on new tabular tasks", "Non-expert ML deployment", "Baseline reference for custom models"]
    benchmarks:
      - {name: AMLB, url: "https://openml.github.io/automlbenchmark/", metrics: [mean_rank, mean_elapsed_time], note: "AutoML Benchmark 2025: per-task ranks across classifiers/regressors. Best public AutoML leaderboard."}
    models:
      - name: Auto-sklearn
        tier: baseline
        tier_level: tier3_export
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [nonlinear_interactions, linear_signal]
        purpose: "Feurer et al. 2015: Bayesian HPO over sklearn pipelines + meta-learning + ensemble. Historically first strong AutoML; AutoGluon now dominates benchmarks."
        real_life_examples: ["Baseline AutoML", "Small-data prototyping"]
        config: {time_left_for_this_task: int, per_run_time_limit: int}
        benchmark_results:
          - {benchmark: AMLB, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'auto-sklearn 2.0', algorithm_source_url: 'https://arxiv.org/abs/2007.04074', algorithm_source_kind: paper, attribution: literature, task_type: automl, n_datasets: null, metric: mean_rank, value: null, note: 'AMLB 2025: not top-3 on modern benchmarks.'}

      - name: H2OAutoML
        tier: baseline
        tier_level: tier3_export
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [nonlinear_interactions, linear_signal]
        purpose: "LeDell & Poirier 2020: stacked ensemble over GBM/DRF/XGBoost/GLM. Fast; well-tuned defaults; competitive on mid-size tabular."
        real_life_examples: ["Production AutoML", "Medium tabular tasks"]
        config: {max_models: int, max_runtime_secs: int}
        benchmark_results:
          - {benchmark: AMLB, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'H2O AutoML', algorithm_source_url: 'https://docs.h2o.ai/h2o/latest-stable/h2o-docs/automl.html', algorithm_source_kind: docs, attribution: literature, task_type: automl, n_datasets: null, metric: mean_rank, value: null, note: 'AMLB 2025: top-5 on many tasks.'}

      - name: AutoGluon_1_2
        tier: sota
        tier_level: tier3_export
        implementation_status:
          described_only: true
          not_implemented_in_cadw: true
        roles: [nonlinear_interactions, linear_signal, representation, probabilistic]
        purpose: "Erickson et al. 2020: multi-layer stacking + bagging + repeated k-fold. AutoML Benchmark 2025 SOTA: Pareto-efficient quality/speed, >10k samples/sec inference. Reference impl: AutoGluon TabularPredictor."
        real_life_examples: ["SOTA tabular AutoML", "High-quality baseline for custom models"]
        config: {time_limit: int, presets: string}
        benchmark_results:
          - {benchmark: AMLB, benchmark_url: 'https://openml.github.io/automlbenchmark/', algorithm: 'AutoGluon 1.2', algorithm_source_url: 'https://arxiv.org/abs/2003.06505', algorithm_source_kind: paper, attribution: literature, task_type: automl, n_datasets: null, metric: mean_rank, value: null, note: 'AMLB 2025: statistically significantly better than other AutoML (paper).'}
    metrics:
      - {name: mean_rank, combination: anchor, direction: lower, responsibility: "Mean rank across AMLB tasks; primary AutoML leaderboard metric.", special: "Number of tasks matters; report with n_datasets. Not comparable to per-dataset accuracy.", not_implemented_in_cadw: true}
      - {name: mean_elapsed_time, combination: diagnostic, direction: lower, responsibility: "Wall-clock per task (fit + predict).", special: "Hardware-specific; time budget matters for rank comparability."}
