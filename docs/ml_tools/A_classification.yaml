      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: imbalanced binary classification
      n_datasets: null
      metric: pr_auc
      value: 0.42
      std: null
      note: AMLB imbalance subset [legacy v0.9.44, migrated v0.9.50]
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    ram_formula: "2 * batch * row_size + 4 * d * d * f64"
    formula_evidence:
      batch_term: "same (class_weight); a=3.05"
      state_term: "b=3.97"
      guard: "logistic.py:LogisticGradOp.batch_memory_factor = 4.0"
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise class-weighted XTX / XTy Reduce.'
      predict: 'per-batch sigmoid.'
    primitive_reuse: [reduce]
  - name: GBDT_scale_pos_weight
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: Cost-sensitive GBDT; weight positives by neg/pos ratio (XGBoost semantics).
    real_life_examples:
    - Fraud detection
    - Defect detection
    config:
      scale_pos_weight: float
      n_estimators: int
    cadw_module: cadw.ml.gbdt
    cadw_function: fit_gbdt_classifier
    input_api: df
