    url: https://openml.github.io/automlbenchmark/
    metrics:
    - accuracy
  models:
  - name: OrdinalLogit
    tier: baseline
    tier_level: tier1_core
    ram_formula: 2 * d * f64 + 512 + 2.0 * batch * row_size
    formula_evidence:
      beta: ordinal.py -- OrdinalLogitModel.beta_ = (d,) f64 = d*f64
      theta: ordinal.py -- OrdinalLogitModel.theta_ = (K-1,) f64 = (K-1)*f64
      header: ordinal.py -- classes_ ndarray + feature_cols list + params dict = 256
    min_ram_formula: 2 * d * f64 + 512 + 2.0 * 1 * row_size
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      subsample_note: Subsample cap 20000 rows (S2b-2a); state = beta(d) + theta(K-1) + 512.
      verification_mode: component-wise (DEC-033)
      state_check: 'test_state_nbytes_exact: bit-exact, (d,K) parametrized (5/3, 10/4, 20/5)'
      state_independent_of_n: 'test_state_independent_of_n: state(n=2k)==state(n=10k)'
      formula_sanity: 'test_formula_small_scale: predicted+5MB baseline / measured in [0.5,2.0]'
      peak_linear: 'test_peak_grows_linearly_with_n: ratio < 15 at 10x n (n=3k vs 30k)'
      bounded_domain: 'test_guard_refuses_at_domain_bound: n=1e6 + 10MB guard -> MemoryLimitExceeded'
      tight_guard: 'test_tight_guard_raises: MemoryLimitExceeded via _FakeMB'
      cells_passed: 5/5
    implementation_status:
      verified_in_cadw: true
      status: verified
      verified_by_agent: true
    roles:
    - linear_signal
    purpose: Cumulative-link logistic; respects class order.
    real_life_examples:
    - Satisfaction survey prediction
    config:
      alpha: float
    cadw_module: cadw.ml.ordinal
    cadw_function: fit_ordinal_logit
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on:
    - cadw.ops.numeric.sigmoid
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: mord.LogisticAT
      algorithm_source_url: https://pythonhosted.org/mord/
      algorithm_source_kind: docs
      attribution: literature
      task_type: ordinal classification
      n_datasets: null
      metric: accuracy
      value: 0.55
      std: null
      note: exact-match accuracy [legacy v0.9.44, migrated v0.9.50]
    state_class: O(d)
    bounded_state_dims:
      d: 1
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: K-1 cumulative-logit Reduces over shared beta (d² Hessian).
      predict: per-row cumulative P(y<=k) from fitted thresholds.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state d:1; independent of n. Module: cadw.ml.ordinal.'
  - name: GBDT_threshold
    tier: sota
    depends_on: []
    tier_level: tier1_core
    implementation_status:
      described_only: true
    roles:
    - nonlinear_interactions
    purpose: GBDT on cumulative logits; SOTA when relations are nonlinear.
    real_life_examples:
    - Risk bands in finance
    config:
      n_estimators: int
      max_depth: int
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.ensemble.GradientBoostingClassifier
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: ordinal classification
      n_datasets: null
      metric: accuracy
      value: 0.6
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    ooc_status: achievable
    ooc_strategy: 'Not implemented. Planned approach: GBDT on cumulative logits; SOTA when relations are nonlinear... Pattern chosen on implementation (ROADMAP §OOC by primitive).'
  - name: OrderedProbitBayesian
    tier: sota
    tier_level: tier2_wrapper
    ooc_status: achieved
    ooc_strategy: 'Dual method. sghmc (default): SGHMC over marginal (β,a)-posterior; mini-batch gradient O(batch*d); achieved OOC. gibbs: exact Albert-Chib z-augmentation; O(n) per iter, full data (bounded_by_domain n<=1e5).'
    bounded_by_domain:
      axis: n
      bound: 100000
      reason: "method in {'gibbs', 'nuts'}: intrinsic O(n); sghmc/srvr-hmc OOC at any n"
    depends_on:
    - cadw.ops.mcmc.sgmcmc
    - cadw.ops.numeric.norm_cdf
    - cadw.ml._gbdt_common.cumulative_logit_prob
    implementation_status:
      verified_in_cadw: true
      status: verified
    cadw_module: cadw.ml.ordered_probit
    cadw_function: fit_ordered_probit
    input_api: df
    fit_batched: true
    predict_batched: false
    n_scalability: constant
    bounded_state: true
    bounded_state_dims: {d: 1, n_classes: 1, n_samples: 1}
    state_class: O(model)
    state_type: aggregation
    ram_formula: n_samples * (d + n_classes) * f64 + d * f64 + n_classes * f64 + 3.0 * batch * row_size + 256
    min_ram_formula: 1 * (d + n_classes) * f64 + d * f64 + n_classes * f64 + 3.0 * 1 * row_size + 256
    formula_evidence:
      samples_state: 'ordered_probit.py -- coef_samples_(n_samples,d) + cutpoints_samples_(n_samples,K-1); O(n_samples*(d+K-1))'
      mean_state: 'ordered_probit.py -- coef_mean_(d) + cutpoints_mean_(K-1)'
      header: 'ordered_probit.py -- OrderedProbitModel.state_nbytes +256'
      batch_term: 'ordered_probit.py -- check_batch(extra_factor=3.0) in sgmcmc / gibbs iterations'
    min_ram_evidence:
      derived_from: 'ram_formula with n_samples=1, batch=1 (auto-migrate v0.9.177)'
    measurement:
      verification_mode: 'component-wise (DEC-033)'
      state_check: 'test_state_nbytes_exact (d, n_classes, n_samples)'
      state_bounded: 'test_state_independent_of_n: identical at n=500/2000/5000'
      guard: 'test_guard_refuses_at_tight'
      correctness: 'test_recovers_ordered_classes (synthetic 3-class); test_cutpoints_monotone (structural); test_sghmc_vs_gibbs_agree (mean cutpoints within tol)'
      cells_passed: '6/6 (sghmc) + 4/4 (gibbs at n<=1e5)'
      runtime_sec: 'sghmc ~10; gibbs ~20'
      note: 'Quad method. sghmc (default): Chen 2014 + Springer 2016 reference (P63/P64: Gaussian mean=1.989 std=0.031; ordered probit coef_err=0.032 cp_err=0.112). gibbs (opt-in): Albert-Chib 1993 exact (P46: coef_err=0.087). srvr-hmc (v0.9.229-b): Zou 2019 variance-reduced (P76: Gaussian mean=1.994 std=0.036; primitive== reference). nuts (v0.9.229-c): Hoffman 2014 (P82: Gaussian mean=1.991 std=0.029; first-try pass). Hyperparameters: V_hat=I, C=20*I, lr=0.01 (sghmc); gamma=20, L=10, B=100 (srvr-hmc); lr=0.1, depth=8 (nuts).'
    roles:
    - probabilistic
    purpose: 'Bayesian ordered probit: latent Gaussian + cutpoints; full posterior over thresholds.'
    real_life_examples:
    - Ordinal survey responses
    - Severity grading
    config:
      n_draws: int
      prior_scale: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: OrderedProbitBayesian
      algorithm_source_url: https://arxiv.org/abs/2104.05494
      algorithm_source_kind: paper
      attribution: literature
      task_type: ordinal classification
      n_datasets: null
      metric: mae_ordinal
      value: null
      note: 'no_public_benchmark: ordered probit per-dataset'
  metrics:
  - name: mae_ordinal
    combination: anchor
    direction: lower
    responsibility: Distance-aware accuracy; respects ordered classes.
    special: Preferred to accuracy; a 1→2 error is less costly than 1→5.
  - name: accuracy
    combination: diagnostic
    direction: higher
    responsibility: Exact-match accuracy.
    special: Ignores distance; misleads when ordinal distance matters.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - OrdinalLogit
    max_per_role: 1
    note: Single model — GBDT-threshold is described_only, wait for verification.
