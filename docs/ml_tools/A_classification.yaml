  - name: GBDT_scale_pos_weight
    cadw_module: cadw.ml.gbdt
    cadw_function: fit_gbdt_classifier
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256
    formula_evidence:
      trees: gbdt.py:_grad_hess -- weight w = where(y>0.5, pos_weight, 1.0); tree build identical
      minmax: gbdt.py:_MinMaxOp -- mn_, mx_ = 2*d*f64
      header: gbdt.py:_STATE_HEADER_BYTES=256
      state_nbytes: gbdt.py:GBDTClassifier.state_nbytes -- _deep_nbytes per tree
    min_ram_formula: n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      fit_transient_note: 'S1 audit: fit transient = pred/grad/hess (n × 90 B); persistent trees bounded. Refactor planned v0.9.168+ (SpillDir memmap for grad/hess/pred → truly O(batch)).'
      verification_mode: component-wise (DEC-033)
      state_check: 'test_*_state_within_upper_bound: actual ∈ [0.20, 1.0] of upper_bound'
      state_ooc: 'test_*_state_independent_of_n: same params, n=1k vs n=10k -> ratio <= 3.0'
      guard_refuse: 'test_*_guard_refuses: n=200 + 0.001 MB -> MemoryLimitExceeded'
      correctness: test_*_classification/regression/multiclass existing suites green
      cells_passed: 3/3
      runtime_sec: ~3
    bounded_state: true
    bounded_state_dims:
      n_estimators: 1
      max_depth: 1
      d: 1
    bounded_by_domain:
      axis: n
      bound: 100000
      reason: 'S1 audit: fit transient pred/grad/hess (n × 90 B) in RAM; codes in SpillDir memmap. Persistent state = trees (bounded, state_nbytes exact). Refactor planned v0.9.168+.'
    state_class: O(model)
    state_type: iterative
    n_scalability: constant
    tier1_core_exception: 'Tree-ensemble state is bounded by {n_estimators: 1, max_depth: 1, d: 1}; iter per tree: weighted hist reduce. n-independent (trees do not grow with n).'
    streaming_strategy:
      fit: 'per-tree Reduce over histograms (S nodes × F features × B bins); iter per tree: weighted hist reduce.'
      predict: per-batch _iter_filtered_batches -> stacked X -> tree descend; O(batch × trees).
    primitive_reuse:
    - reduce
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - nonlinear_interactions
    purpose: Cost-sensitive GBDT; weight positives by neg/pos ratio (XGBoost semantics).
    real_life_examples:
    - Fraud detection
    - Defect detection
    config:
      scale_pos_weight: float
      n_estimators: int
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: XGBoost scale_pos_weight
      algorithm_source_url: https://xgboost.readthedocs.io/en/stable/parameter.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: imbalanced binary classification
      n_datasets: null
      metric: pr_auc
      value: 0.51
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    transient_factor: 1.0
    ooc_status: debt
    ooc_strategy: 'Plan: Round-by-round SpillArray: grad/hess/pred to SpillDir memmap (precedent LambdaMART v0.9.87-P2b-full-... Target: v0.9.180+. Current bound: S1 audit: fit transient pred/grad/hess (n × 90 B) in RAM; codes in SpillDir memm. Guard refuses above state_limit.'
    ooc_alternative: |
      Permanent intrinsic for current gbdt: partial memmap (v0.9.172, DEC-065) leaks dirty pages to RSS at ~20-24 B/row; true OOC requires posix_fadvise/direct I/O refactor (deferred DEC-065 v0.9.173+). Multiclass additionally has cur_leaf_c = np.zeros(n_total) (gbdt.py:127) unmemmapped.
      
      Replacement path: CadwBoost (.pingis/drafts/cadwboost/) is TRUE OOC (ratio 0.41x at n=50k-200k, verified v0.9.221 P46/P47). Promote target v0.9.222-224 (tests + wire + CW).
      
      bounded_by_domain n<=1e5 honest: ~2 MB at 1e5 with 24 B/row.
  - name: RUSBoost
    tier: sota
    depends_on:
    - cadw.ml._gbdt_common.adaboost_weight
    - cadw.ops.stats.normalize_weights
    tier_level: tier2_wrapper
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - probabilistic
    purpose: Random Under-Sampling + AdaBoost (Seiffert 2010); robust on skewed binary.
    real_life_examples:
    - Fraud detection (1:100)
    - Medical rare-disease screening
    config:
      n_estimators: int
      sampling_rate: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: RUSBoost
      algorithm_source_url: https://ieeexplore.ieee.org/document/5438940
      algorithm_source_kind: paper
      attribution: literature
      task_type: imbalanced binary classification
      n_datasets: null
      metric: pr_auc
      value: null
      note: 'no_public_benchmark: RUSBoost per-dataset'
  metrics:
  - name: pr_auc
    combination: anchor
    direction: higher
    responsibility: Discrimination of the rare class; prefers models that rank positives high.
    special: Much lower than roc_auc when imbalance is strong; use only pr_auc comparisons for this subtype.
  - name: roc_auc
    combination: diagnostic
    direction: higher
    responsibility: Discrimination of rare class (legacy comparison).
    special: Overly optimistic under heavy imbalance; do not use as anchor.
  - name: recall_at_1pct
    combination: pareto_axis
    direction: higher
    responsibility: Business-aligned recall at 1% false-positive budget.
    special: Not comparable across datasets with different prevalence.
  ensemble_recommendation:
