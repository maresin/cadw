      header: 'knn_multilabel.py -- MLkNNModel.state_nbytes() +256'
      batch_term: 'knn_multilabel.py -- mg.check_batch(extra_factor=2.5) in _checked_batches'
    min_ram_evidence:
      derived_from: 'ram_formula with max_samples=k+1 (min for self+k), batch=1 (auto-migrate v0.9.177)'
    measurement:
      verification_mode: 'component-wise (DEC-033)'
      state_check: 'test_state_nbytes_exact: bit-exact across (n_train,d,L,k)'
      state_bounded: 'test_state_independent_of_n: identical at n>=max_samples'
      ooc: 'test_ooc_batch_fixed: median-of-3, ratio < 4.0'
      correctness: 'test_reference_parity (vectorized==slow per-sample loop) + test_hamming_loss (<0.30 on synthetic 3-label)'
      cells_passed: '5/5 (CW-1, CW-2, CW-5, ref-parity, hamming)'
      runtime_sec: '~20'
      note: 'Bayesian prior + Laplace-smoothed conditional tables (paper eq.3-4). Exact kNN, no SGD. Train_y_ from reservoir is float64 (0.0/1.0). predict materializes n x L int64 output — guard.check_state(n_total*L*8) before np.empty (predict_batched: false).'
    roles:
    - probabilistic
    purpose: Multi-label kNN with Bayesian prior (Zhang & Zhou 2007). Label posterior from neighbour counts.
    real_life_examples:
    - Multi-label text tagging
    - Gene function prediction
    config:
      n_neighbors: int
      smoothing: float
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/benches/
      algorithm: ML-kNN
      algorithm_source_url: https://scikit.ml/api/skmultilearn.adapt.mlknn.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multilabel classification
      n_datasets: null
      metric: hamming_loss
      value: null
      note: 'no_public_benchmark: ML-kNN per-dataset; no unified multilabel LB'
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state max_samples*(d+L)*f64 + L*(k+1)*f64*2 + L*f64 + 256; fit peak O(max_samples) constant (Phase 1) + O(batch*row_size) transient (reservoir); predict O(batch) per chunk but n-sized output. Module: cadw.ml.knn_multilabel.'
  metrics:
  - name: subset_accuracy
    combination: anchor
    direction: higher
    responsibility: Exact-match accuracy per row.
    special: Strict — one wrong label fails the row; use hamming_loss when labels are numerous.
  - name: hamming_loss
    combination: pareto_axis
    direction: lower
    responsibility: Fraction of incorrect labels per row.
    special: Handles many labels gracefully; not comparable to subset_accuracy.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - OneVsRest_Logistic
    - ClassifierChains
    max_per_role: 1
    note: OvR as baseline, chains as SOTA; use chains when label correlation is strong.
- id: A5
  name: Ordinal classification
  description: Predict ranked classes (e.g. ratings 1-5).
  real_life:
