# A — Classification & Regression
# 7 subtypes: A1 binary, A2 multiclass, A3 regression, A4 multilabel,
# A5 ordinal, A6 imbalanced, A7 quantile.
#
# v0.9.44a-fix1: pr_auc anchor -> pareto_axis (single anchor: roc_auc);
# A7 ensemble cleared (models are described_only, not recommendable).
# Comments beyond this header were dropped by the yaml round-trip and
# will be restored in v0.9.44b.

section: A
name: Classification & Regression
subtypes:
- id: A1
  name: Binary classification
  description: Predict P(y=1|x) with y in {0,1}.
  real_life:
  - Credit scoring (default yes/no)
  - Churn prediction
  - Fraud detection (rare positive)
  - CTR prediction
  benchmarks:
  - name: AMLB
    url: https://openml.github.io/automlbenchmark/
    metrics:
    - roc_auc
    - accuracy
    - logloss
  models:
  - name: LogisticRegression
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: Additive log-odds; fast on high-d, low-n; interpretable coefficients.
    real_life_examples:
    - Credit scoring
    - Medical risk scores
    config:
      alpha: float
      max_iter: int
      l1_ratio: float
    cadw_module: cadw.ml.logistic
    cadw_function: fit_logistic
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.linear_model.LogisticRegression
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: binary classification
      n_datasets: null
      metric: roc_auc
      value: 0.78
      std: null
      note: median across AMLB binary tasks; ranking only [legacy v0.9.44, migrated v0.9.50]
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    ram_formula: "2 * batch * row_size + 4 * d * d * f64"
    formula_evidence:
      batch_term: "logistic.py:update -- X + X_aug + T1(X_aug*w); a=3.05 (iter-3 C)"
      state_term: "logistic.py:update -- hess + hess_new + temp; b=3.97 (iter-3 C)"
      guard: "logistic.py:LogisticGradOp.batch_memory_factor = 4.0"
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise XTX / XTy Reduce; Newton/L-BFGS on d×d.'
      predict: 'per-batch sigmoid.'
    primitive_reuse: [reduce]
  - name: GBDT
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: Gradient-boosted trees; SOTA on most tabular Kaggle tasks.
    real_life_examples:
    - Kaggle credit scoring
    - Ad click prediction
    config:
      n_estimators: int
      max_depth: int
      learning_rate: float
    cadw_module: cadw.ml.gbdt
    cadw_function: fit_gbdt_classifier
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.ensemble.GradientBoostingClassifier
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: binary classification
      n_datasets: null
      metric: roc_auc
      value: 0.82
      std: null
      note: median across AMLB binary tasks [legacy v0.9.44, migrated v0.9.50]
    state_class: O(batch)
    bounded_state_dims: {batch: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'binning + codes ReduceOps via SpillDir (P1a-1c path).'
      predict: 'per-batch tree recursion.'
    primitive_reuse:
    - reduce
    - spill_dir
    - codes_bin
  - name: BernoulliNB
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - probabilistic
    purpose: Naive Bayes for binary features; fast baseline.
    real_life_examples:
    - Spam filter
    - Text classification
    config:
      alpha: float
    cadw_module: cadw.ml.naive_bayes
    cadw_function: fit_bernoulli_nb
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.naive_bayes.BernoulliNB
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.BernoulliNB.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: binary classification
      n_datasets: null
      metric: roc_auc
      value: 0.72
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(d)
    bounded_state_dims: {d: 1, C: 1}
    ram_formula: "2 * batch * row_size + 2 * C * d * f64"
    formula_evidence:
      batch_term: "naive_bayes.py:update -- O3 fix keeps Xb bool; a=2.0 (iter-5)"
      state_term: "state 8+8d per class; finalize 2*C*d*f64 (n_c, count_ones)"
      guard: "naive_bayes.py:_BernoulliStatsOp.batch_memory_factor = 3.0 (post-O3)"
    transient_factor: 1.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise feature count + log-prior Reduce.'
      predict: 'per-row log-score sum.'
    primitive_reuse: [reduce]
  - name: NaiveBayes_multinomial
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: Multinomial NB for count features (text, events); standard NLP baseline.
    real_life_examples:
    - Text classification
    - Spam detection
    config:
      alpha: float
    cadw_module: cadw.ml.naive_bayes
    cadw_function: fit_multinomial_nb
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.naive_bayes.MultinomialNB
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.MultinomialNB.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multiclass classification
      n_datasets: null
      metric: accuracy
      value: 0.72
      std: null
      note: '[v0.9.105 DEC-012: card created to unblock fit_multinomial_nb]'
    state_class: O(d)
    bounded_state_dims: {d: 1, C: 1}
    ram_formula: "2 * batch * row_size + 2 * C * d * f64"
    formula_evidence:
      batch_term: "naive_bayes.py:_MultinomialStatsOp.update -- X + X[valid]; a=2.0 (iter-3 A2)"
      state_term: "state 8+8d per class; finalize 2*C*d*f64 (n_c, feature_sum)"
      guard: "naive_bayes.py:_MultinomialStatsOp.batch_memory_factor = 3.0"
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise per-class token count + log-prior Reduce.'
      predict: 'per-row multinomial log-score sum.'
    primitive_reuse: [reduce]
  - name: TabPFN
    tier: sota
    tier_level: tier3_export
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - nonlinear_interactions
    purpose: Prior-fitted transformer for small tabular datasets; SOTA on AMLB small-N.
    real_life_examples:
    - Medical tabular prediction (n<2000)
    config:
      n_estimators: int
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: TabPFN
      algorithm_source_url: https://arxiv.org/abs/2207.01848
      algorithm_source_kind: paper
      attribution: literature
      task_type: binary classification
      n_datasets: null
      metric: roc_auc
      value: 0.85
      std: null
      note: Top of AMLB small-N subset; export via to_batches(format='torch') [legacy v0.9.44, migrated v0.9.50]
  metrics:
  - name: roc_auc
    combination: anchor
    direction: higher
    responsibility: Threshold-invariant discrimination.
    special: Insensitive to class imbalance; prefer pr_auc when positive_rate<0.05.
  - name: pr_auc
    combination: pareto_axis
    direction: higher
    responsibility: Discrimination under class imbalance.
    special: Only use as anchor when positive_rate<0.05; not comparable to roc_auc numerically.
  - name: brier
    combination: pareto_axis
    direction: lower
    responsibility: Calibration + discrimination mixed; safest for probability use.
    special: Decompose to (reliability, resolution, uncertainty) to see where loss comes from.
  - name: logloss
    combination: diagnostic
    direction: lower
    responsibility: Strict calibration-aware loss.
    special: Very sensitive to confident wrong predictions; do not sum with brier.
  - name: accuracy
    combination: diagnostic
    direction: higher
    responsibility: Business-default decision quality.
    special: Uses a fixed threshold 0.5; only meaningful when costs are symmetric.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - LogisticRegression
    - GBDT
    max_per_role: 2
    note: Complementary inductive biases; average predicted probabilities.
  - roles:
    - linear_signal
    - probabilistic
    models:
    - LogisticRegression
    - BernoulliNB
    max_per_role: 2
    note: Only when features are binary; Naive Bayes adds fast likelihood.
- id: A2
  name: Multiclass classification
  description: Predict P(y=k|x) for K>=3 classes.
  real_life:
  - Handwritten digit recognition
  - Product category tagging
  benchmarks:
  - name: AMLB
    url: https://openml.github.io/automlbenchmark/
    metrics:
    - accuracy
    - logloss
  models:
  - name: LogisticRegression_multinomial
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: Multinomial log-odds; strong when classes are roughly linearly separable.
    real_life_examples:
    - Iris-style small-d tasks
    config:
      alpha: float
      max_iter: int
    cadw_module: cadw.ml.logistic
    cadw_function: fit_logistic
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.linear_model.LogisticRegression
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multiclass classification
      n_datasets: null
      metric: accuracy
      value: 0.74
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    ram_formula: "2 * batch * row_size + 4 * d * d * f64"
    formula_evidence:
      batch_term: "same (multiclass, d=C*(len+1)); a=3.05"
      state_term: "b=3.97 (state per class multiplied by C)"
      guard: "logistic.py:LogisticGradOp.batch_memory_factor = 4.0"
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise XTX / XTy Reduce; softmax Newton/L-BFGS; C-class state C*d² is param (C fixed).'
      predict: 'per-batch softmax.'
    primitive_reuse: [reduce]
  - name: GBDT_multiclass
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: One-vs-all softmax GBDT; SOTA on tabular multiclass.
    real_life_examples:
    - Product categorization
    config:
      n_estimators: int
      max_depth: int
    cadw_module: cadw.ml.gbdt
    cadw_function: fit_gbdt_multiclass
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.ensemble.GradientBoostingClassifier
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multiclass classification
      n_datasets: null
      metric: accuracy
      value: 0.81
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(batch)
    bounded_state_dims: {batch: 1}
    transient_factor: 1.0
    state_type: iterative
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'P1a series: codes/grad/hess/pred/y_all all SpillDir-backed; true OOC.'
      predict: 'per-batch tree recursion.'
    primitive_reuse:
    - reduce
    - spill_dir
    - memmap
    - codes_bin
  - name: CADWBoost
    tier: sota
    tier_level: tier1_core
    implementation_status:
      described_only: true
      not_implemented_in_cadw: true
    roles:
    - nonlinear_interactions
    purpose: 'Sandbox full gradient booster (.pingis/drafts/cadwboost/).
      CatBoost symmetric + LightGBM leaf-wise + XGBoost hist binning + EFB +
      9 losses + DART + GOSS + NGBoost + SHAP. 6/6 datasets better than
      cadw.ml.gbdt (-12%..-80% rmse), OOC ratio 1.08. Promote target v0.9.124.'
    real_life_examples:
    - Best-tabular regression where cadw.ml.gbdt underfits
    - Multiclass with class imbalance (focal loss)
    - Probabilistic forecast (NGBoost intervals)
    config:
      n_estimators: int
      tree_mode: 'symmetric | leaf_wise'
      loss: 'mse | mae | huber | quantile | logistic | focal | poisson | gamma | tweedie'
    cadw_module: .pingis/drafts/cadwboost
    benchmark_results:
    - benchmark: cadw_internal
      benchmark_url: .pingis/drafts/cadwboost/README.md
      algorithm: cadw.sandbox.cadwboost.CADWBoost
      algorithm_source_url: .pingis/drafts/cadwboost/README.md
      algorithm_source_kind: code
      attribution: cadw_measured
      task_type: regression
      n_datasets: 6
      metric: rmse
      value: 0.099
      std: null
      note: 'CADW-native sandbox: 6/6 better than cadw.ml.gbdt; OOC ratio 1.08. Not promoted (P2: ordered boosting, exact SHAP, 464-test suite).'
    state_class: O(model)
    bounded_state: true
    bounded_state_dims: {n_estimators: 1, max_depth: 1}
    state_type: iterative
    n_scalability: constant
    streaming_strategy:
      fit: 'SpillDir memmap codes+y+pred; reservoir binning; MAX_OOC_BATCH=20k.'
      predict: 'per-batch tree traversal; SpillBuffer for output.'
    primitive_reuse: [reduce, spill_dir, memmap]
  - name: GaussianNB
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - probabilistic
    purpose: Gaussian class-conditionals; extremely fast.
    real_life_examples:
    - Baseline in medical tabular data
    config:
      var_smoothing: float
    cadw_module: cadw.ml.naive_bayes
    cadw_function: fit_gaussian_nb
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.naive_bayes.GaussianNB
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.GaussianNB.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multiclass classification
      n_datasets: null
      metric: accuracy
      value: 0.68
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(d)
    bounded_state_dims: {d: 1, C: 1}
    ram_formula: "2 * batch * row_size + 3 * C * d * f64"
    formula_evidence:
      batch_term: "naive_bayes.py:update -- _stack_numeric + X[valid]; a=2.0 (iter-3 A2)"
      state_term: "state dict: 8+16d per class (loop); finalize allocates n_c/mean/var (3*C*d*f64) -- iter-4"
      guard: "naive_bayes.py:_GaussianStatsOp.batch_memory_factor = 3.0"
    transient_factor: 1.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise per-class mean/var Reduce (Welford).'
      predict: 'per-row Gaussian log-score sum.'
    primitive_reuse: [reduce]
  metrics:
  - name: accuracy
    combination: anchor
    direction: higher
    responsibility: Overall correct decisions when classes are balanced.
    special: Use balanced_accuracy or macro-F1 when classes are imbalanced.
  - name: logloss
    combination: diagnostic
    direction: lower
    responsibility: Calibration-aware multiclass loss.
    special: Punishes confident wrong calls; not comparable to accuracy.
  - name: macro_f1
    combination: pareto_axis
    direction: higher
    responsibility: Per-class balance, robust to class imbalance.
    special: Degrades when one class is very rare and the model ignores it.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - LogisticRegression_multinomial
    - GBDT_multiclass
    max_per_role: 2
    note: Linear + trees; average softmax probabilities.
- id: A3
  name: Regression
  description: Predict y in R.
  real_life:
  - Price prediction
  - Demand forecast
  - ETA estimation
  benchmarks:
  - name: AMLB
    url: https://openml.github.io/automlbenchmark/
    metrics:
    - rmse
  models:
  - name: Ridge
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: L2-regularised linear regression; closed-form solution, O(d^2) state.
    real_life_examples:
    - Housing price baseline
    config:
      alpha: float
    cadw_module: cadw.ml.linear
    cadw_function: fit_linear
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.linear_model.Ridge
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Ridge.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: regression
      n_datasets: null
      metric: rmse
      value: 0.42
      std: null
      note: normalised RMSE median across AMLB regression tasks [legacy v0.9.44, migrated v0.9.50]
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    ram_formula: "2 * batch * row_size + 2 * d * d * f64"
    formula_evidence:
      batch_term: "linear.py:245-246 -- X from _stack_numeric; X[mask] copy; a=1.92 (iter-1)"
      state_term: "linear.py:88 -- xtx + X.T@X creates 2*d^2 (old + new); b=1.0"
      guard: "linear.py:XTXOp.batch_memory_factor = 3.0 (2*batch + allocator)"
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'batch-wise XTX / XTy Reduce; closed-form solve.'
      predict: 'per-batch X @ coef.'
    primitive_reuse: [reduce]
  - name: Lasso
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: L1-regularised linear regression; produces sparse coefficients.
    real_life_examples:
    - Gene expression regression
    config:
      alpha: float
      max_iter: int
    cadw_module: cadw.ml.linear
    cadw_function: fit_lasso
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.linear_model.Lasso
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.Lasso.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: regression
      n_datasets: null
      metric: rmse
      value: 0.43
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    ram_formula: "2 * batch * row_size + 2 * d * d * f64"
    formula_evidence:
      batch_term: "same as fit_linear (routes to XTXOp); a=1.92"
      state_term: "same XTXOp; iter-2 D confirms l1==closed"
      guard: "linear.py:XTXOp.batch_memory_factor = 3.0"
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'XTX / XTy Reduce; coordinate descent on d² state.'
      predict: 'per-batch X @ coef.'
    primitive_reuse: [reduce]
  - name: ElasticNet
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: L1+L2 regularised linear regression; l1_ratio=1.0 -> Lasso, 0.0 -> Ridge.
    real_life_examples:
    - High-dimensional regression with correlated features
    - Gene expression with grouped predictors
    config:
      alpha: float
      l1_ratio: float
      max_iter: int
    cadw_module: cadw.ml.linear
    cadw_function: fit_elasticnet
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.linear_model.ElasticNet
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.ElasticNet.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: regression
      n_datasets: null
      metric: rmse
      value: 0.43
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50; delegation to fit_linear]'
    state_class: O(d²)
    bounded_state_dims: {d: 2}
    ram_formula: "2 * batch * row_size + 2 * d * d * f64"
    formula_evidence:
      delegation: "linear.py:658 -- fit_elasticnet returns fit_linear(..., penalty='elasticnet'); same XTXOp path"
      batch_term: "same as fit_linear (XTXOp); a=1.92"
      state_term: "same XTXOp; iter-2 D confirms l1==closed"
      guard: "linear.py:XTXOp.batch_memory_factor = 3.0"
    measurement:
      verification_mode: "delegated to fit_linear (v0.9.107 verified)"
      reference: "test_elasticnet_l1_ratio_0_equals_ridge + test_elasticnet_l1_ratio_1_equals_lasso (test_linear_lasso.py)"
      cells_passed: "delegated (formula identical to fit_linear)"
      date: "2026-11-05"
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: 'XTX / XTy Reduce; coordinate descent on d² state (shared with fit_lasso).'
      predict: 'per-batch X @ coef.'
    primitive_reuse: [reduce]
  - name: GBDT_L2
    tier: sota
    tier_level: tier1_core
    evaluation_scope: both
    implementation_status:
      verified_in_cadw: true
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: Gradient-boosted trees with squared loss; general-purpose SOTA.
    real_life_examples:
    - Kaggle tabular regression winner baseline
    config:
      n_estimators: int
      max_depth: int
      learning_rate: float
    cadw_module: cadw.ml.gbdt
