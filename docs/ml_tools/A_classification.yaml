# A — Classification & Regression
# 7 subtypes: A1 binary, A2 multiclass, A3 regression, A4 multilabel,
# A5 ordinal, A6 imbalanced, A7 quantile.
#
# v0.9.44a-fix1: pr_auc anchor -> pareto_axis (single anchor: roc_auc);
# A7 ensemble cleared (models are described_only, not recommendable).
# Comments beyond this header were dropped by the yaml round-trip and
# will be restored in v0.9.44b.

section: A
name: Classification & Regression
subtypes:
- id: A1
  name: Binary classification
  description: Predict P(y=1|x) with y in {0,1}.
  real_life:
  - Credit scoring (default yes/no)
  - Churn prediction
  - Fraud detection (rare positive)
  - CTR prediction
  benchmarks:
  - name: AMLB
    url: https://openml.github.io/automlbenchmark/
    metrics:
    - roc_auc
    - accuracy
    - logloss
  models:
  - name: LogisticRegression
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: Additive log-odds; fast on high-d, low-n; interpretable coefficients.
    real_life_examples:
    - Credit scoring
    - Medical risk scores
    config:
      alpha: float
      max_iter: int
      l1_ratio: float
    cadw_module: cadw.ml.logistic
    cadw_function: fit_logistic
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on:
    - cadw.ops.optim.sgd_streaming
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.linear_model.LogisticRegression
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LogisticRegression.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: binary classification
      n_datasets: null
      metric: roc_auc
      value: 0.78
      std: null
      note: median across AMLB binary tasks; ranking only [legacy v0.9.44, migrated v0.9.50]
    state_class: O(d²)
    bounded_state_dims:
      d: 2
    ram_formula: 2 * batch * row_size + 4 * d * d * f64
    formula_evidence:
      batch_term: logistic.py:update -- X + X_aug + T1(X_aug*w); a=3.05 (iter-3 C)
      state_term: logistic.py:update -- hess + hess_new + temp; b=3.97 (iter-3 C)
      guard: logistic.py:LogisticGradOp.batch_memory_factor = 4.0
    min_ram_formula: 2 * 1 * row_size + 4 * d * d * f64 + 512
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    transient_factor: 2.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: batch-wise XTX / XTy Reduce; Newton/L-BFGS on d×d.
      predict: per-batch sigmoid.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state d:2; independent of n. Module: cadw.ml.logistic.'
  - name: GBDT
    cadw_module: cadw.ml.gbdt
    cadw_function: fit_gbdt_classifier
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    ram_formula: n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256
    formula_evidence:
      trees: gbdt.py:_build_tree -- tree = dict[int, tuple(feat,thr,left,right,gain)|None] + leaf_values dict; ~250 B/node measured
      minmax: gbdt.py:_MinMaxOp -- mn_, mx_ = 2 * d * f64
      header: gbdt.py:_STATE_HEADER_BYTES=256
      state_nbytes: gbdt.py:GBDTClassifier.state_nbytes -- _deep_nbytes per tree
    min_ram_formula: n_estimators * (2**(max_depth+1) - 1) * 500 + 2 * d * f64 + 256
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    measurement:
      fit_transient_note: 'S1 audit: fit transient = pred/grad/hess (n × 90 B); persistent trees bounded. Refactor planned v0.9.168+ (SpillDir memmap for grad/hess/pred → truly O(batch)).'
      verification_mode: component-wise (DEC-033)
      state_check: 'test_*_state_within_upper_bound: actual ∈ [0.20, 1.0] of upper_bound'
      state_ooc: 'test_*_state_independent_of_n: same params, n=1k vs n=10k -> ratio <= 3.0'
      guard_refuse: 'test_*_guard_refuses: n=200 + 0.001 MB -> MemoryLimitExceeded'
      correctness: test_*_classification/regression/multiclass existing suites green
      cells_passed: 3/3
      runtime_sec: ~3
    bounded_state: true
    bounded_state_dims:
      n_estimators: 1
      max_depth: 1
      d: 1
    bounded_by_domain:
      axis: n
      bound: 100000
      reason: 'S1 audit: fit transient pred/grad/hess (n × 90 B) in RAM; codes in SpillDir memmap. Persistent state = trees (bounded, state_nbytes exact). Refactor planned v0.9.168+.'
    state_class: O(model)
    state_type: iterative
    n_scalability: constant
    tier1_core_exception: 'Tree-ensemble state is bounded by {n_estimators: 1, max_depth: 1, d: 1}; iter per tree: hist reduce state ~ S*F*B*f64; peak ~ batch*histsize. n-independent (trees do not grow with n).'
    streaming_strategy:
      fit: 'per-tree Reduce over histograms (S nodes × F features × B bins); iter per tree: hist reduce state ~ S*F*B*f64; peak ~ batch*histsize.'
      predict: per-batch _iter_filtered_batches -> stacked X -> tree descend; O(batch × trees).
    primitive_reuse:
    - reduce
    tier: sota
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - nonlinear_interactions
    purpose: Gradient-boosted trees; SOTA on most tabular Kaggle tasks.
    real_life_examples:
    - Kaggle credit scoring
    - Ad click prediction
    config:
      n_estimators: int
      max_depth: int
      learning_rate: float
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.ensemble.GradientBoostingClassifier
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: binary classification
      n_datasets: null
      metric: roc_auc
      value: 0.82
      std: null
      note: median across AMLB binary tasks [legacy v0.9.44, migrated v0.9.50]
    transient_factor: 1.0
    ooc_status: debt
    ooc_strategy: 'Plan: Round-by-round SpillArray: grad/hess/pred to SpillDir memmap (precedent LambdaMART v0.9.87-P2b-full-... Target: v0.9.180+. Current bound: S1 audit: fit transient pred/grad/hess (n × 90 B) in RAM; codes in SpillDir memm. Guard refuses above state_limit.'
    ooc_alternative: |
      Permanent intrinsic for current gbdt: partial memmap (v0.9.172, DEC-065) leaks dirty pages to RSS at ~20-24 B/row; true OOC requires posix_fadvise/direct I/O refactor (deferred DEC-065 v0.9.173+). Multiclass additionally has cur_leaf_c = np.zeros(n_total) (gbdt.py:127) unmemmapped.
      
      Replacement path: CadwBoost (.pingis/drafts/cadwboost/) is TRUE OOC (ratio 0.41x at n=50k-200k, verified v0.9.221 P46/P47). Promote target v0.9.222-224 (tests + wire + CW).
      
      bounded_by_domain n<=1e5 honest: ~2 MB at 1e5 with 24 B/row.
  - name: BernoulliNB
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - probabilistic
    purpose: Naive Bayes for binary features; fast baseline.
    real_life_examples:
    - Spam filter
    - Text classification
    config:
      alpha: float
    cadw_module: cadw.ml.naive_bayes
    cadw_function: fit_bernoulli_nb
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.naive_bayes.BernoulliNB
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.BernoulliNB.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: binary classification
      n_datasets: null
      metric: roc_auc
      value: 0.72
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(d)
    bounded_state_dims:
      d: 1
      C: 1
    ram_formula: 2 * batch * row_size + 2 * C * d * f64
    formula_evidence:
      batch_term: naive_bayes.py:update -- O3 fix keeps Xb bool; a=2.0 (iter-5)
      state_term: state 8+8d per class; finalize 2*C*d*f64 (n_c, count_ones)
      guard: naive_bayes.py:_BernoulliStatsOp.batch_memory_factor = 3.0 (post-O3)
    min_ram_formula: 2 * 1 * row_size + 2 * C * d * f64 + 512
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    transient_factor: 1.0
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: batch-wise feature count + log-prior Reduce.
      predict: per-row log-score sum.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state d:1, C:1; independent of n. Module: cadw.ml.naive_bayes.'
  - name: NaiveBayes_multinomial
    tier: baseline
    tier_level: tier1_core
    implementation_status:
      verified_in_cadw: true
      status: verified
    roles:
    - linear_signal
    purpose: Multinomial NB for count features (text, events); standard NLP baseline.
    real_life_examples:
    - Text classification
    - Spam detection
    config:
      alpha: float
    cadw_module: cadw.ml.naive_bayes
    cadw_function: fit_multinomial_nb
    input_api: df
    fit_batched: true
    predict_batched: true
    depends_on: []
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.naive_bayes.MultinomialNB
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.naive_bayes.MultinomialNB.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multiclass classification
      n_datasets: null
      metric: accuracy
      value: 0.72
      std: null
      note: '[v0.9.105 DEC-012: card created to unblock fit_multinomial_nb]'
    state_class: O(d)
    bounded_state_dims:
      d: 1
      C: 1
    ram_formula: 2 * batch * row_size + 2 * C * d * f64
    formula_evidence:
      batch_term: naive_bayes.py:_MultinomialStatsOp.update -- X + X[valid]; a=2.0 (iter-3 A2)
      state_term: state 8+8d per class; finalize 2*C*d*f64 (n_c, feature_sum)
      guard: naive_bayes.py:_MultinomialStatsOp.batch_memory_factor = 3.0
    min_ram_formula: 2 * 1 * row_size + 2 * C * d * f64 + 512
    min_ram_evidence:
      derived_from: ram_formula (batch=1, auto-migrate v0.9.177)
    state_type: aggregation
    bounded_state: true
    n_scalability: constant
    streaming_strategy:
      fit: batch-wise per-class token count + log-prior Reduce.
      predict: per-row multinomial log-score sum.
    primitive_reuse:
    - reduce
    ooc_status: achieved
    ooc_strategy: 'Pattern #1 batch-layer. state d:1, C:1; independent of n. Module: cadw.ml.naive_bayes.'
  metrics:
  - name: roc_auc
    combination: anchor
    direction: higher
    responsibility: Threshold-invariant discrimination.
    special: Insensitive to class imbalance; prefer pr_auc when positive_rate<0.05.
  - name: pr_auc
    combination: pareto_axis
    direction: higher
    responsibility: Discrimination under class imbalance.
    special: Only use as anchor when positive_rate<0.05; not comparable to roc_auc numerically.
  - name: brier
    combination: pareto_axis
    direction: lower
    responsibility: Calibration + discrimination mixed; safest for probability use.
    special: Decompose to (reliability, resolution, uncertainty) to see where loss comes from.
  - name: logloss
    combination: diagnostic
    direction: lower
    responsibility: Strict calibration-aware loss.
    special: Very sensitive to confident wrong predictions; do not sum with brier.
  - name: accuracy
    combination: diagnostic
    direction: higher
    responsibility: Business-default decision quality.
    special: Uses a fixed threshold 0.5; only meaningful when costs are symmetric.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - LogisticRegression
    - GBDT
    max_per_role: 2
    note: Complementary inductive biases; average predicted probabilities.
  - roles:
    - linear_signal
    - probabilistic
    models:
    - LogisticRegression
    - BernoulliNB
    max_per_role: 2
    note: Only when features are binary; Naive Bayes adds fast likelihood.
