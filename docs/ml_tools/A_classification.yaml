- id: A4
  name: Multilabel classification
  description: Predict multiple binary labels per row.
  real_life:
  - Document tagging
  - Medical diagnosis (multiple conditions)
  benchmarks:
  - name: AMLB
    url: https://openml.github.io/automlbenchmark/
    metrics:
    - accuracy
  models:
  - name: OneVsRest_Logistic
    tier: baseline
    tier_level: tier1_core
    ram_formula: "n_estimators * d * d * f64 + 512"
    formula_evidence:
      per_estimator: "chains.py -- ChainsModel.state_nbytes = sum(GBDTModel.state_nbytes()) + 512; each GBDT: ~d^2 nodes * f64"
      header: "chains.py -- label_cols list + feature_cols list + params dict = 512"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: bit-exact sum + 512 (n_est, d, L parametrized)"
      state_independent_of_n: "test_state_independent_of_n: bounded ratio <=1.5 (GBDT data-dependent nodes)"
      formula_sanity: "test_formula_small_scale: 2*n*d*8 vstack + n_est*1.5MB GBDT / measured [0.5, 2.0]"
      peak_linear: "test_peak_grows_linearly_with_n: ratio < 15 at 10x n"
      bounded_domain: "test_guard_refuses_at_domain_bound: n=1e6 + 10MB -> MemoryLimitExceeded"
      tight_guard: "test_tight_guard_raises: MemoryLimitExceeded via _FakeMB"
      cells_passed: "5/5"

    implementation_status:
      verified_in_cadw: true
      status: verified
      verified_by_agent: true
    roles:
    - linear_signal
    purpose: Independent per-label logits; ignores label correlations.
    real_life_examples:
    - Tag suggestion
    config:
      alpha: float
    cadw_module: cadw.ml.chains
    cadw_function: fit_chains
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.multiclass.OneVsRestClassifier
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.multiclass.OneVsRestClassifier.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multilabel classification
      n_datasets: null
      metric: accuracy
      value: 0.62
      std: null
      note: subset accuracy [legacy v0.9.44, migrated v0.9.50]
    state_class: O(model)
    bounded_state_dims: {n_estimators: 1, d: 2}
    state_type: aggregation
    bounded_state: false
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: '_collect np.vstack(Xs) O(n*d); state O(n_est*d^2). n<=1e6 typical for tabular multi-label.'

    n_scalability: linear
    streaming_strategy:
      fit: 'per-class binary logistic; L binary fits, each O(d²) Reduce.'
      predict: 'per-batch stack of L sigmoids.'
    primitive_reuse: [reduce]
  - name: ClassifierChains
    tier: sota
    tier_level: tier1_core
    ram_formula: "n_estimators * d * d * f64 + 512"
    formula_evidence:
      per_estimator: "chains.py -- ChainsModel.state_nbytes = sum(GBDTModel.state_nbytes()) + 512; each GBDT: ~d^2 nodes * f64"
      header: "chains.py -- label_cols list + feature_cols list + params dict = 512"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: bit-exact sum + 512 (n_est, d, L parametrized)"
      state_independent_of_n: "test_state_independent_of_n: bounded ratio <=1.5 (GBDT data-dependent nodes)"
      formula_sanity: "test_formula_small_scale: 2*n*d*8 vstack + n_est*1.5MB GBDT / measured [0.5, 2.0]"
      peak_linear: "test_peak_grows_linearly_with_n: ratio < 15 at 10x n"
      bounded_domain: "test_guard_refuses_at_domain_bound: n=1e6 + 10MB -> MemoryLimitExceeded"
      tight_guard: "test_tight_guard_raises: MemoryLimitExceeded via _FakeMB"
      cells_passed: "5/5"

    implementation_status:
      verified_in_cadw: true
      status: verified
      verified_by_agent: true
    roles:
    - nonlinear_interactions
    purpose: Sequential per-label classifiers; each sees earlier labels.
    real_life_examples:
    - Medical coding (ICD)
    config:
      n_estimators: int
      order: list
    cadw_module: cadw.ml.chains
    cadw_function: fit_chains
    input_api: df
    benchmark_results:
    - benchmark: AMLB
      benchmark_url: https://openml.github.io/automlbenchmark/
      algorithm: sklearn.multioutput.ClassifierChain
      algorithm_source_url: https://scikit-learn.org/stable/modules/generated/sklearn.multioutput.ClassifierChain.html
      algorithm_source_kind: docs
      attribution: literature
      task_type: multilabel classification
      n_datasets: null
      metric: accuracy
      value: 0.66
      std: null
      note: '[legacy v0.9.44, migrated v0.9.50]'
    state_class: O(model)
    bounded_state_dims: {n_estimators: 1, d: 2}
    state_type: aggregation
    bounded_state: false
    bounded_by_domain:
      axis: n
      bound: 1000000
      reason: '_collect np.vstack(Xs) O(n*d); state O(n_est*d^2). n<=1e6 typical for tabular multi-label.'

    n_scalability: linear
    streaming_strategy:
      fit: 'L chained logistic fits on (X + prior labels); O(d²) per classifier.'
      predict: 'per-batch chained prediction.'
    primitive_reuse: [reduce]
  metrics:
  - name: subset_accuracy
    combination: anchor
    direction: higher
    responsibility: Exact-match accuracy per row.
    special: Strict — one wrong label fails the row; use hamming_loss when labels are numerous.
  - name: hamming_loss
    combination: pareto_axis
    direction: lower
    responsibility: Fraction of incorrect labels per row.
    special: Handles many labels gracefully; not comparable to subset_accuracy.
  ensemble_recommendation:
  - roles:
    - linear_signal
    - nonlinear_interactions
    models:
    - OneVsRest_Logistic
    - ClassifierChains
    max_per_role: 1
    note: OvR as baseline, chains as SOTA; use chains when label correlation is strong.
- id: A5
  name: Ordinal classification
  description: Predict ranked classes (e.g. ratings 1-5).
  real_life:
  - Star ratings
  - Pain severity 1-10
  - Satisfaction surveys
  benchmarks:
  - name: AMLB
    url: https://openml.github.io/automlbenchmark/
    metrics:
    - accuracy
  models:
  - name: OrdinalLogit
    tier: baseline
    tier_level: tier1_core
    ram_formula: "d * f64 + K * f64 + 256"
    formula_evidence:
      beta: "ordinal.py -- OrdinalLogitModel.beta_ = (d,) f64 = d*f64"
      theta: "ordinal.py -- OrdinalLogitModel.theta_ = (K-1,) f64 = (K-1)*f64"
      header: "ordinal.py -- classes_ ndarray + feature_cols list + params dict = 256"
    measurement:
      verification_mode: "component-wise (DEC-033)"
      state_check: "test_state_nbytes_exact: bit-exact, (d,K) parametrized (5/3, 10/4, 20/5)"
      state_independent_of_n: "test_state_independent_of_n: state(n=2k)==state(n=10k)"
      formula_sanity: "test_formula_small_scale: predicted+5MB baseline / measured in [0.5,2.0]"
      peak_linear: "test_peak_grows_linearly_with_n: ratio < 15 at 10x n (n=3k vs 30k)"
      bounded_domain: "test_guard_refuses_at_domain_bound: n=1e6 + 10MB guard -> MemoryLimitExceeded"
      tight_guard: "test_tight_guard_raises: MemoryLimitExceeded via _FakeMB"
