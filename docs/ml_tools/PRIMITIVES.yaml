- name: _ses_fit_simple
  cadw_function: cadw.ts.theta._ses_fit
  module: cadw.ts.theta
  layer: leaf
  status: draft
  bounded_state: false
  ram_formula: "n * f64 + 256"
  min_ram_formula: "1 * f64 + 256"
  formula_evidence:
    fitted_alloc: "theta.py:71 -- fitted = np.empty(n, dtype=np.float64)"
    note: "returns (lvl, fitted, sse); fitted is n-sized"
  intrinsic_bound: {axis: n, bound: 1000000, reason: "np.empty(n) transient"}
  streaming_variant: _ses_fit_streaming
  consumers: [ThetaForecaster, _MultiplicativeWrapper]
  notes: >-
    Simple SES (no seasonal, no trend). Streaming variant possible for
    s=1 (bit-identical, O(1) RAM); blocked by _initial_seasonal requiring
    full y for seasonal models. Backlog v0.9.190+. AP22: not unified
    with ets._ses_fit (different signatures: simple vs Holt-Winters).

- name: _ses_fit_hw
  cadw_function: cadw.ts.ets._ses_fit
  module: cadw.ts.ets
  layer: leaf
  status: verified
  bounded_state: false
  ram_formula: "2 * W_eff * f64 + 2 * seasonal_period * f64 + 256"
  min_ram_formula: "2 * 2 * seasonal_period * f64 + 2 * f64 + 256"
  formula_evidence:
    caller_bounds: "Caller uses _collect_last_w -> y_used of len <= W_eff"
    fitted_alloc: "ets.py:57 -- fitted = np.empty(len(y_used)) O(W_eff)"
    initial_seasonal: "from y_used (W-bounded); k = len(y_used) // s"
  window_truncatable:
    axis: n
    caller_prim: _collect_last_w
    min_window: "2 * seasonal_period"
    reason: "Holt-Winters on last W_eff obs is valid semantic variant (pelt precedent, DEC-072 §3); bit-identical when n <= W_eff"
  streaming_variant: null
  consumers: [ETSForecaster (s>1 or trend=True), AutoETSForecaster]
  notes: >-
    Holt-Winters. v0.9.189 (DEC-072): window-truncatable via caller using
    _collect_last_w. Caller computes W_eff from guard (typical
    target_fraction=0.25), passes y_used = last min(n, W_eff) to this leaf.
    Effective RAM = O(W_eff + batch). Bit-identical when n <= W_eff.
    Window-rejected ONLY if caller explicitly disables truncation
    (n > W_eff with max_window=None + strict=True -> MemoryLimitExceeded).
    AP22: distinct from theta._ses_fit (HW vs simple SES).


- name: stl_decompose
  cadw_function: cadw.ts._decomposition.stl_decompose
  module: cadw.ts._decomposition
  layer: leaf
  status: verified
  bounded_state: false
  ram_formula: "4 * W_eff * f64 + 512"
  min_ram_formula: "4 * 2 * seasonal_period * f64 + 512"
  formula_evidence:
    caller_bounds: "Caller passes y_used of len <= W_eff via _collect_last_w"
    arrays: "trend/seasonal/remainder O(W_eff); LOESS per-iter O(W_eff)"
    loess: "per-iter O(W_eff) working set; n_iter=2 default"
  window_truncatable:
    axis: n
    caller_prim: _collect_last_w
    min_window: "2 * seasonal_period"
    reason: "STL on last W_eff obs is valid semantic variant; STL local stationarity standard (prophet, MSTL restricted; DEC-072 §3)"
  streaming_variant: null
  consumers: [ThetaForecaster (s>1), OTMThetaForecaster (s>1), ETSForecaster (s>1)]
  notes: >-
    STL (Cleveland et al. 1990). v0.9.189 (DEC-072): window-truncatable
    via caller using _collect_last_w. Caller bounds y_used to W_eff;
    STL on W_eff window. Bit-identical when n <= W_eff. Prophet/MSTL
    restricted precedent: STL is inherently local-stationarity, window
    truncation semantically valid.

