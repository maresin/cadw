# PRIMITIVES.yaml — PrimitiveCard seed (v0.9.176)
# Schema: PRIMITIVE_CARD_SPEC.md
# Loader: cadw.core.cards.load_primitive_cards
# Status: seed (5 cards). Full set (~30 batch-layer + ~10 leaf + ~5 intrinsic)
#         migration v0.9.177+ per PRIMITIVES_BACKLOG.
# Layer:
#   batch     — state O(model) given fixed batch; primitive IS OOC.
#   leaf      — state O(n) input/output; caller must batch/chunk.
#   intrinsic — O(n^2)/O(n*d) unavoidable; caller controls n <= bound.

version: "0.9.176"

primitives:

# ====================================================================
# Batch-layer (state n-independent)
# ====================================================================

- name: sigmoid
  cadw_function: cadw.ops.numeric.sigmoid
  module: cadw.ops.numeric
  layer: batch
  status: verified
  bounded_state: true
  ram_formula: "batch * f64 + 512"
  min_ram_formula: "1 * f64 + 512"
  formula_evidence:
    elementwise: "numeric.py:44 -- def sigmoid(x):"
    note: "elementwise; no state; RAM = output = input size"
  primitive_reuse: []
  consumers: [LogisticRegression, GBDT, calibration, ordinal, autoencoder]
  notes: "Numerically stable (pos/neg branch); no alloc beyond output."

- name: arm_stats
  cadw_function: cadw.ops.stats.arm_stats
  module: cadw.ops.stats
  layer: batch
  status: verified
  bounded_state: true
  ram_formula: "k_arms * 3 * f64 + 3 * batch * row_size + 512"
  min_ram_formula: "k_arms * 3 * f64 + 3 * row_size + 512"
  formula_evidence:
    op_class: "stats.py:75 -- class ArmStatsOp(ReduceOp):"
    fn: "stats.py:150 -- def arm_stats("
    state: "per-arm (count, sum, sum_sq); 3*k_arms floats"
    batch: "check_batch(extra_factor=3.0) on input"
  primitive_reuse: [reduce]
  consumers: [EpsilonGreedy, UCB1, ThompsonSampling, LinUCB]
  measurement:
    cells_passed: "8/8"
    verification_mode: "component-wise (DEC-033)"
  notes: "ReduceOp state O(k_arms); RAM independent of n."

- name: nmf_mu
  cadw_function: cadw.ops.linalg.nmf_mu
  module: cadw.ops.linalg
  layer: batch
  status: verified
  bounded_state: true
  ram_formula: "k * v * f64 + 2 * batch * k * f64 + 512"
  min_ram_formula: "k * v * f64 + 2 * k * f64 + 512"
  formula_evidence:
    fn: "linalg.py:61 -- def nmf_mu(X_b: np.ndarray, H: np.ndarray, *, eps: float = 1e-10) -> np.ndarray:"
    state: "H (k x v) persistent; W update per-batch"
    batch: "W block (batch x k) transient"
  primitive_reuse: []
  consumers: [NMF, NMF_dup]
  notes: "Per-batch H update; state H=k*v f64."

- name: reservoir_sample
  cadw_function: cadw.ops.sampling.reservoir_sample
  module: cadw.ops.sampling
  layer: batch
  status: verified
  bounded_state: true
  ram_formula: "k * d * f64 + 3 * batch * row_size + 512"
  min_ram_formula: "k * d * f64 + 3 * row_size + 512"
  formula_evidence:
    fn: "sampling.py:32 -- def reservoir_sample("
    state: "reservoir buffer (k rows x d cols); Algorithm R"
    batch: "check_batch(extra_factor=3.0)"
  primitive_reuse: []
  consumers: [KernelDensity, ReservoirSample, SMOTE, OneHotEncoder]
  notes: "Algorithm R; state = k_samples * d, independent of n."

# ====================================================================
# Leaf-layer (state O(n) input; caller controls n)
# ====================================================================

- name: ols_fit
  cadw_function: cadw.ops.linalg.ols_fit
  module: cadw.ops.linalg
  layer: leaf
  status: verified
  bounded_state: false
  ram_formula: "n * f64 + 2 * f64 + 512"
  min_ram_formula: "2 * f64 + 512"
  formula_evidence:
    fn: "linalg.py:30 -- def ols_fit(y: np.ndarray) -> Tuple[float, float]:"
    state: "returns (slope, intercept); input y fully materialized by caller"
  streaming_variant: _ols_fit_streaming
  primitive_reuse: []
  consumers: [OTMThetaForecaster, ThetaForecaster]
  notes: >-
    Leaf: caller passes full y (n). For OOC regression, use fit_linear
    (Reduce-based). This helper is for short-series (forecaster) fits
    where n is bounded by model context (typically <= 1e6).

- name: _iter_target_batches
  cadw_function: cadw.ts.models._iter_target_batches
  module: cadw.ts.models
  layer: batch
  status: verified
  bounded_state: true
  ram_formula: "3.5 * batch * row_size + 256"
  min_ram_formula: "3.5 * row_size + 256"
  formula_evidence:
    guard: "models.py:XXX -- mg.check_batch(b, extra_factor=3.5) per batch"
    per_batch_numpy: "b.column(target).to_numpy() O(batch)"
  primitive_reuse: []
  consumers: [NaiveForecaster]
  notes: >-
    v0.9.186 (DEC-070 P1): streaming target extraction. Yields per-batch
    float64 arrays. Caller OOC iff accumulator is O(1)/O(model) (Naive:
    tail buffer + drift_sum). For full-array consumers (stl_decompose,
    _ses_fit's fitted array), use _extract_series (leaf).
    Streaming variant of _extract_series.

# ====================================================================
# Leaf-layer v0.9.185 (from cadw/ts/ during Wave 2 refactor)
# Streaming variants not yet implemented (backlog v0.9.190+); all are
# honest leaf-layer with intrinsic_bound O(n). Models using them stay
# bounded_by_domain until streaming variants exist.
# ====================================================================

- name: _extract_series
  cadw_function: cadw.ts.models._extract_series
  module: cadw.ts.models
  layer: leaf
  status: draft
  bounded_state: false
  ram_formula: "n * f64 + 3.5 * batch * row_size + 256"
  min_ram_formula: "1 * f64 + 3.5 * row_size + 256"
  formula_evidence:
    prealloc: "models.py:74 -- np.empty(n_total, dtype=np.float64)"
    guard: "models.py:71 -- check_state(n_total*8, name='ts.extract_series')"
    batch_transient: "models.py -- to_pylist() per batch (3.5x factor)"
  intrinsic_bound: {axis: n, bound: 1000000, reason: "np.empty(n) full-series alloc"}
  streaming_variant: _iter_target_batches
  consumers: [NaiveForecaster, ThetaForecaster, OTMThetaForecaster, ETSForecaster, AutoETSForecaster, SARIMAForecaster, VAR, VECM, BVAR, TemporalHierarchy, TransformedTargetForecaster, EnsembleForecaster, GBDTForecaster]
  notes: >-
    Full-series target extraction. Leaf-layer: O(n) transient in caller.
    Streaming variant `_iter_target_batches` requires algorithm support
    (not yet wired). Backlog v0.9.190+.

- name: _ses_fit_simple
  cadw_function: cadw.ts.theta._ses_fit
  module: cadw.ts.theta
  layer: leaf
  status: draft
  bounded_state: false
  ram_formula: "n * f64 + 256"
  min_ram_formula: "1 * f64 + 256"
  formula_evidence:
    fitted_alloc: "theta.py:71 -- fitted = np.empty(n, dtype=np.float64)"
    note: "returns (lvl, fitted, sse); fitted is n-sized"
  intrinsic_bound: {axis: n, bound: 1000000, reason: "np.empty(n) transient"}
  streaming_variant: _ses_fit_streaming
  consumers: [ThetaForecaster, _MultiplicativeWrapper]
  notes: >-
    Simple SES (no seasonal, no trend). Streaming variant possible for
    s=1 (bit-identical, O(1) RAM); blocked by _initial_seasonal requiring
    full y for seasonal models. Backlog v0.9.190+. AP22: not unified
    with ets._ses_fit (different signatures: simple vs Holt-Winters).

- name: _ses_fit_hw
  cadw_function: cadw.ts.ets._ses_fit
  module: cadw.ts.ets
  layer: leaf
  status: verified
  bounded_state: false
  ram_formula: "2 * W_eff * f64 + 2 * seasonal_period * f64 + 256"
  min_ram_formula: "2 * 2 * seasonal_period * f64 + 2 * f64 + 256"
  formula_evidence:
    caller_bounds: "Caller uses _collect_last_w -> y_used of len <= W_eff"
    fitted_alloc: "ets.py:57 -- fitted = np.empty(len(y_used)) O(W_eff)"
    initial_seasonal: "from y_used (W-bounded); k = len(y_used) // s"
  window_truncatable:
    axis: n
    caller_prim: _collect_last_w
    min_window: "2 * seasonal_period"
    reason: "Holt-Winters on last W_eff obs is valid semantic variant (pelt precedent, DEC-072 §3); bit-identical when n <= W_eff"
  streaming_variant: null
  consumers: [ETSForecaster (s>1 or trend=True), AutoETSForecaster]
  notes: >-
    Holt-Winters. v0.9.189 (DEC-072): window-truncatable via caller using
    _collect_last_w. Caller computes W_eff from guard (typical
    target_fraction=0.25), passes y_used = last min(n, W_eff) to this leaf.
    Effective RAM = O(W_eff + batch). Bit-identical when n <= W_eff.
    Window-rejected ONLY if caller explicitly disables truncation
    (n > W_eff with max_window=None + strict=True -> MemoryLimitExceeded).
    AP22: distinct from theta._ses_fit (HW vs simple SES).


- name: stl_decompose
  cadw_function: cadw.ts._decomposition.stl_decompose
  module: cadw.ts._decomposition
  layer: leaf
  status: verified
  bounded_state: false
  ram_formula: "4 * W_eff * f64 + 512"
  min_ram_formula: "4 * 2 * seasonal_period * f64 + 512"
  formula_evidence:
    caller_bounds: "Caller passes y_used of len <= W_eff via _collect_last_w"
    arrays: "trend/seasonal/remainder O(W_eff); LOESS per-iter O(W_eff)"
    loess: "per-iter O(W_eff) working set; n_iter=2 default"
  window_truncatable:
    axis: n
    caller_prim: _collect_last_w
    min_window: "2 * seasonal_period"
    reason: "STL on last W_eff obs is valid semantic variant; STL local stationarity standard (prophet, MSTL restricted; DEC-072 §3)"
  streaming_variant: null
  consumers: [ThetaForecaster (s>1), OTMThetaForecaster (s>1), ETSForecaster (s>1)]
  notes: >-
    STL (Cleveland et al. 1990). v0.9.189 (DEC-072): window-truncatable
    via caller using _collect_last_w. Caller bounds y_used to W_eff;
    STL on W_eff window. Bit-identical when n <= W_eff. Prophet/MSTL
    restricted precedent: STL is inherently local-stationarity, window
    truncation semantically valid.

