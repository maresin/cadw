    with ets._ses_fit (different signatures: simple vs Holt-Winters).

- name: _ses_fit_hw
  cadw_function: cadw.ts.ets._ses_fit
  module: cadw.ts.ets
  layer: leaf
  status: draft
  bounded_state: false
  ram_formula: "n * f64 + 2 * seasonal_period * f64 + 256"
  min_ram_formula: "2 * f64 + 2 * f64 + 256"
  formula_evidence:
    fitted_alloc: "ets.py:57 -- fitted = np.empty(n); _initial_seasonal O(s*k)"
    note: "returns (lvl, tr, season, sse, fitted); fitted n-sized"
  intrinsic_bound: {axis: n, bound: 1000000, reason: "np.empty(n) transient"}
  streaming_variant: null
  consumers: [ETSForecaster, AutoETSForecaster]
  notes: >-
    Holt-Winters (damped + trend + seasonal). Streaming variant requires
    2-pass (initial seasonal from first k=n//s periods; not bit-identical
    from 1-pass). Backlog v0.9.190+. AP22: distinct from theta._ses_fit
    (HW vs simple SES).

- name: stl_decompose
  cadw_function: cadw.ts._decomposition.stl_decompose
  module: cadw.ts._decomposition
  layer: leaf
  status: draft
  bounded_state: false
  ram_formula: "4 * n * f64 + 512"
  min_ram_formula: "4 * 2 * seasonal_period * f64 + 512"
  formula_evidence:
    arrays: "_decomposition.py:155 -- trend + seasonal + remainder + work O(n)"
    loess: "per-iter O(n) working set; n_iter=2 default"
  intrinsic_bound: {axis: n, bound: 1000000, reason: "O(n) LOESS iterations"}
  streaming_variant: null
  consumers: [ThetaForecaster, OTMThetaForecaster, ETSForecaster]
  notes: >-
    STL (Cleveland et al. 1990). Streaming STL is hard (multiple LOESS
    passes on full y with periodic re-estimation). Backlog v0.9.190+
    (hard, 1-2 sessions). Seasonal models (Theta/OTM/ETS with s>1)
    remain bounded_by_domain until then.
