[project]
name = "cadw-framework"
version = "0.9.219"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "xxhash>=3.4.1",
]

[project.optional-dependencies]
# v0.9.6e1: pandas is opt-in for `to_batches(format="pandas")`.
# Core (`import cadw`, ops, ML, pivot) is pandas-free.
pandas = ["pandas>=3.0"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportImplicitOverride = false
reportDeprecated = false
reportGeneralTypeIssues = "warning"   # не error

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (E2E, >1s)",
    "ml: ML model tests (gbdt, linear, logistic, kmeans, pca, naive_bayes, metrics, cv, scalers)",
    "ts: time-series tests (rolling, expanding, ewm, ts toolkit)",
    "ops: ops primitive tests (groupby, join, dedup, sort, rank, quantile, resample, pivot, reduce, shuffle, topk)",
    "viz: visualization adapter tests (matplotlib, plotly, seaborn)",
    "pipeline: pipeline and DAG tests",
    "e2e: end-to-end integration tests",
]
testpaths = ["tests"]
norecursedirs = ["_legacy", ".venv", "build", "dist", ".hypothesis"]

[dependency-groups]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.18",
    "seaborn>=0.13",
]
dev = [
    "matplotlib>=3.8",
    "pandas>=3.0", # v0.9.6e1: test reference helpers use pandas
    "plotly>=5.18",
    "seaborn>=0.13",
    "pytest>=9.0.3",
    "pylint>=4.0.5",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "pandas-stubs>=3.0.0.260204",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.170.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "lifelines>=0.30.0",
    "statsmodels>=0.15.0",
    "ruptures>=1.1.9",
]
