[project]
name = "cadw-framework"
version = "0.9.25"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "psutil>=7.2.2",
    "pyarrow>=26.0.0",
    "xxhash>=3.4.1",
]

[project.optional-dependencies]
# v0.9.6e1: pandas is opt-in for `to_batches(format="pandas")`.
# Core (`import cadw`, ops, ML, pivot) is pandas-free.
pandas = ["pandas>=3.0"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportImplicitOverride = false
reportDeprecated = false
reportGeneralTypeIssues = "warning"   # не error

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (E2E, >1s)",
]
testpaths = ["tests"]
norecursedirs = ["_legacy", ".venv", "build", "dist"]

[dependency-groups]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.18",
    "seaborn>=0.13",
]
dev = [
    "matplotlib>=3.8",
    "pandas>=3.0",          # v0.9.6e1: test reference helpers use pandas
    "plotly>=5.18",
    "seaborn>=0.13",
    "pytest>=9.0.3",
    "pylint>=4.0.5",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
    "pandas-stubs>=3.0.0.260204",
]
